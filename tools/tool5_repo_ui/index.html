.md","title":"All Stop Initialization and Start Interface","kind":"system-requirements"},{"field":"parent-product-requirement","filename":"sysreq-all-stop-readiness-on-comm.md","title":"All Stop Readiness Gated on External-Source Communication","kind":"system-requirements"},{"field":"parent-product-requirement","filename":"sysreq-cat1-stop-when-no-remote-stop-source.md","title":"Cat1 Stop When No Remote Stop Source","kind":"system-requirements"},{"field":"parent-product-requirement","filename":"sysreq-comm-loss-log.md","title":"Communication Loss Log","kind":"system-requirements"},{"field":"parent-product-requirement","filename":"sysreq-no-comm-loss-during-startup.md","title":"No Communication-Loss Declaration During Startup","kind":"system-requirements"},{"field":"parent-product-requirement","filename":"sysreq-one-active-stop-mode.md","title":"Single Active Stop Mode","kind":"system-requirements"},{"field":"parent-product-requirement","filename":"sysreq-reject-all-stop-init-when-remote-stop.md","title":"Reject All Stop Initialization When Remote Stop Active","kind":"system-requirements"},{"field":"parent-product-requirement","filename":"sysreq-reject-remote-stop-init-when-all-stop.md","title":"Reject Remote Stop Initialization When All Stop Active","kind":"system-requirements"},{"field":"parent-product-requirement","filename":"sysreq-stop-command-on-all-stop-100ms.md","title":"Stop Command Within 100 ms on All Stop or Comm Loss","kind":"system-requirements"},{"field":"parent-product-requirement","filename":"sysreq-stop-command-processing-100ms.md","title":"Stop Command Processing Within 100 ms","kind":"system-requirements"},{"field":"parent-product-requirement","filename":"sysreq-stop-event-root-cause.md","title":"Stop Event Root-Cause Distinction","kind":"system-requirements"},{"field":"parent-product-requirement","filename":"sysreq-subscribe-all-stop-broadcaster.md","title":"Subscribe to All Stop Broadcaster","kind":"system-requirements"}]},{"id":"req-pr-07","filename":"req-pr-07.md","title":"Articulated Vehicle Support","bucket":"product","kind":"product-requirements","frontmatter":{"id":"req-pr-07","prd-id":"PR-07","title":"Articulated Vehicle Support","parent-use-cases":["uc-follow-path.md","uc-teleoperation.md"],"priority":"High"},"body":"\n<table>\n  <thead>\n    <tr><th>Field</th><th>Description</th></tr>\n  </thead>\n  <tbody>\n    <tr><td>ID</td><td>req-pr-07</td></tr>\n    <tr><td>PRD ID</td><td>PR-07</td></tr>\n    <tr><td>Parent Use Cases</td><td>uc-follow-path.md, uc-teleoperation.md</td></tr>\n    <tr><td>Priority</td><td>High</td></tr>\n    <tr><td>Requirement Statement</td><td>PRAK shall support autonomous control of articulated vehicles.</td></tr>\n    <tr><td>Rationale</td><td>A vehicle-class support capability; realized through the configurable kinematic model.</td></tr>\n    <tr><td>Acceptance Criteria</td><td>PRAK can be configured to autonomously control an articulated vehicle, with the kinematic model and motion behavior matching the articulated configuration.</td></tr>\n    <tr><td>PRD Coverage</td><td>UC: UC-02, UC-04; Release: R1.0; Goal: PG-02</td></tr>\n  </tbody>\n</table>\n","path":"product/requirements/product/req-pr-07.md","refs_out":[{"field":"parent-use-cases","filename":"uc-follow-path.md","title":"Follow a Structured Path from Command and Control","kind":"use-cases"},{"field":"parent-use-cases","filename":"uc-teleoperation.md","title":"Tele-operate Robot via Manual Control Inputs","kind":"use-cases"}],"refs_in":[{"field":"parent-product-requirement","filename":"sysreq-support-steering-box-vehicles.md","title":"Support Steering-Box Vehicles","kind":"system-requirements"}]}],"system-requirements":[{"id":"sysreq-api-versioning-and-training","filename":"sysreq-api-versioning-and-training.md","title":"API Versioning, Migration Guidance, and Integration Training","bucket":"actuation-framework","kind":"system-requirements","frontmatter":{"id":"sysreq-api-versioning-and-training","title":"API Versioning, Migration Guidance, and Integration Training","parent-product-requirement":"req-fr-27.md","parent-use-cases":["uc-path-to-actuation-framework.md"],"allocation":"Path-to-Actuation Framework","platform-team":"Polymorphous","priority":"High"},"body":"\n<table>\n  <thead>\n    <tr><th>Field</th><th>Description</th></tr>\n  </thead>\n  <tbody>\n    <tr><td>ID</td><td>sysreq-api-versioning-and-training</td></tr>\n    <tr><td>Parent Product Requirement</td><td>req-fr-27.md</td></tr>\n    <tr><td>Parent Use Cases</td><td>uc-path-to-actuation-framework.md</td></tr>\n    <tr><td>Allocation</td><td>Path-to-Actuation Framework</td></tr>\n    <tr><td>Platform Team</td><td>Polymorphous</td></tr>\n    <tr><td>Priority</td><td>High</td></tr>\n    <tr><td>Requirement Statement</td><td>When the framework's API or ICD changes incompatibly, PRAK shall publish a new version, document the breaking changes, and publish migration guidance; PRAK shall also provide integration documentation and training covering framework configuration, extension, build integration, and verification.</td></tr>\n    <tr><td>Rationale</td><td>Build-time API lifecycle + integration training (MPT/EPT).</td></tr>\n    <tr><td>Acceptance Criteria</td><td>Verified against req-fr-27.md for the Polymorphous allocation.</td></tr>\n  </tbody>\n</table>\n","path":"system/requirements/actuation-framework/sysreq-api-versioning-and-training.md","refs_out":[{"field":"parent-use-cases","filename":"uc-path-to-actuation-framework.md","title":"Path-to-Actuation Framework","kind":"use-cases"},{"field":"parent-product-requirement","filename":"req-fr-27.md","title":"API Versioning, Migration Guidance, and Integration Training","kind":"product-requirements"}],"refs_in":[]},{"id":"sysreq-configurable-kinematic-and-io-interfaces","filename":"sysreq-configurable-kinematic-and-io-interfaces.md","title":"Configurable Kinematic Model and Actuator/Sensor Interfaces","bucket":"actuation-framework","kind":"system-requirements","fron nd":"system-requirements","frontmatter":{"id":"sysreq-documented-extension-points","title":"Documented Framework Extension Points","parent-product-requirement":"req-fr-25.md","parent-use-cases":["uc-path-to-actuation-framework.md"],"allocation":"Path-to-Actuation Framework","platform-team":"Polymorphous","priority":"High"},"body":"\n<table>\n  <thead>\n    <tr><th>Field</th><th>Description</th></tr>\n  </thead>\n  <tbody>\n    <tr><td>ID</td><td>sysreq-documented-extension-points</td></tr>\n    <tr><td>Parent Product Requirement</td><td>req-fr-25.md</td></tr>\n    <tr><td>Parent Use Cases</td><td>uc-path-to-actuation-framework.md</td></tr>\n    <tr><td>Allocation</td><td>Path-to-Actuation Framework</td></tr>\n    <tr><td>Platform Team</td><td>Polymorphous</td></tr>\n    <tr><td>Priority</td><td>High</td></tr>\n    <tr><td>Requirement Statement</td><td>The path-to-actuation framework shall define stable, documented extension points where robot-specific actuation logic can be added without modifying framework source code.</td></tr>\n    <tr><td>Rationale</td><td>Build-time extension points for dev-team integration.</td></tr>\n    <tr><td>Acceptance Criteria</td><td>Verified against req-fr-25.md for the Polymorphous allocation.</td></tr>\n  </tbody>\n</table>\n","path":"system/requirements/actuation-framework/sysreq-documented-extension-points.md","refs_out":[{"field":"parent-use-cases","filename":"uc-path-to-actuation-framework.md","title":"Path-to-Actuation Framework","kind":"use-cases"},{"field":"parent-product-requirement","filename":"req-fr-25.md","title":"Documented Extension Points","kind":"product-requirements"}],"refs_in":[]},{"id":"sysreq-framework-verification-support","filename":"sysreq-framework-verification-support.md","title":"Framework Verification Support","bucket":"actuation-framework","kind":"system-requirements","frontmatter":{"id":"sysreq-framework-verification-support","title":"Framework Verification Support","parent-product-requirement":"req-fr-2 ver Runtime ICD","parent-product-requirement":"req-fr-01.md","parent-use-cases":["uc-safe-to-move-framework.md"],"allocation":"Electronics","platform-team":"Electronics","priority":"High"},"body":"\n<table>\n  <thead>\n    <tr><th>Field</th><th>Description</th></tr>\n  </thead>\n  <tbody>\n    <tr><td>ID</td><td>sysreq-accept-c2-movement-request</td></tr>\n    <tr><td>Parent Product Requirement</td><td>req-fr-01.md</td></tr>\n    <tr><td>Parent Use Cases</td><td>uc-safe-to-move-framework.md</td></tr>\n    <tr><td>Allocation</td><td>Electronics</td></tr>\n    <tr><td>Platform Team</td><td>Electronics</td></tr>\n    <tr><td>Priority</td><td>High</td></tr>\n    <tr><td>Requirement Statement</td><td>When an authorized Command and Control (C2) system issues a movement request over the runtime ICD, the system shall validate the request against the active ICD and accept it for motion-authorization evaluation.</td></tr>\n    <tr><td>Rationale</td><td>Entry point of the Safe-to-Move loop. The runtime ICD is the stable contract to C2 (PR-02); acceptance is gated on a well-formed request from an authorized source.</td></tr>\n    <tr><td>Acceptance Criteria</td><td><ul><li>A well-formed request from an authorized C2 is accepted and forwarded to evaluation.</li><li>A malformed request, or one from an unauthorized source, is rejected with a diagnostic reason.</li></ul></td></tr>\n  </tbody>\n</table>\n","path":"system/requirements/motion-authorization-framework/sysreq-accept-c2-movement-request.md","refs_out":[{"field":"parent-use-cases","filename":"uc-safe-to-move-framework.md","title":"Safe to Move Framework","kind":"use-cases"},{"field":"parent-product-requirement","filename":"req-fr-01.md","title":"Accept Movement Request from Authorized C2","kind":"product-requirements"}],"refs_in":[]},{"id":"sysreq-confirm-auto-manual-in-auto","filename":"sysreq-confirm-auto-manual-in-auto.md","title":"Confirm Auto/Manual Switch in Auto","bucket":"motion-authorization-framework","kind":"system-requirements","frontmatter":{"id":"sysreq-confirm-auto-manual-in-auto","title":"Confirm Auto/Manual Switch in Auto","parent-product-requirement":"req-fr-03.md","parent-use-cases":["uc-safe-to-move-framework.md"],"allocation":"Electronics","platform-team":"Electronics","priority":"Critical"},"body":"\n<table>\n  <thead>\n    <tr><th>Field</th><th>Description</th></tr>\n  </thead>\n  <tbody>\n    <tr><td>ID</td><td>sysreq-confirm-auto-manual-in-auto</td></tr>\n    <tr><td>Parent Product Requirement</td><td>req-fr-03.md</td></tr>\n    <tr><td>Parent Use Cases</td><td>uc-safe-to-move-framework.md</td></tr>\n    <tr><td>Allocation</td><td>Electronics</td></tr>\n    <tr><td>Platform Team</td><td>Electronics</td></tr>\n    <tr><td>Priority</td><td>Critical</td></tr>\n    <tr><td>Requirement Statement</td><td>When PRAK evaluates Motion-Permitted conditions, the system shall confirm that the auto/manual switch is in the auto position before producing motion-enabling authorization.</td></tr>\n    <tr><td>Rationale</td><td>The auto/manual switch is an Electronics-owned Motion-Permitted precondition that asserts operator intent for autonomous motion.</td></tr>\n    <tr><td>Acceptance Criteria</td><td><ul><li>Switch not in auto &rarr; no motion-enabling authorization.</li><li>Switch in auto &rarr; condition passes; a switch-state change is reflected within the configured interval.</li></ul></td></tr>\n  </tbody>\n</table>\n","path":"system/requirements/motion-authorization-framework/sysreq-confirm-auto-manual-in-auto.md","refs_out":[{"field":"parent-use-cases","filename":"uc-safe-to-move-framework.md","title":"Safe to Move Framework","kind":"use-cases"},{"field":"parent-product-requirement","filename":"req-fr-03.md","title":"Confirm Motion-Permitted Conditions","kind":"product-requirements"}],"refs_in":[]},{"id":"sysreq-confirm-estop-clear","filename":"sysreq-confirm-estop-clear.md","title":"Confirm E-Stop State Clear","bucket":"motion-authorization-framework","kind":"system-requirements","frontmatter":{"id":"sysreq-confirm-estop-clear","title":"Confirm E-Stop State Clear","parent-product-requirement":"req-fr-03.md","parent-use-cases":["uc-safe-to-move-framework.md"],"allocation":"RCU","platform-team":"Polymorphous","priority":"Critical"},"body":"\n<table>\n  <thead>\n    <tr><th>Field</th><th>Description</th></tr>\n  </thead>\n  <tbody>\n    <tr><td>ID</td><td>sysreq-confirm-estop-clear</td></tr>\n    <tr><td>Parent Product Requirement</td><td>req-fr-03.md</td></tr>\n    <tr><td>Parent Use Cases</td><td>uc-safe-to-move-framework.md</td></tr>\n    <tr><td>Allocation</td><td>RCU</td></tr>\n    <tr><td>Platform Team</td><td>Polymorphous</td></tr>\n    <tr><td>Priority</td><td>Critical</td></tr>\n    <tr><td>Requirement Statement</td><td>When PRAK evaluates Motion-Permitted conditions, the system shall confirm that the E-Stop state is clear before producing any motion-enabling authorization.</td></tr>\n    <tr><td>Rationale</td><td>E-Stop is a hard motion-permitted precondition. The framework withholds motion-enabling authorization while E-Stop is engaged rather than enforcing the stop physically (architecture decision #2).</td></tr>\n    <tr><td>Acceptance Criteria</td><td><ul><li>With E-Stop engaged, no motion-enabling authorization is produced.</li><li>A transition from engaged to clear is reflected within the configured evaluation interval.</li></ul></td></tr>\n  </tbody>\n</table>\n","path":"system/requirements/motion-authorization-framework/sysreq-confirm-estop-clear.md","refs_out":[{"field":"parent-use-cases","filename":"uc-safe-to-move-framework.md","title":"Safe to Move Framework","kind":"use-cases"},{"field":"parent-product-requirement","filename":"req-fr-03.md","title":"Confirm Motion-Permitted Conditions","kind":"product-requirements"}],"refs_in":[]},{"id":"sysreq-confirm-stop-capability","filename":"sysreq-confirm-stop-capability.md","title":"Confirm Stop-Capability Operational","bucket":"motion-authorization-framework","kind":"system-requirements","frontmatter":{"id":"sysreq-confirm-stop-capability","title":"Confirm Stop-Capability Operational","parent-product-requirement":"req-fr-04.md","parent-use-cases":["uc-safe-to-move-framework.md"],"allocation":"RCU","platform-team":"Polymorphous","priority":"Critical"},"body":"\n<table>\n  <thead>\n    <tr><th>Field</th><th>Description</th></tr>\n  </thead>\n  <tbody>\n    <tr><td>ID</td><td>sysreq-confirm-stop-capability</td></tr>\n    <tr><td>Parent Product Requirement</td><td>req-fr-04.md</td></tr>\n    <tr><td>Parent Use Cases</td><td>uc-safe-to-move-framework.md</td></tr>\n    <tr><td>Allocation</td><td>RCU</td></tr>\n    <tr><td>Platform Team</td><td>Polymorphous</td></tr>\n    <tr><td>Priority</td><td>Critical</td></tr>\n    <tr><td>Requirement Statement</td><td>When PRAK evaluates Stop-Capable conditions, the system shall confirm that controlled-stop (Cat1/Cat2) and emergency-stop (Cat0) capabilities are defined and operational before producing motion-enabling authorization.</td></tr>\n    <tr><td>Rationale</td><td>Stop-Capable is a continuous motion-authorization condition (decision #3): the robot must be able to stop before and throughout any commanded motion.</td></tr>\n    <tr><td>Acceptance Criteria</td><td><ul><li>If either controlled-stop or emergency-stop is undefined or non-operational, no motion-enabling authorization is produced.</li><li>Both capabilities operational &rarr; condition passes.</li></ul></td></tr>\n  </tbody>\n</table>\n","path":"system/requirements/motion-authorization-framework/sysreq-confirm-stop-capability.md","refs_out":[{"field":"parent-use-cases","filename":"uc-safe-to-move-framework.md","title":"Safe to Move Framework","kind":"use-cases"},{"field":"parent-product-requirement","filename":"req-fr-04.md","title":"Confirm Stop-Capable Conditions","kind":"product-requirements"}],"refs_in":[]},{"id":"sysreq-confirm-valid-path-plan-present","filename":"sysreq-confirm-valid-path-plan-present.md","title":"Confirm Valid Path Plan Present","bucket":"motion-authorization-framework","kind":"system-requirements","frontmatter":{"id":"sysreq-confirm-valid-path-plan-present","title":"Confirm Valid Path Plan Present","parent-product-requirement":"req-fr-03.md","parent-use-cases":["uc-safe-to-move-framework.md"],"allocation":"RCU","platform-team":"Polymorphous","priority":"Critical"},"body":"\n<table>\n  <thead>\n    <tr><th>Field</th><th>Description</th></tr>\n  </thead>\n  <tbody>\n    <tr><td>ID</td><td>sysreq-confirm-valid-path-plan-present</td></tr>\n    <tr><td>Parent Product Requirement</td><td>req-fr-03.md</td></tr>\n    <tr><td>Parent Use Cases</td><td>uc-safe-to-move-framework.md</td></tr>\n    <tr><td>Allocation</td><td>RCU</td></tr>\n    <tr><td>Platform Team</td><td>Polymorphous</td></tr>\n    <tr><td>Priority</td><td>Critical</td></tr>\n    <tr><td>Requirement Statement</td><td>When PRAK evaluates Motion-Permitted conditions, the system shall confirm that a valid C2-supplied path plan is present before producing motion-enabling authorization.</td></tr>\n    <tr><td>Rationale</td><td>PRAK does not plan paths (C2-plans architecture, decision #1); it confirms that a valid plan has been supplied. Validation of plan content against geometric, kinematic, and geofence constraints belongs to the path-following UC (FR-06) and is not restated here.</td></tr>\n    <tr><td>Acceptance Criteria</td><td><ul><li>Absent or malformed path plan &rarr; no motion-enabling authorization.</li><li>Presence of a structurally valid C2-supplied plan &rarr; condition passes.</li></ul></td></tr>\n  </tbody>\n</table>\n","path":"system/requirements/motion-authorization-framework/sysreq-confirm-valid-path-plan-present.md","refs_out":[{"field":"parent-use-cases","filename":"uc-safe-to-move-framework.md","title":"Safe to Move Framework","kind":"use-cases"},{"field":"parent-product-requirement","filename":"req-fr-03.md","title":"Confirm Motion-Permitted Conditions","kind":"product-requirements"}],"refs_in":[]},{"id":"sysreq-evaluate-vehicle-state-conditions","filename":"sysreq-evaluate-vehicle-state-conditions.md","title":"Evaluate Vehicle-State Safe-to-Move Conditions","bucket":"motion-authorization-framework","kind":"system-requirements","frontmatter":{"id":"sysreq-evaluate-vehicle-state-conditions","title":"Evaluate Vehicle-State Safe-to-Move Conditions","parent-product-requirement":"req-fr-02.md","parent-use-cases":["uc-safe-to-move-framework.md"],"allocation":"RCU","platform-team":"Polymorphous","priority":"Critical"},"body":"\n<table>\n  <thead>\n    <tr><th>Field</th><th>Description</th></tr>\n  </thead>\n  <tbody>\n    <tr><td>ID</td><td>sysreq-evaluate-vehicle-state-conditions</td></tr>\n    <tr><td>Parent Product Requirement</td><td>req-fr-02.md</td></tr>\n    <tr><td>Parent Use Cases</td><td>uc-safe-to-move-framework.md</td></tr>\n    <tr><td>Allocation</td><td>RCU</td></tr>\n    <tr><td>Platform Team</td><td>Polymorphous</td></tr>\n    <tr><td>Priority</td><td>Critical</td></tr>\n    <tr><td>Requirement Statement</td><td>When PRAK receives a movement request, the system shall evaluate the vehicle-state Safe-to-Move conditions &mdash; transmission state, braking state, power state, fault state, network link status, C2/RCU software compatibility, and sensor operational status &mdash; and produce a per-condition pass/fail result available to the motion-authorization gate.</td></tr>\n    <tr><td>Rationale</td><td>These are the on-board, RCU-observable inputs to the Safe-to-Move evaluation. Consolidating them behind one subsystem function gives the authorization gate a well-defined input contract. Obstacle detection and environmental-envelope conditions are sourced externally (C2 today) and are out of scope for this subsystem &mdash; see GAPS.md.</td></tr>\n    <tr><td>Acceptance Criteria</td><td><ul><li>For each listed condition, evaluation yields a deterministic pass/fail within the configured evaluation interval.</li><li>A failed read or stale input yields <em>fail</em> (fail-safe default).</li><li>The aggregate result enumerates every failing condition for downstream diagnostics.</li></ul></td></tr>\n  </tbody>\n</table>\n","path":"system/requirements/motion-authorization-framework/sysreq-evaluate-vehicle-state-conditions.md","refs_out":[{"field":"parent-use-cases","filename":"uc-safe-to-move-framework.md","title":"Safe to Move Framework","kind":"use-cases"},{"field":"parent-product-requirement","filename":"req-fr-02.md","title":"Evaluate Safe-to-Move Conditions","kind":"product-requirements"}],"refs_in":[]},{"id":"sysreq-gate-continuous-motion-authorization","filename":"sysreq-gate-continuous-motion-authorization.md","title":"Continuously Gate Motion Authorization","bucket":"motion-authorization-framework","kind":"system-requirements","frontmatter":{"id":"sysreq-gate-continuous-motion-authorization","title":"Continuously Gate Motion Authorization","parent-product-requirement":"req-fr-05.md","parent-use-cases":["uc-safe-to-move-framework.md"],"allocation":"RCU","platform-team":"Polymorphous","priority":"Critical"},"body":"\n<table>\n  <thead>\n    <tr><th>Field</th><th>Description</th></tr>\n  </thead>\n  <tbody>\n    <tr><td>ID</td><td>sysreq-gate-continuous-motion-authorization</td></tr>\n    <tr><td>Parent Product Requirement</td><td>req-fr-05.md</td></tr>\n    <tr><td>Parent Use Cases</td><td>uc-safe-to-move-framework.md</td></tr>\n    <tr><td>Allocation</td><td>RCU</td></tr>\n    <tr><td>Platform Team</td><td>Polymorphous</td></tr>\n    <tr><td>Priority</td><td>Critical</td></tr>\n    <tr><td>Requirement Statement</td><td>While motion is commanded, the system shall continuously re-evaluate all Safe-to-Move, Motion-Permitted, and Stop-Capable conditions and shall withhold actuation commands whenever any condition is false.</td></tr>\n    <tr><td>Rationale</td><td>Motion authorization is a continuous condition, not a one-shot start gate (decision #3). The framework cannot physically enforce motion; it withholds the actuation commands that would induce unauthorized motion (decision #2). This requirement aggregates inputs owned by other teams (GNC localization, Perception zone status, Electronics auto/manual switch) &mdash; a candidate Cross-team interface in a later pass.</td></tr>\n    <tr><td>Acceptance Criteria</td><td><ul><li>Injecting a false condition mid-motion causes actuation commands to be withheld within the configured latency budget.</li><li>Actuation is re-enabled only after a full re-evaluation pass confirms every condition true.</li></ul></td></tr>\n  </tbody>\n</table>\n","path":"system/requirements/motion-authorization-framework/sysreq-gate-continuous-motion-authorization.md","refs_out":[{"field":"parent-use-cases","filename":"uc-safe-to-move-framework.md","title":"Safe to Move Framework","kind":"use-cases"},{"field":"parent-product-requirement","filename":"req-fr-05.md","title":"Gate Motion on Continuous Authorization","kind":"product-requirements"}],"refs_in":[]},{"id":"sysreq-provide-localization-availability","filename":"sysreq-provide-localization-availability.md","title":"Provide Localization Availability and Confidence","bucket":"motion-authorization-framework","kind":"system-requirements","frontmatter":{"id":"sysreq-provide-localization-availability","title":"Provide Localization Availability and Confidence","parent-product-requirement":"req-fr-03.md","parent-use-cases":["uc-safe-to-move-framework.md"],"allocation":"GNC","platform-team":"GNC","priority":"Critical"},"body":"\n<table>\n  <thead>\n    <tr><th>Field</th><th>Description</th></tr>\n  </thead>\n  <tbody>\n    <tr><td>ID</td><td>sysreq-provide-localization-availability</td></tr>\n    <tr><td>Parent Product Requirement</td><td>req-fr-03.md</td></tr>\n    <tr><td>Parent Use Cases</td><td>uc-safe-to-move-framework.md</td></tr>\n    <tr><td>Allocation</td><td>GNC</td></tr>\n    <tr><td>Platform Team</td><td>GNC</td></tr>\n    <tr><td>Priority</td><td>Critical</td></tr>\n    <tr><td>Requirement Statement</td><td>When PRAK evaluates Motion-Permitted conditions, the GNC subsystem shall provide a localization-available indication with an associated confidence value.</td></tr>\n    <tr><td>Rationale</td><td>Localization availability is a Motion-Permitted precondition owned by GNC. The gate consumes this indication; full pose-estimation behavior is decomposed under the path-following UC (FR-08).</td></tr>\n    <tr><td>Acceptance Criteria</td><td><ul><li>Localization unavailable, or confidence below the configured threshold, &rarr; indication reflects <em>unavailable</em>.</li><li>The gate treats <em>unavailable</em> as a failing Motion-Permitted condition.</li></ul></td></tr>\n  </tbody>\n</table>\n","path":"system/requirements/motion-authorization-framework/sysreq-provide-localization-availability.md","refs_out":[{"field":"parent-use-cases","filename":"uc-safe-to-move-framework.md","title":"Safe to Move Framework","kind":"use-cases"},{"field":"parent-product-requirement","filename":"req-fr-03.md","title":"Confirm Motion-Permitted Conditions","kind":"product-requirements"}],"refs_in":[]},{"id":"sysreq-provide-operating-zone-status","filename":"sysreq-provide-operating-zone-status.md","title":"Provide Operating-Zone Status","bucket":"motion-authorization-framework","kind":"system-requirements","frontmatter":{"id":"sysreq-provide-operating-zone-status","title":"Provide Operating-Zone Status","parent-product-requirement":"req-fr-02.md","parent-use-cases":["uc-safe-to-move-framework.md"],"allocation":"Perception","platform-team":"Perception","priority":"Critical"},"body":"\n<table>\n  <thead>\n    <tr><th>Field</th><th>Description</th></tr>\n  </thead>\n  <tbody>\n    <tr><td>ID</td><td>sysreq-provide-operating-zone-status</td></tr>\n    <tr><td>Parent Product Requirement</td><td>req-fr-02.md</td></tr>\n    <tr><td>Parent Use Cases</td><td>uc-safe-to-move-framework.md</td></tr>\n    <tr><td>Allocation</td><td>Perception</td></tr>\n    <tr><td>Platform Team</td><td>Perception</td></tr>\n    <tr><td>Priority</td><td>Critical</td></tr>\n    <tr><td>Requirement Statement</td><td>Where Perception-sourced operating-zone data is available, the system shall determine the operating-zone status (restricted, exclusionary, or open) and provide it to the Safe-to-Move evaluation.</td></tr>\n    <tr><td>Rationale</td><td>Operating-zone status is jointly owned with C2 in the seed list; the Perception-owned determination is captured here. In R1 the status may be supplied via C2, with Perception ownership as the target state. Obstacle detection (C2 today, Perception later) and environmental-envelope evaluation (C2) remain out of scope &mdash; see GAPS.md.</td></tr>\n    <tr><td>Acceptance Criteria</td><td><ul><li>When zone data indicates exclusionary or restricted, the status provided to the gate reflects it.</li><li>Absence of zone data is reported as <em>indeterminate</em> and treated fail-safe by the gate.</li></ul></td></tr>\n  </tbody>\n</table>\n","path":"system/requirements/motion-authorization-framework/sysreq-provide-operating-zone-status.md","refs_out":[{"field":"parent-use-cases","filename":"uc-safe-to-move-framework.md","title":"Safe to Move Framework","kind":"use-cases"},{"field":"parent-product-requirement","filename":"req-fr-02.md","title":"Evaluate Safe-to-Move Conditions","kind":"product-requirements"}],"refs_in":[]},{"id":"sysreq-publish-motion-authorization-state","filename":"sysreq-publish-motion-authorization-state.md","title":"Publish Motion-Authorization State and Diagnostics","bucket":"motion-authorization-framework","kind":"system-requirements","frontmatter":{"id":"sysreq-publish-motion-authorization-state","title":"Publish Motion-Authorization State and Diagnostics","parent-product-requirement":"req-fr-05.md","parent-use-cases":["uc-safe-to-move-framework.md"],"allocation":"Electronics","platform-team":"Electronics","priority":"High"},"body":"\n<table>\n  <thead>\n    <tr><th>Field</th><th>Description</th></tr>\n  </ eptance Criteria</td><td><ul><li>Obstacles within the envelope are detected and reported within the configured latency.</li><li>Detections are provided to the motion-control function for stop/avoidance.</li></ul></td></tr>\n  </tbody>\n</table>\n","path":"system/requirements/path-following/sysreq-detect-obstacles.md","refs_out":[{"field":"parent-use-cases","filename":"uc-follow-path.md","title":"Follow a Structured Path from Command and Control","kind":"use-cases"},{"field":"parent-use-cases","filename":"uc-teleoperation.md","title":"Tele-operate Robot via Manual Control Inputs","kind":"use-cases"},{"field":"parent-product-requirement","filename":"req-fr-29.md","title":"Obstacle Detection and Avoidance","kind":"product-requirements"}],"refs_in":[]},{"id":"sysreq-detect-path-deviations-violations","filename":"sysreq-detect-path-deviations-violations.md","title":"Detect Path Deviations and Rule Violations","bucket":"path-following","kind":"system-requirements","frontmatter":{"id":"sysreq-detect-path-deviations-violations","title":"Detect Path Deviations and Rule Violations","parent-product-requirement":"req-fr-12.md","parent-use-cases":["uc-follow-path.md"],"allocation":"RCU","platform-team":"Polymorphous","priority":"Critical"},"body":"\n<table>\n  <thead>\n    <tr><th>Field</th><th>Description</th></tr>\n  </thead>\n  <tbody>\n    <tr><td>ID</td><td>sysreq-detect-path-deviations-violations</td></tr>\n    <tr><td>Parent Product Requirement</td><td>req-fr-12.md</td></tr>\n    <tr><td>Parent Use Cases</td><td>uc-follow-path.md</td></tr>\n    <tr><td>Allocation</td><td>RCU</td></tr>\n    <tr><td>Platform Team</td><td>Polymorphous</td></tr>\n    <tr><td>Priority</td><td>Critical</td></tr>\n    <tr><td>Requirement Statement</td><td>While executing a path, the system shall detect lateral deviation from the lane centerline, rule violations (lane direction, speed limit, prohibited transition, control point), and blocked or invalid routes.</td></tr>\n    <tr><td>Rationale</td Platform Team</td><td>GNC</td></tr>\n    <tr><td>Priority</td><td>High</td></tr>\n    <tr><td>Requirement Statement</td><td>When localization is active, the GNC subsystem shall acquire sensor data, fuse the inputs to determine the robot pose, and express the pose in a defined real-world coordinate frame.</td></tr>\n    <tr><td>Rationale</td><td>GNC-owned localization underpinning path tracking and the Motion-Permitted localization-available condition.</td></tr>\n    <tr><td>Acceptance Criteria</td><td><ul><li>Pose is produced at the configured rate in the defined coordinate frame.</li><li>Degraded or absent sensor inputs are reflected in the published confidence value.</li></ul></td></tr>\n  </tbody>\n</table>\n","path":"system/requirements/path-following/sysreq-estimate-pose-sensor-fusion.md","refs_out":[{"field":"parent-use-cases","filename":"uc-follow-path.md","title":"Follow a Structured Path from Command and Control","kind":"use-cases"},{"field":"parent-product-requirement","filename":"req-fr-08.md","title":"Pose Estimation and Localization Confidence","kind":"product-requirements"}],"refs_in":[]},{"id":"sysreq-execute-path-with-motion-limits","filename":"sysreq-execute-path-with-motion-limits.md","title":"Execute Path Within Motion Limits","bucket":"path-following","kind":"system-requirements","frontmatter":{"id":"sysreq-execute-path-with-motion-limits","title":"Execute Path Within Motion Limits","parent-product-requirement":"req-fr-09.md","parent-use-cases":["uc-follow-path.md"],"allocation":"RCU","platform-team":"Polymorphous","priority":"High"},"body":"\n<table>\n  <thead>\n    <tr><th>Field</th><th>Description</th></tr>\n  </thead>\n  <tbody>\n    <tr><td>ID</td><td>sysreq-execute-path-with-motion-limits</td></tr>\n    <tr><td>Parent Product Requirement</td><td>req-fr-09.md</td></tr>\n    <tr><td>Parent Use Cases</td><td>uc-follow-path.md</td></tr>\n    <tr><td>Allocation</td><td>RCU</td></tr>\n    <tr><td>Platform Team</td><td>Polymorphous</td></tr>\n    <tr><td>Priority</td><td>High</td></tr>\n    <tr><td>Requirement Statement</td><td>While executing a validated path, the system shall process path segments in order, convert them to actuation commands using sensor feedback to track the path, and produce actuation commands that conform to the configured kinematic, velocity, and acceleration limits.</td></tr>\n    <tr><td>Rationale</td><td>Core path-following execution. The framework produces commanded values that conform to motion limits rather than physically enforcing them (decision #2).</td></tr>\n    <tr><td>Acceptance Criteria</td><td><ul><li>Segments are actuated in the order received.</li><li>Commanded values never exceed configured kinematic, velocity, or acceleration limits.</li><li>Cross-track error remains within tolerance under nominal conditions.</li></ul></td></tr>\n  </tbody>\n</table>\n","path":"system/requirements/path-following/sysreq-execute-path-with-motion-limits.md","refs_out":[{"field":"parent-use-cases","filename":"uc-follow-path.md","title":"Follow a Structured Path from Command and Control","kind":"use-cases"},{"field":"parent-product-requirement","filename":"req-fr-09.md","title":"Execute Path with Motion-Limit Conformance","kind":"product-requirements"}],"refs_in":[]},{"id":"sysreq-prohibited-transition-guard","filename":"sysreq-prohibited-transition-guard.md","title":"Guard Against Prohibited Motion Transitions","bucket":"path-following","kind":"system-requirements","frontmatter":{"id":"sysreq-prohibited-transition-guard","title":"Guard Against Prohibited Motion Transitions","parent-product-requirement":"req-fr-11.md","parent-use-cases":["uc-follow-path.md","uc-teleoperation.md"],"allocation":"RCU","platform-team":"Polymorphous","priority":"Critical"},"body":"\n<table>\n  <thead>\n    <tr><th>Field</th><th>Description</th></tr>\n  </thead>\n  <tbody>\n    <tr><td>ID</td><td>sysreq-prohibited-transition-guard</td></tr>\n    <tr><td>Parent Product Requirement</td><td>req-fr-11.md</td></tr>\n    <tr><td>Parent Use Cases</td><td>uc-follow-path.md, uc-teleoperation.md</td></tr>\n    <tr><td>Allocation</td><td>RCU</td></tr>\n    <tr><td>Platform Team</td><td>Polymorphous</td></tr>\n    <tr><td>Priority</td><td>Critical</td></tr>\n    <tr><td>Requirement Statement</td><td>While performing motion, the system shall withhold any actuation command that would induce a prohibited motion transition (for example, reversing without first completing a controlled stop), regardless of the command source.</td></tr>\n    <tr><td>Rationale</td><td>Cross-cutting safety guard (decision #2): the framework withholds offending actuation rather than enforcing physically. Applies to both C2 path execution and tele-op direct actuation &mdash; authored here, referenced from UC-04.</td></tr>\n    <tr><td>Acceptance Criteria</td><td><ul><li>A command sequence that would induce a prohibited transition results in the offending actuation being withheld and a controlled stop inserted.</li><li>Behavior holds under both C2 path execution and tele-op direct actuation.</li></ul></td></tr>\n  </tbody>\n</table>\n","path":"system/requirements/path-following/sysreq-prohibited-transition-guard.md","refs_out":[{"field":"parent-use-cases","filename":"uc-follow-path.md","title":"Follow a Structured Path from Command and Control","kind":"use-cases"},{"field":"parent-use-cases","filename":"uc-teleoperation.md","title":"Tele-operate Robot via Manual Control Inputs","kind":"use-cases"},{"field":"parent-product-requirement","filename":"req-fr-11.md","title":"Prohibited Motion Transition Guard","kind":"product-requirements"}],"refs_in":[]},{"id":"sysreq-publish-localization-confidence","filename":"sysreq-publish-localization-confidence.md","title":"Publish Localization Confidence","bucket":"path-following","kind":"system-requirements","frontmatter":{"id":"sysreq-publish-localization-confidence","title":"Publish Localization Confidence","parent-product-requirement":"req-fr-08.md","parent-use-cases":["uc-follow-path.md"],"allocation":"GNC","platform-team":"GNC","priority":"High"},"body":"\n<table>\n  <thead>\n    <tr><th>Field</th><th>Description</th></tr>\n  </thead>\n  <tbody>\n    <tr><td>ID</td><td>sysreq-publish-localization-confidence</td></tr>\n    <tr><td>Parent Product Requirement</td><td>req-fr-08.md</td></tr>\n    <tr><td>Parent Use Cases</td><td>uc-follow-path.md</td></tr>\n    <tr><td>Allocation</td><td>GNC</td></tr>\n    <tr><td>Platform Team</td><td>GNC</td></tr>\n    <tr><td>Priority</td><td>High</td></tr>\n    <tr><td>Requirement Statement</td><td>When localization is active, the GNC subsystem shall publish a localization-confidence value bounded to the active map structure where present.</td></tr>\n    <tr><td>Rationale</td><td>The confidence value feeds the motion-authorization gate and path-execution telemetry; bounding to map structure keeps confidence meaningful in structured environments.</td></tr>\n    <tr><td>Acceptance Criteria</td><td><ul><li>Confidence is published at the configured cadence.</li><li>Confidence is bounded to the active map structure when a structured map is present.</li><li>Below-threshold confidence is consumable by the motion-authorization gate.</li></ul></td></tr>\n  </tbody>\n</table>\n","path":"system/requirements/path-following/sysreq-publish-localization-confidence.md","refs_out":[{"field":"parent-use-cases","filename":"uc-follow-path.md","title":"Follow a Structured Path from Command and Control","kind":"use-cases"},{"field":"parent-product-requirement","filename":"req-fr-08.md","title":"Pose Estimation and Localization Confidence","kind":"product-requirements"}],"refs_in":[]},{"id":"sysreq-publish-path-execution-telemetry","filename":"sysreq-publish-path-execution-telemetry.md","title":"Publish Path-Execution Telemetry and Completion","bucket":"path-following","kind":"system-requirements","frontmatter":{"id":"sysreq-publish-path-execution-telemetry","title":"Publish Path-Execution Telemetry and Completion","parent-product-requirement":"req-fr-13.md","parent-use-cases":["uc-follow-path.md"],"allocation":"Electronics","platform-team":"Electronics","priority":"High"},"body":"\n<table>\n  <thead>\n    <tr><th>Field</th><th>Description</th></tr>\n  </thead>\n  <tbody>\n    <tr><td>ID</td><td>sysreq-publish-path-execution-telemetry</td></tr>\n    <tr><td>Parent Product Requirement</td><td>req-fr-13.md</td></tr>\n    <tr><td>Parent Use Cases</td><td>uc-follow-path.md</td></tr>\n    <tr><td>Allocation</td><td>Electronics</td></tr>\n    <tr><td>Platform Team</td><td>Electronics</td></tr>\n    <tr><td>Priority</td><td>High</td></tr>\n    <tr><td>Requirement Statement</td><td>While executing a path, the system shall publish path-execution telemetry (current pose, path progress, cross-track deviation) to C2 at the configured cadence, and shall publish a path-completion notification when the endpoint is reached within tolerance.</td></tr>\n    <tr><td>Rationale</td><td>Provides observable path-execution state to C2 (PR-03).</td></tr>\n    <tr><td>Acceptance Criteria</td><td><ul><li>Telemetry is published at the configured cadence with current pose, path progress, and cross-track deviation.</li><li>A completion notification is emitted when the endpoint is reached within tolerance.</li></ul></td></tr>\n  </tbody>\n</table>\n","path":"system/requirements/path-following/sysreq-publish-path-execution-telemetry.md","refs_out":[{"field":"parent-use-cases","filename":"uc-follow-path.md","title":"Follow a Structured Path from Command and Control","kind":"use-cases"},{"field":"parent-product-requirement","filename":"req-fr-13.md","title":"Publish Path-Execution Telemetry and Completion","kind":"product-requirements"}],"refs_in":[]},{"id":"sysreq-report-execution-events-to-c2","filename":"sysreq-report-execution-events-to-c2.md","title":"Report Path-Execution Events to C2","bucket":"path-following","kind":"system-requirements","frontmatter":{"id":"sysreq-report-execution-events-to-c2","title":"Report Path-Execution Events to C2","parent-product-requirement":"req-fr-12.md","parent-use-cases":["uc-follow-path.md"],"allocation":"Electronics","platform-team":"Electronics","priority":"Critical"},"body":"\n<table>\n  <thead>\n    <tr><th>Field</th><th>Description</th></tr>\n  </thead>\n  <tbody>\n    <tr><td>ID</td><td>sysreq-report-execution-events-to-c2</td></tr>\n    <tr><td>Parent Product Requirement</td><td>req-fr-12.md</td></tr>\n    <tr><td>Parent Use Cases</td><td>uc-follow-path.md</td></tr>\n    <tr><td>Allocation</td><td>Electronics</td></tr>\n    <tr><td>Platform Team</td><td>Electronics</td></tr>\n    <tr><td>Priority</td><td>Critical</td></tr>\n    <tr><td>Requirement Statement</td><td>When PRAK detects a path-execution event (lateral deviation, rule violation, blocked or invalid route, or motion-authorization loss), the system shall report the event to C2 over the runtime ICD.</td></tr>\n    <tr><td>Rationale</td><td>Reporting half of FR-12 and the diagnostics channel for FR-14 stop events; detection is allocated to Polymorphous.</td></tr>\n    <tr><td>Acceptance Criteria</td><td><ul><li>Each detected event is reported to C2 with type and context within the configured latency.</li></ul></td></tr>\n  </tbody>\n</table>\n","path":"system/requirements/path-following/sysreq-report-execution-events-to-c2.md","refs_out":[{"field":"parent-use-cases","filename":"uc-follow-path.md","title":"Follow a Structured Path from Command and Control","kind":"use-cases"},{"field":"parent-product-requirement","filename":"req-fr-12.md","title":"Detect and Report Deviations, Violations, and Motion-Auth Loss","kind":"product-requirements"}],"refs_in":[]},{"id":"sysreq-stop-on-execution-fault","filename":"sysreq-stop-on-execution-fault.md","title":"Stop on Execution Fault or Obstacle","bucket":"path-following","kind":"system-requirements","frontmatter":{"id":"sysreq-stop-on-execution-fault","title":"Stop on Execution Fault or Obstacle","parent-product-requirement":"req-fr-14.md","parent-use-cases":["uc-follow-path.md"],"allocation":"RCU","platform-team":"Polymorphous","priority":"Critical"},"body":"\n<table>\n  <thead>\n    <tr><th>Field</th><th>Description</th></tr>\n  </thead>\n  <tbody>\n    <tr><td>ID</td><td>sysreq-stop-on-execution-fault</td></tr>\n    <tr><td>Parent Product Requirement</td><td>req-fr-14.md</td></tr>\n    <tr><td>Parent Use Cases</td><td>uc-follow-path.md</td></tr>\n    <tr><td>Allocation</td><td>RCU</td></tr>\n    <tr><td>Platform Team</td><td>Polymorphous</td></tr>\n    <tr><td>Priority</td><td>Critical</td></tr>\n    <tr><td>Requirement Statement</td><td>If a fault, obstacle, excessive path deviation, blocked-or-invalid-route condition, or motion-authorization loss occurs during path execution, the system shall emit a Cat2 stop actuation command sequence (escalating to a Cat0 stop if the controlled stop cannot be completed in time).</td></tr>\n    <tr><td>Rationale</td><td>The path-execution stop response. Diagnostics publication to C2 is allocated to Electronics (see sysreq-report-execution-events-to-c2).</td></tr>\n    <tr><td>Acceptance Criteria</td><td><ul><li>On any listed trigger, a stop sequence is emitted within the configured time budget.</li><li>The triggering condition is recorded for diagnostics and reporting.</li></ul></td></tr>\n  </tbody>\n</table>\n","path":"system/requirements/path-following/sysreq-stop-on-execution-fault.md","refs_out":[{"field":"parent-use-cases","filename":"uc-follow-path.md","title":"Follow a Structured Path from Command and Control","kind":"use-cases"},{"field":"parent-product-requirement","filename":"req-fr-14.md","title":"Stop and Diagnose on Execution Failure","kind":"product-requirements"}],"refs_in":[]},{"id":"sysreq-stop-on-heading-overshoot","filename":"sysreq-stop-on-heading-overshoot.md","title":"Stop on Heading Overshoot During Turn-In-Place","bucket":"path-following","kind":"system-requirements","frontmatter":{"id":"sysreq-stop-on-heading-overshoot","title":"Stop on Heading Overshoot During Turn-In-Place","parent-product-requirement":"req-fr-34.md","parent-use-cases":["uc-follow-path.md"],"allocation":"RCU","platform-team":"Polymorphous","priority":"Critical"},"body":"\n<table>\n  <thead>\n    <tr><th>Field</th><th>Description</th></tr>\n  </thead>\n  <tbody>\n    <tr><td>ID</td><td>sysreq-stop-on-heading-overshoot</td></tr>\n    <tr><td>Parent Product Requirement</td><td>req-fr-34.md</td></tr>\n    <tr><td>Parent Use Cases</td><td>uc-follow-path.md</td></tr>\n    <tr><td>Allocation</td><td>RCU</td></tr>\n    <tr><td>Platform Team</td><td>Polymorphous</td></tr>\n    <tr><td>Priority</td><td>Critical</td></tr>\n    <tr><td>Requirement Statement</td><td>If the vehicle&apos;s heading overshoots the desired heading by the maximum allowable deviation defined in the vehicle performance specification while executing a Turn-In-Place Objective, the system shall emit a Cat2 stop actuation command sequence (escalating to a Cat0 stop if the controlled stop cannot be completed in time).</td></tr>\n    <tr><td>Rationale</td><td>System requirement under FR-34, adopted from the VAK5 import (#9). Safety reaction to heading overshoot during the turn-in-place maneuver.</td></tr>\n    <tr><td>Acceptance Criteria</td><td>On heading overshoot beyond the maximum allowable deviation during a Turn-In-Place Objective, a Cat2 stop sequence is emitted within the configured time budget.</td></tr>\n  </tbody>\n</table>\n","path":"system/requirements/path-following/sysreq-stop-on-heading-overshoot.md","refs_out":[{"field":"parent-use-cases","filename":"uc-follow-path.md","title":"Follow a Structured Path from Command and Control","kind":"use-cases"},{"field":"parent-product-requirement","filename":"req-fr-34.md","title":"Objectives Translation into Vehicle Commands","kind":"product-requirements"}],"refs_in":[]},{"id":"sysreq-stop-on-path-deviation","filename":"sysreq-stop-on-path-deviation.md","title":"Stop on Path Deviation","bucket":"path-following","kind":"system-requirements","frontmatter":{"id":"sysreq-stop-on-path-deviation","title":"Stop on Path Deviation","parent-product-requirement":"req-fr-34.md","parent-use-cases":["uc-follow-path.md"],"allocation":"RCU","platform-team":"Polymorphous","priority":"Critical"},"body":"\n<table>\n  <thead>\n    <tr><th>Field</th><th>Description</th></tr>\n  </thead>\n  <tbody>\n    <tr><td>ID</td><td>sysreq-stop-on-path-deviation</td></tr>\n    <tr><td>Parent Product Requirement</td><td>req-fr-34.md</td></tr>\n    <tr><td>Parent Use Cases</td><td>uc-follow-path.md</td></tr>\n    <tr><td>Allocation</td><td>RCU</td></tr>\n    <tr><td>Platform Team</td><td>Polymorphous</td></tr>\n    <tr><td>Priority</td><td>Critical</td></tr>\n    <tr><td>Requirement Statement</td><td>If the vehicle deviates from its planned path at a lateral distance beyond the allowable lateral tolerance defined in the vehicle performance specification, the system shall emit a Cat2 stop actuation command sequence (escalating to a Cat0 stop if the controlled stop cannot be completed in time).</td></tr>\n    <tr><td>Rationale</td><td>System requirement under FR-34, adopted from the VAK5 import (#10, approved). <strong>Supersedes the lateral-deviation&rarr;stop behavior</strong> currently expressed by sysreq-detect-path-deviations-violations (FR-12) and sysreq-stop-on-execution-fault (FR-14); those two retain their other triggers (rule violations, blocked/invalid routes; fault, obstacle, motion-authorization loss). <strong>Flagged for consolidation</strong> with those sysreqs &mdash; not deleted, to preserve their additional coverage.</td></tr>\n    <tr><td>Acceptance Criteria</td><td>On lateral deviation beyond the allowable tolerance, a Cat2 stop sequence is emitted within the configured time budget.</td></tr>\n  </tbody>\n</table>\n","path":"system/requirements/path-following/sysreq-stop-on-path-deviation.md","refs_out":[{"field":"parent-use-cases","filename":"uc-follow-path.md","title":"Follow a Structure ce is emitted at stop-flagged control points.</li></ul></td></tr>\n  </tbody>\n</table>\n","path":"system/requirements/path-following/sysreq-structured-map-conformance.md","refs_out":[{"field":"parent-use-cases","filename":"uc-follow-path.md","title":"Follow a Structured Path from Command and Control","kind":"use-cases"},{"field":"parent-product-requirement","filename":"req-fr-10.md","title":"Structured-Map Rule Conformance","kind":"product-requirements"}],"refs_in":[]},{"id":"sysreq-turn-in-place-heading-accuracy","filename":"sysreq-turn-in-place-heading-accuracy.md","title":"Turn-In-Place Heading Accuracy","bucket":"path-following","kind":"system-requirements","frontmatter":{"id":"sysreq-turn-in-place-heading-accuracy","title":"Turn-In-Place Heading Accuracy","parent-product-requirement":"req-fr-34.md","parent-use-cases":["uc-follow-path.md"],"allocation":"RCU","platform-team":"Polymorphous","priority":"High"},"body":"\n<table>\n  <thead>\n    <tr><th>Field</th><th>Description</th></tr>\n  </thead>\n  <tbody>\n    <tr><td>ID</td><td>sysreq-turn-in-place-heading-accuracy</td></tr>\n    <tr><td>Parent Product Requirement</td><td>req-fr-34.md</td></tr>\n    <tr><td>Parent Use Cases</td><td>uc-follow-path.md</td></tr>\n    <tr><td>Allocation</td><td>RCU</td></tr>\n    <tr><td>Platform Team</td><td>Polymorphous</td></tr>\n    <tr><td>Priority</td><td>High</td></tr>\n    <tr><td>Requirement Statement</td><td>When PRAK executes a Turn-In-Place Objective, the system shall produce control values that bring the vehicle&apos;s final heading within the advertised heading tolerance specified in the vehicle performance specification.</td></tr>\n    <tr><td>Rationale</td><td>System requirement under FR-34 (Objectives Translation), adopted from the VAK5 import (#8). Heading-accuracy conformance for the turn-in-place maneuver; the tolerance value is drawn from the vehicle performance specification (a performance target). Heading is sourced from GNC.</td></tr>\n    <tr><td>Acceptan eness Handling","kind":"product-requirements"}],"refs_in":[]},{"id":"sysreq-support-steering-box-vehicles","filename":"sysreq-support-steering-box-vehicles.md","title":"Support Steering-Box Vehicles","bucket":"vehicle-support","kind":"system-requirements","frontmatter":{"id":"sysreq-support-steering-box-vehicles","title":"Support Steering-Box Vehicles","parent-product-requirement":"req-pr-07.md","parent-use-cases":["uc-follow-path.md","uc-teleoperation.md"],"allocation":"RCU","platform-team":"Polymorphous","priority":"High"},"body":"\n<table>\n  <thead>\n    <tr><th>Field</th><th>Description</th></tr>\n  </thead>\n  <tbody>\n    <tr><td>ID</td><td>sysreq-support-steering-box-vehicles</td></tr>\n    <tr><td>Parent Product Requirement</td><td>req-pr-07.md</td></tr>\n    <tr><td>Parent Use Cases</td><td>uc-follow-path.md, uc-teleoperation.md</td></tr>\n    <tr><td>Allocation</td><td>RCU</td></tr>\n    <tr><td>Platform Team</td><td>Polymorphous</td></tr>\n    <tr><td>Priority</td><td>High</td></tr>\n    <tr><td>Requirement Statement</td><td>PRAK shall support autonomous control of steering-box (rigid-frame, steered-wheel) vehicles, producing actuation commands consistent with the configured steering-box kinematic model.</td></tr>\n    <tr><td>Rationale</td><td>Companion to PR-07 (Articulated Vehicle Support); PRAK-originated (no legacy source). Ensures the platform covers steering-box vehicle kinematics alongside articulated, configured via the path-to-actuation framework kinematic model (FR-24).</td></tr>\n    <tr><td>Acceptance Criteria</td><td>With a steering-box kinematic configuration, PRAK produces actuation commands consistent with that configuration.</td></tr>\n  </tbody>\n</table>\n","path":"system/requirements/vehicle-support/sysreq-support-steering-box-vehicles.md","refs_out":[{"field":"parent-use-cases","filename":"uc-follow-path.md","title":"Follow a Structured Path from Command and Control","kind":"use-cases"},{"field":"parent-use-cases","filename":"uc-teleoperation.md","title":"Tele-operate Robot via Manual Control Inputs","kind":"use-cases"},{"field":"parent-product-requirement","filename":"req-pr-07.md","title":"Articulated Vehicle Support","kind":"product-requirements"}],"refs_in":[]}],"architecture-diagrams":[{"id":"arch-subsystem-component","filename":"arch-subsystem-component.md","title":"PRAK Subsystem Component Architecture","bucket":"actuation-framework","kind":"architecture-diagrams","frontmatter":{"id":"arch-subsystem-component","title":"PRAK Subsystem Component Architecture","parent-product-requirement":"req-fr-23.md","diagram-type":"component"},"body":"\n<table>\n  <thead>\n    <tr><th>Field</th><th>Description</th></tr>\n  </thead>\n  <tbody>\n    <tr><td>Purpose</td><td>Show the on-vehicle PRAK platform subsystems (GNC, Perception, VCU/RCU, Electronics) and the produce / consume relationships among them, plus the boundary with external actors (Command and Control system, Tele-op Controller, Robot Hardware).</td></tr>\n    <tr><td>Scope</td><td>Logical component view derived from the Platform Architecture Excel <code>Interfaces</code> sheet. In scope: subsystem identities, named data flows, external-actor boundary. Out of scope: physical deployment (which compute board hosts which subsystem), wire-level protocol, message rate / cadence. This diagram is C2-agnostic and applies to any Command and Control (C2) implementation that satisfies the runtime messaging ICD.</td></tr>\n    <tr><td>Notes</td><td>Traces to <code>req-hw-interface-contract</code> as the primary parent. Sibling product requirements illuminated: <code>req-framework-build-integration</code> (SW dependency graph), <code>req-actuator-sensor-interface-configuration</code> (Electronics&harr;HW boundary), <code>req-path-execution</code> (C2&rarr;RCU&rarr;GNC flow). Flow labels match the Excel Interfaces sheet vocabulary so the diagram is a direct visual rendering of that sheet. Robot-specific extensions owned by the Robot Mechatronics Dev Team attach at the Electronics&harr;HW boundary and at sanctioned GNC / RCU extension points (not depicted here; covered in a future <code>arch-extension-points.md</code>).</td></tr>\n  </tbody>\n</table>\n\n```mermaid\n%%{init: {\"theme\":\"base\",\"themeVariables\":{\"background\":\"#ffffff\",\"primaryColor\":\"#dae8fc\",\"primaryTextColor\":\"#1f2937\",\"primaryBorderColor\":\"#6c8ebf\",\"lineColor\":\"#55606e\",\"secondaryColor\":\"#d5e8d4\",\"tertiaryColor\":\"#f3f4f6\",\"clusterBkg\":\"#f3f4f6\",\"clusterBorder\":\"#9aa5b1\",\"edgeLabelBackground\":\"#ffffff\",\"textColor\":\"#1f2937\",\"noteBkgColor\":\"#fff3c4\",\"noteTextColor\":\"#1f2937\",\"noteBorderColor\":\"#d6b656\",\"actorBkg\":\"#dae8fc\",\"actorBorder\":\"#6c8ebf\",\"actorTextColor\":\"#1f2937\",\"signalColor\":\"#55606e\",\"signalTextColor\":\"#1f2937\",\"labelBoxBkgColor\":\"#dae8fc\",\"labelBoxBorderColor\":\"#6c8ebf\",\"labelTextColor\":\"#1f2937\",\"loopTextColor\":\"#1f2937\",\"sequenceNumberColor\":\"#ffffff\"}}}%%\nflowchart TB\n    subgraph external[\"External Actors\"]\n        C2[\"Command and Control (C2)\"]\n        TELEOP[\"Tele-op Controller\"]\n        HW[\"Robot Hardware<br/>sensors &amp; actuators\"]\n    end\n\n    subgraph platform[\"PRAK Platform Subsystems (on-vehicle)\"]\n        GNC[\"GNC<br/>Guidance, Navigation, Control\"]\n        PER[\"Perception\"]\n        RCU[\"VCU / RCU<br/>Robot Control Unit\"]\n        ELEC[\"Electronics\"]\n    end\n\n    C2 -->|Path Plan| GNC\n    C2 -->|Mission Orchestration<br/>Task Commands| RCU\n    RCU -->|System State<br/>Telemetry, Ack, Completion| C2\n\n    TELEOP -->|Tele-op Inputs| ELEC\n    ELEC -->|Tele-op Feedback| TELEOP\n    HW -->|Sensor Data| ELEC\n    ELEC -->|Actuation| HW\n\n    GNC -->|Control Values<br/>Speed/Direction/Implement| RCU\n    GNC -->|Position<br/>Pose &amp; Velocity| PER\n    PER -->|World Model| GNC\n    PER -->|World Model| RCU\n    PER -->|Perception Commands<br/>Stop| RCU\n    ELEC -->|Hardware State<br/>Speed/Direction/Implement/Gauge| RCU\n    ELEC -->|GNSS NMEA| GNC\n    RCU -->|System State| GNC\n    RCU -->|System State<br/>Connected Implements| PER\n    RCU -->|Electronics Commands| ELEC\n```\n","path":"system/architecture/actuation-framework/arch-subsystem-component.md","refs_out":[{"field":"parent-product-requirement","filename":"req-fr-23.md","title":"Path-to-Actuation Framework Distribution Forms","kind":"product-requirements"}],"refs_in":[]},{"id":"arch-motion-authorization-state","filename":"arch-motion-authorization-state.md","title":"Motion-Authorization State Machine","bucket":"motion-authorization-framework","kind":"architecture-diagrams","frontmatter":{"id":"arch-motion-authorization-state","title":"Motion-Authorization State Machine","parent-product-requirement":"req-fr-05.md","diagram-type":"state"},"body":"\n<table>\n  <thead>\n    <tr><th>Field</th><th>Description</th></tr>\n  </thead>\n  <tbody>\n    <tr><td>Purpose</td><td>Show the motion-authorization gate as a state machine spanning the pre-motion evaluation, the gated transition to execution, and the in-motion revalidation that returns the robot to a safe state if any motion-authorization condition becomes false during a mission.</td></tr>\n    <tr><td>Scope</td><td>In scope: the states and transitions that govern whether the robot is permitted to actuate, from initial request through execution to safe stop. Applies to the active navigation use case (<code>uc-follow-path</code>) and the navigation-side branch of tele-op. Out of scope: the per-subsystem mechanism that detects each Safe-to-Move / Motion-Permitted / Stop-Capable condition (those decompose at the sysreq layer), and the tele-op-specific session lifecycle (covered in a future <code>arch-tele-op-session-state.md</code>).</td></tr>\n    <tr><td>Notes</td><td>Traces to <code>req-motion-authorization-response</code> as the primary parent. Sibling product requirements illuminated: <code>req-safe-to-move-vehicle-state</code>, <code>req-safe-to-move-environment</code>, <code>req-motion-permitted</code>, <code>req-stop-capable</code> (the four evaluation classes inside <strong>Evaluating</strong>); <code>req-no-actuation-before-authorization</code> (no transition into <strong>Executing</strong> except from <strong>Authorized</strong>); <code>req-motion-authorization-loss</code> and <code>req-teleop-motion-authorization-loss</code> (the <strong>MotionAuthLost</strong> transition during motion). The machine treats motion-authorization as a continuous condition during <strong>Executing</strong>, not a one-shot gate &mdash; this is the architectural commitment to in-mission revalidation.</td></tr>\n  </tbody>\n</table>\n\n```mermaid\n%%{init: {\"theme\":\"base\",\"themeVariables\":{\"background\":\"#ffffff\",\"primaryColor\":\"#dae8fc\",\"primaryTextColor\":\"#1f2937\",\"primaryBorderColor\":\"#6c8ebf\",\"lineColor\":\"#55606e\",\"secondaryColor\":\"#d5e8d4\",\"tertiaryColor\":\"#f3f4f6\",\"clusterBkg\":\"#f3f4f6\",\"clusterBorder\":\"#9aa5b1\",\"edgeLabelBackground\":\"#ffffff\",\"textColor\":\"#1f2937\",\"noteBkgColor\":\"#fff3c4\",\"noteTextColor\":\"#1f2937\",\"noteBorderColor\":\"#d6b656\",\"actorBkg\":\"#dae8fc\",\"actorBorder\":\"#6c8ebf\",\"actorTextColor\":\"#1f2937\",\"signalColor\":\"#55606e\",\"signalTextColor\":\"#1f2937\",\"labelBoxBkgColor\":\"#dae8fc\",\"labelBoxBorderColor\":\"#6c8ebf\",\"labelTextColor\":\"#1f2937\",\"loopTextColor\":\"#1f2937\",\"sequenceNumberColor\":\"#ffffff\"}}}%%\nstateDiagram-v2\n    [*] --> NoRequest\n\n    NoRequest --> Evaluating : Movement request received\n\n    state Evaluating {\n        [*] --> CheckSafeToMoveVehicle\n        CheckSafeToMoveVehicle --> CheckSafeToMoveEnv\n        CheckSafeToMoveEnv --> CheckMotionPermitted\n        CheckMotionPermitted --> CheckStopCapable\n        CheckStopCapable --> [*]\n    }\n\n    Evaluating --> Denied : Any check fails\n    Evaluating --> Authorized : All checks pass\n\n    Denied --> NoRequest : After reporting failing condition to C2\n\n    Authorized --> Executing : Motion begins<br/>(no actuation before this transition)\n\n    Executing --> Completed : Mission complete\n    Executing --> MotionAuthLost : Any motion-auth condition becomes false during motion\n    Executing --> ExecutionFailure : Fault / obstacle / deviation / blocked route\n\n    MotionAuthLost --> SafeStopped : Controlled stop completes\n    ExecutionFailure --> SafeStopped : Controlled stop completes\n\n    SafeStopped --> NoRequest : After reporting loss to C2 / Tele-op Controller\n\n    Completed --> [*]\n\n    note right of Evaluating\n        Safe-to-Move (vehicle state)\n        Safe-to-Move (environment)\n        Motion-Permitted\n        Stop-Capable\n    end note\n\n    note right of Authorized\n        req-motion-authorization-response:\n        return result to C2 with diagnostic\n    end note\n\n    note right of MotionAuthLost\n        req-motion-authorization-loss (nav)\n        req-teleop-motion-authorization-loss (tele-op)\n    end note\n```\n","path":"system/architecture/motion-authorization-framework/arch-motion-authorization-state.md","refs_out":[{"field":"parent-product-requirement","filename":"req-fr-05.md","title":"Gate Motion on Continuous Authorization","kind":"product-requirements"}],"refs_in":[]},{"id":"arch-c2-path-execution-sequence","filename":"arch-c2-path-execution-sequence.md","title":"C2 Path Execution Sequence","bucket":"navigation-common","kind":"architecture-diagrams","frontmatter":{"id":"arch-c2-path-execution-sequence","title":"C2 Path Execution Sequence","parent-product-requirement":"req-fr-09.md","diagram-type":"sequence"},"body":"\n<table>\n  <thead>\n    <tr><th>Field</th><th>Description</th></tr>\n  </thead>\n  <tbody>\n    <tr><td>Purpose</td><td>Show the runtime message flow for a Command and Control (C2)&ndash;supplied path: send &rarr; validate &rarr; acknowledge &rarr; execute &rarr; telemetry &rarr; complete, with the rejection and execution-failure branches included so the diagram covers the requirement&apos;s alternate paths.</td></tr>\n    <tr><td>Scope</td><td>In scope: the messages and subsystem interactions during a single C2-supplied path mission. Out of scope: timing budgets, retry semantics, the contents of structured-map conformance checks (covered in <code>req-path-validation</code>), and per-subsystem implementation. Applies to <code>uc-follow-path</code> (path-following). C2-agnostic &mdash; applies to any C2 implementation that satisfies the runtime messaging ICD.</td></tr>\n    <tr><td>Notes</td><td>Traces to <code>req-path-execution</code> as the primary parent. Sibling product requirements illuminated: <code>req-path-validation</code> (validate step), <code>req-path-acknowledgment</code> (acknowledge step), <code>req-path-telemetry</code> (telemetry loop), <code>req-path-completion</code> (completion notification), <code>req-path-execution-failure</code> and <code>req-motion-authorization-loss</code> (failure branches). Internal subsystems shown at the granularity of RCU / GNC / Perception. RCU is the on-vehicle receiver of C2 Mission Orchestration per the Excel <code>Interfaces</code> sheet; GNC consumes the Path Plan via the activation handoff from RCU.</td></tr>\n  </tbody>\n</table>\n\n```mermaid\n%%{init: {\"theme\":\"base\",\"themeVariables\":{\"background\":\"#ffffff\",\"primaryColor\":\"#dae8fc\",\"primaryTextColor\":\"#1f2937\",\"primaryBorderColor\":\"#6c8ebf\",\"lineColor\":\"#55606e\",\"secondaryColor\":\"#d5e8d4\",\"tertiaryColor\":\"#f3f4f6\",\"clusterBkg\":\"#f3f4f6\",\"clusterBorder\":\"#9aa5b1\",\"edgeLabelBackground\":\"#ffffff\",\"textColor\":\"#1f2937\",\"noteBkgColor\":\"#fff3c4\",\"noteTextColor\":\"#1f2937\",\"noteBorderColor\":\"#d6b656\",\"actorBkg\":\"#dae8fc\",\"actorBorder\":\"#6c8ebf\",\"actorTextColor\":\"#1f2937\",\"signalColor\":\"#55606e\",\"signalTextColor\":\"#1f2937\",\"labelBoxBkgColor\":\"#dae8fc\",\"labelBoxBorderColor\":\"#6c8ebf\",\"labelTextColor\":\"#1f2937\",\"loopTextColor\":\"#1f2937\",\"sequenceNumberColor\":\"#ffffff\"}}}%%\nsequenceDiagram\n    autonumber\n    participant C2 as Command and Control (C2)\n    participant RCU as RCU\n    participant GNC as GNC\n    participant PER as Perception\n\n    C2->>RCU: Send Path (Mission Orchestration)\n    RCU->>RCU: Validate (geometric, kinematic,<br/>geofence, structured-map conformance)\n\n    alt Path valid\n        RCU-->>C2: Acknowledge (accepted)\n        RCU->>GNC: Activate Path Plan\n        Note over GNC,RCU: Motion-authorization gate held (per uc-safe-to-move-framework)\n\n        loop While executing\n            GNC->>RCU: Control values (velocity, steering)\n            RCU-->>GNC: System state (speed/direction)\n            PER-->>GNC: World model (obstacles, zone)\n            GNC-->>RCU: Pose + localization confidence\n            RCU-->>C2: Telemetry (pose, progress, deviation)\n        end\n\n        alt Endpoint reached within tolerance\n            GNC-->>RCU: Endpoint reached\n            RCU-->>C2: Completion notification\n        else Fault / obstacle / deviation / blocked route\n            PER-->>RCU: Obstacle / fault detected\n            GNC-->>RCU: Deviation detected\n            RCU->>GNC: Stop command\n            RCU-->>C2: Execution failure + diagnostic\n        else Motion-authorization condition lost\n            RCU-->>RCU: Motion-auth condition false\n            RCU->>GNC: Stop command (safe state)\n            RCU-->>C2: Motion-authorization loss + failing condition\n        end\n    else Path invalid\n        RCU-->>C2: Reject (diagnostic reason)\n    end\n```\n","path":"system/architecture/navigation-common/arch-c2-path-execution-sequence.md","refs_out":[{"field":"parent-product-requirement","filename":"req-fr-09.md","title":"Execute Path with Motion-Limit Conformance","kind":"product-requirements"}],"refs_in":[]},{"id":"arch-use-case-context","filename":"arch-use-case-context.md","title":"Use Case Context Diagram","bucket":"navigation-common","kind":"architecture-diagrams","frontmatter":{"id":"arch-use-case-context","title":"Use Case Context Diagram","parent-product-requirement":"req-fr-09.md","diagram-type":"use-case"},"body":"\n<table>\n  <thead>\n    <tr><th>Field</th><th>Description</th></tr>\n  </thead>\n  <tbody>\n    <tr><td>Purpose</td><td>Show all active PRAK use cases together with their primary actors and the inter-UC relationships, so a stakeholder can read the system boundary at a glance: who interacts with PRAK, which use cases they invoke, and which use cases depend on which other use cases.</td></tr>\n    <tr><td>Scope</td><td>In scope: the four active use cases (UC-01 Safe to Move Framework, UC-02 Navigate Robot in a Structured Environment, UC-04 Tele-operate Robot via Manual Control Inputs, UC-05 Path-to-Actuation Framework); the three personas (Command and Control, Tele-op Controller, Robot Mechatronics Dev Team); supporting non-runtime actors (MPT, EPT) for the build-time UC; and the &laquo;include&raquo; relationships from the path-execution and tele-op UCs into the motion-authorization UC. Out of scope: the archived UC-03 semi-structured navigation; message-level sequencing (covered by <code>arch-c2-path-execution-sequence</code>); state-level behavior of motion-authorization (covered by <code>arch-motion-authorization-state</code>).</td></tr>\n    <tr><td>Notes</td><td>The dashed &laquo;include&raquo; arrows reflect that UC-02 and UC-04 both depend on UC-01 motion-authorization being continuously satisfied during execution &mdash; this is the architectural commitment to a single, shared safe-to-move framework rather than per-UC authorization logic. UC-05 sits at the build-time boundary; it is consumed by the dev team rather than by a runtime actor, so the relationship style is &laquo;consume&raquo; rather than &laquo;invoke&raquo;.</td></tr>\n  </tbody>\n</table>\n\n```mermaid\n%%{init: {\"theme\":\"base\",\"themeVariables\":{\"background\":\"#ffffff\",\"primaryColor\":\"#dae8fc\",\"primaryTextColor\":\"#1f2937\",\"primaryBorderColor\":\"#6c8ebf\",\"lineColor\":\"#55606e\",\"secondaryColor\":\"#d5e8d4\",\"tertiaryColor\":\"#f3f4f6\",\"clusterBkg\":\"#f3f4f6\",\"clusterBorder\":\"#9aa5b1\",\"edgeLabelBackground\":\"#ffffff\",\"textColor\":\"#1f2937\",\"noteBkgColor\":\"#fff3c4\",\"noteTextColor\":\"#1f2937\",\"noteBorderColor\":\"#d6b656\",\"actorBkg\":\"#dae8fc\",\"actorBorder\":\"#6c8ebf\",\"actorTextColor\":\"#1f2937\",\"signalColor\":\"#55606e\",\"signalTextColor\":\"#1f2937\",\"labelBoxBkgColor\":\"#dae8fc\",\"labelBoxBorderColor\":\"#6c8ebf\",\"labelTextColor\":\"#1f2937\",\"loopTextColor\":\"#1f2937\",\"sequenceNumberColor\":\"#ffffff\"}}}%%\nflowchart LR\n    C2(((\"Command and<br/>Control (C2)\")))\n    TC(((\"Tele-op<br/>Controller\")))\n    DEV(((\"Robot Mechatronics<br/>Dev Team\")))\n\n    MPT(((\"MPT\")))\n    EPT(((\"EPT\")))\n\n    subgraph PRAK [\"PRAK (Platform Robot Automation Kit)\"]\n        direction TB\n        UC01([\"UC-01<br/>Safe to Move<br/>Framework\"])\n        UC02([\"UC-02<br/>Navigate Robot in a<br/>Structured Environment\"])\n        UC04([\"UC-04<br/>Tele-operate Robot<br/>via Manual Control Inputs\"])\n        UC05([\"UC-05<br/>Path-to-Actuation<br/>Framework\"])\n\n        UC02 -. \"&laquo;include&raquo;\" .-> UC01\n        UC04 -. \"&laquo;include&raquo;\" .-> UC01\n    end\n\n    C2 -- \"movement request,<br/>supplied path\" --> UC01\n    C2 --> UC02\n    TC -- \"session, manual inputs,<br/>LOS acknowledgment\" --> UC04\n    TC -. \"may invoke\" .-> UC01\n\n    DEV -- \"&laquo;consume&raquo;<br/>(build time)\" --> UC05\n    MPT -. \"training + docs\" .-> DEV\n    EPT -. \"polymorphous SW training\" .-> DEV\n\n    classDef actor fill:#fff,stroke:#1F3A5F,stroke-width:2px,color:#1F3A5F\n    classDef support fill:#F5F5F5,stroke:#888,stroke-width:1.5px,color:#555,stroke-dasharray:3 3\n    classDef uc fill:#D5E8F0,stroke:#1F3A5F,stroke-width:1.5px,color:#1F3A5F\n    classDef ucBase fill:#EAF3F8,stroke:#1F3A5F,stroke-width:1.5px,color:#1F3A5F\n    class C2,TC,DEV actor\n    class MPT,EPT support\n    class UC02,UC04,UC05 uc\n    class UC01 ucBase\n```\n","path":"system/architecture/navigation-common/arch-use-case-context.md","refs_out":[{"field":"parent-product-requirement","filename":"req-fr-09.md","title":"Execute Path with Motion-Limit Conformance","kind":"product-requirements"}],"refs_in":[]}],"initiatives":[],"epics":[],"stories":[]};

buildable applications, raw source, select static libraries, and packaged binaries that include the PRAK robotics software framework. Also receives training and documentation from the Mechatronics Platform Team (MPT), which owns PRAK; polymorphous-specific software training is delivered by the Embedded Platform Team (EPT). Extends or integrates the frameworks to produce robot-specific hardware and software.</td></tr>\n\n  </tbody>\n</table>\n","path":"product/personas/robot-mechatronics-dev-team.md","refs_out":[],"refs_in":[]},{"id":"teleop-controller","filename":"teleop-controller.md","title":"Tele-op Controller","bucket":"","kind":"personas","frontmatter":{"id":"teleop-controller","title":"Tele-op Controller","class":"external-system"},"body":"\n# Tele-op Controller\n\n<table>\n  <thead>\n    <tr><th>Parameter</th><th>Description</th></tr>\n  </thead>\n  <tbody>\n    <tr><td>Class</td><td>External System</td></tr>\n    <tr><td>Role</td><td>A tele-operation system that issues real-time manual control input using the Platform Robot Automation Kit (PRAK) framework on behalf of a human operator. May be a dedicated tele-op controller or a Command and Control system with tele-op capability provided it satisfies the tele-op ICD.</td></tr>\n    <tr><td>Interaction Boundary</td><td>Interfaces with PRAK at runtime via the tele-op ICD to send manual control inputs and may receive feedback. The ICD includes a base set of inputs defined by PRAK and robot-specific extensions defined by the Robot Mechatronics Development team.</td></tr\n","path":"product/personas/teleop-controller.md","refs_out":[],"refs_in":[]}],"use-cases":[{"id":"uc-path-to-actuation-framework","filename":"uc-path-to-actuation-framework.md","title":"Path-to-Actuation Framework","bucket":"actuation-framework","kind":"use-cases","frontmatter":{"id":"uc-path-to-actuation-framework","title":"Path-to-Actuation Framework","primary-actors":["robot-mechatronics-dev-team.md"],"parent-personas":["robot-mechatronics-dev-team.md"]},"body":"\n<table>\n  <thead>\n    <tr><th>Field</th><th>Description</th></tr>\n  </thead>\n  <tbody>\n    <tr><td>Primary Actor</td><td>Robot Mechatronics Dev Team</td></tr>\n    <tr><td>Supporting Actor(s)</td><td>EPT (owns the polymorphous software path-following module and its source distribution); MPT (owns the integrated HW+SW build contract, the actuation-boundary specification, and the integration training/documentation that the dev team consumes)</td></tr>\n    <tr><td>Need</td><td>The robot mechatronics dev team needs a framework from Platform Robot Automation Kit (PRAK) that converts path commands into actuation commands appropriate to the robot&apos;s specific mechanical and electrical configuration, so the team can integrate PRAK into a working robot without re-implementing the conversion pipeline for their kinematics, actuators, and sensors.</td></tr>\n    <tr><td>Preconditions</td><td>\n      <ol>\n        <li>The dev team has access to PRAK distribution artifacts: HW reference designs (compute boards, BSP, wiring harnesses, sensor/actuator interfaces, mechanical mounting), SW framework as buildable applications / source / static libraries / packaged binaries, documentation, and integration training from MPT.</li>\n        <li>The robot&apos;s mechanical and electrical configuration (kinematics, actuators, sensors) is defined and stable enough to integrate against a fixed configuration surface.</li>\n        <li>The dev environment supports building and testing PRAK-derived robot programs.</li>\n      </ol>\n    </td></tr>\n    <tr><td>Steps</td><td>\n      <ol>\n        <li>The dev team obtains the path-to-actuation framework from PRAK as source, libraries, or buildable applications appropriate to their consumption model.</li>\n        <li>The dev team configures the framework with the robot&apos;s kinematic model (wheel base, steering geometry, drive train, dynamic limits).</li>\n        <li>The dev team configures the framework with the robot&apos;s actuator and sensor interfaces (drive, steering, implements, GNSS, IMU, perception sensors) against the PRAK-supplied HW interface contracts.</li>\n        <li>The dev team integrates the framework into the robot&apos;s build, linking to PRAK-supplied HW interfaces (BSP, wiring harnesses, mechanical mounting reference designs) and to the polymorphous software path-following module supplied by EPT.</li>\n        <li>The dev team verifies the conversion pipeline end-to-end by feeding representative path commands (segments spanning structured and free-space regions where applicable) and confirming that actuation outputs match the configured kinematic and actuator behavior.</li>\n        <li>The dev team extends the framework with any robot-specific actuation logic that PRAK does not cover (e.g. unusual implement control, custom drive modes, robot-specific safety interlocks).</li>\n        <li>The dev team deploys the integrated robot program to the target hardware and validates against acceptance criteria at the robot level.</li>\n      </ol>\n    </td></tr>\n    <tr><td>Postconditions/Outcomes</td><td>Through the integrated PRAK framework, the robot can receive path commands at runtime and convert them to actuation appropriate to its mechanical and electrical configuration; the framework is integrated into a buildable, deployable robot program; robot-specific extensions are layered on PRAK without modifying PRAK&apos;s own code path.</td></tr>\n    <tr><td>Exceptions/Alternate Flows</td><td>\n      <ol>\n        <li><strong>Framework gap</strong> &mdash; the framework does not support a required robot feature and the gap is outside what extension is meant to cover; the dev team escalates to MPT to determine whether the feature is a PRAK obligation or belongs to the dev team&apos;s extension layer.</li>\n        <li><strong>Configuration mismatch</strong> &mdash; the configured kinematic model does not match the robot&apos;s actual mechanical behavior under load; the dev team retunes the configuration and re-verifies before deploying.</li>\n        <li><strong>API/ICD version mismatch</strong> &mdash; the dev team&apos;s robot code targets a PRAK or polymorphous API version that has incompatible changes from the distributed framework; the dev team consults the migration documentation or escalates to MPT/EPT for guidance.</li>\n        <li><strong>Training or documentation gap</strong> &mdash; the dev team encounters undocumented behavior or insufficient documentation; MPT (or EPT for polymorphous-specific behavior) provides additional training or documentation rather than the dev team reverse-engineering the framework.</li>\n        <li><strong>HW reference deviation</strong> &mdash; the robot deviates from PRAK HW reference designs in a way that breaks the actuation contract; the dev team and MPT jointly determine whether the deviation can be supported by configuration alone or requires a framework gap to be filed.</li>\n      </ol>\n    </td></tr>\n    <tr><td>Development Guide Reference</td><td>TBD &mdash; link to the PRAK Integration Guide and the polymorphous software path-following module documentation once available.</td></tr>\n  </tbody>\n</table>\n\n## Use Case Flow Diagram\n\n```mermaid\n%%{init: {\"theme\":\"base\",\"themeVariables\":{\"background\":\"#ffffff\",\"primaryColor\":\"#dae8fc\",\"primaryTextColor\":\"#1f2937\",\"primaryBorderColor\":\"#6c8ebf\",\"lineColor\":\"#55606e\",\"secondaryColor\":\"#d5e8d4\",\"tertiaryColor\":\"#f3f4f6\",\"clusterBkg\":\"#f3f4f6\",\"clusterBorder\":\"#9aa5b1\",\"edgeLabelBackground\":\"#ffffff\",\"textColor\":\"#1f2937\",\"noteBkgColor\":\"#fff3c4\",\"noteTextColor\":\"#1f2937\",\"noteBorderColor\":\"#d6b656\",\"actorBkg\":\"#dae8fc\",\"actorBorder\":\"#6c8ebf\",\"actorTextColor\":\"#1f2937\",\"signalColor\":\"#55606e\",\"signalTextColor\":\"#1f2937\",\"labelBoxBkgColor\":\"#dae8fc\",\"labelBoxBorderColor\":\"#6c8ebf\",\"labelTextColor\":\"#1f2937\",\"loopTextColor\":\"#1f2937\",\"sequenceNumberColor\":\"#ffffff\"}}}%%\nflowchart TD\n    start([Start]):::actor\n    trigger[\"Dev Team obtains<br/>PRAK distribution<br/>(source / libs / apps)\"]:::actor\n\n    pre_api{API / ICD version<br/>compatible?}:::gate\n    api_fail[\"Consult migration docs;<br/>escalate to MPT / EPT\"]:::fail\n\n    config_kin[\"Configure kinematic model<br/>(wheel base, steering,<br/>drive train, limits)\"]:::function\n    config_io[\"Configure actuator / sensor<br/>interfaces against PRAK<br/>HW interface contracts\"]:::function\n\n    pre_hw{Configuration matches<br/>robot HW behavior?}:::gate\n    config_fail[\"Configuration mismatch;<br/>retune &amp; re-verify\"]:::fail\n\n    integrate[\"Integrate framework<br/>into robot's build\"]:::function\n\n    verify{End-to-end pipeline<br/>verification passes?}:::gate\n\n    pre_gap{All required behavior<br/>supported by framework?}:::gate\n    gap_fail[\"Framework gap;<br/>escalate to MPT\"]:::fail\n\n    extend[\"Extend with robot-specific<br/>actuation logic at<br/>sanctioned extension points\"]:::function\n    deploy[\"Deploy integrated<br/>robot program;<br/>validate at robot level\"]:::function\n\n    stop_pause((\"Pause /<br/>Escalation\")):::pause\n    stop_term((\"Integration complete\")):::stop\n\n    start --> trigger --> pre_api\n    pre_api -- \"No\" --> api_fail --> stop_pause\n    pre_api -- \"Yes\" --> config_kin --> config_io --> pre_hw\n    pre_hw -- \"No\" --> config_fail --> stop_pause\n    pre_hw -- \"Yes\" --> integrate --> verify\n    verify -- \"No\" --> config_fail\n    verify -- \"Yes\" --> pre_gap\n    pre_gap -- \"No\" --> gap_fail --> stop_pause\n    pre_gap -- \"Yes\" --> extend --> deploy --> stop_term\n\n    classDef actor fill:#e1d5e7,stroke:#9673a6,color:#000\n    classDef function fill:#dae8fc,stroke:#6c8ebf,color:#000\n    classDef gate fill:#d5e8d4,stroke:#82b366,color:#000\n    classDef fail fill:#f8cecc,stroke:#b85450,color:#000\n    classDef pause fill:#e3c800,stroke:#B09500,color:#000\n    classDef stop fill:#e51400,stroke:#B20000,color:#fff\n```\n","path":"product/use-cases/actuation-framework/uc-path-to-actuation-framework.md","refs_out":[],"refs_in":[{"field":"parent-use-cases","filename":"req-fr-23.md","title":"Path-to-Actuation Framework Distribution Forms","kind":"product-requirements"},{"field":"parent-use-cases","filename":"req-fr-24.md","title":"Configurable Kinematic Model and Actuator / Sensor Interfaces","kind":"product-requirements"},{"field":"parent-use-cases","filename":"req-fr-25.md","title":"Documented Extension Points","kind":"product-requirements"},{"field":"parent-use-cases","filename":"req-fr-26.md","title":"Framework Verification Support","kind":"product-requirements"},{"field":"parent-use-cases","filename":"req-fr-27.md","title":"API Versioning, Migration Guidance, and Integration Training","kind":"product-requirements"},{"field":"parent-use-cases","filename":"req-pr-04.md","title":"Integrable Framework for OEM Vehicle Platforms","kind":"product-requirements"},{"field":"parent-use-cases","filename":"sysreq-api-versioning-and-training.md","title":"API Versioning, Migration Guidance, and Integration Training","kind":"system-requirements"},{"field":"parent-use-cases","filename":"sysreq-configurable-kinematic-and-io-interfaces.md","title":"Configurable Kinematic Model and Actuator/Sensor Interfaces","kind":"system-requirements"},{"field":"parent-use-cases","filename":"sysreq-documented-extension-points.md","title":"Documented Framework Extension Points","kind":"system-requirements"},{"field":"parent-use-cases","filename":"sysreq-framework-verification-support.md","title":"Framework Verification Support","kind":"system-requirements"},{"field":"parent-use-cases","filename":"sysreq-publish-framework-distribution-forms.md","title":"Publish Framework Distribution Forms and Interface Contracts","kind":"system-requirements"}]},{"id":"uc-safe-to-move-framework","filename":"uc-safe-to-move-framework.md","title":"Safe to Move Framework","bucket":"motion-authorization-framework","kind":"use-cases","frontmatter":{"id":"uc-safe-to-move-framework","title":"Safe to Move Framework","primary-actors":["command-and-control.md","teleop-controller.md"],"parent-personas":["command-and-control.md","teleop-controller.md"]},"body":"\n<table>\n  <thead>\n    <tr><th>Field</th><th>Description</th></tr>\n  </thead>\n  <tbody>\n    <tr><td>Primary Actor(s)</td><td>Command and Control System (primary requester); Tele-op Controller (limited cases where the tele-op session initiates motion-authorization independently of C2)</td></tr>\n    <tr><td>Supporting Actor(s)</td><td>EPT (owns the polymorphous software safety, motion-permitted, and stop-capable state behaviors); MPT (owns the integrated HW+SW behavior, including transmission, braking, power, and sensor state evaluation at the mechatronics layer)</td></tr>\n    <tr><td>Need</td><td>An Actor needs to request a robot to move and have the robot independently confirm that it is safe to move, that motion is permitted, and that it can be stopped, before any actuation occurs.</td></tr>\n    <tr><td>Preconditions</td><td>\n      <ol>\n        <li>Platform Robot Automation Kit (PRAK) is powered and in an operational mode that accepts the Actor&apos;s commands.</li>\n        <li>The Actor has an established runtime messaging session with PRAK.</li>\n      </ol>\n    </td></tr>\n    <tr><td>Steps</td><td>\n      <ol>\n        <li>The Actor issues a movement request.</li>\n        <li>PRAK evaluates Safe-to-Move conditions (transmission state, braking state, power state, faults, network status, software compatibility, sensor operational status).</li>\n        <li>PRAK evaluates environmental Safe-to-Move conditions (obstacle detection, operating-zone status, environmental operating limits).</li>\n        <li>PRAK evaluates Motion-Permitted conditions (valid path plan, auto/manual switch in auto, E-Stop clear, localization available).</li>\n        <li>PRAK evaluates Stop-Capable conditions (controlled stop and emergency stop defined and valid).</li>\n        <li>PRAK returns a motion-authorization result to the Actor (authorized or denied with diagnostic reason).</li>\n      </ol>\n    </td></tr>\n    <tr><td>Postconditions/Outcomes</td><td>PRAK is in an explicit motion-authorized or motion-denied state, communicated to the Actor, with no actuation commands having been issued during the evaluation itself.</td></tr>\n    <tr><td>Exceptions/Alternate Flows</td><td>\n      <ol>\n        <li><strong>Motion not authorized</strong> &mdash; any Safe-to-Move, Motion-Permitted, or Stop-Capable check fails; PRAK withholds movement commands, reports a diagnostic reason, and remains in a non-actuating state.</li>\n        <li><strong>E-Stop active</strong> &mdash; PRAK reports E-Stop state and refuses authorization until cleared.</li>\n        <li><strong>Auto/manual switch not in auto</strong> &mdash; PRAK refuses authorization and reports the switch state.</li>\n      </ol>\n    </td></tr>\n    <tr><td>Development Guide Reference</td><td>TBD &mdash; link to polymorphous software safety and state-machine module documentation once available.</td></tr>\n  </tbody>\n</table>\n\n## Use Case Flow Diagram\n\n```mermaid\n%%{init: {\"theme\":\"base\",\"themeVariables\":{\"background\":\"#ffffff\",\"primaryColor\":\"#dae8fc\",\"primaryTextColor\":\"#1f2937\",\"primaryBorderColor\":\"#6c8ebf\",\"lineColor\":\"#55606e\",\"secondaryColor\":\"#d5e8d4\",\"tertiaryColor\":\"#f3f4f6\",\"clusterBkg\":\"#f3f4f6\",\"clusterBorder\":\"#9aa5b1\",\"edgeLabelBackground\":\"#ffffff\",\"textColor\":\"#1f2937\",\"noteBkgColor\":\"#fff3c4\",\"noteTextColor\":\"#1f2937\",\"noteBorderColor\":\"#d6b656\",\"actorBkg\":\"#dae8fc\",\"actorBorder\":\"#6c8ebf\",\"actorTextColor\":\"#1f2937\",\"signalColor\":\"#55606e\",\"signalTextColor\":\"#1f2937\",\"labelBoxBkgColor\":\"#dae8fc\",\"labelBoxBorderColor\":\"#6c8ebf\",\"labelTextColor\":\"#1f2937\",\"loopTextColor\":\"#1f2937\",\"sequenceNumberColor\":\"#ffffff\"}}}%%\nflowchart TD\n    start([Start]):::actor\n    trigger[\"Actor (C2 or Tele-op Controller)<br/>issues movement request\"]:::actor\n\n    pre1{PRAK powered &amp;<br/>in command-accepting mode?}:::gate\n    pre1_fail[\"Report not ready;<br/>remain non-actuating\"]:::fail\n\n    eval_vs{\"Safe-to-Move<br/>(vehicle state)?\"}:::gate\n    eval_env{\"Safe-to-Move<br/>(environment)?\"}:::gate\n    eval_mp{\"Motion-Permitted?<br/>(path, auto, E-Stop, localization)\"}:::gate\n    eval_sc{\"Stop-Capable?<br/>(controlled + emergency)\"}:::gate\n\n    auth_fail[\"Refuse authorization;<br/>report diagnostic to actor\"]:::fail\n\n    return_ok[\"Return motion-authorized<br/>+ diagnostic to actor\"]:::function\n    stop_pause((\"Pause /<br/>Non-Actuating\")):::pause\n    stop_term((\"End\")):::stop\n\n    start --> trigger --> pre1\n    pre1 -- \"No\" --> pre1_fail --> stop_pause\n    pre1 -- \"Yes\" --> eval_vs\n    eval_vs -- \"No\" --> auth_fail\n    eval_vs -- \"Yes\" --> eval_env\n    eval_env -- \"No\" --> auth_fail\n    eval_env -- \"Yes\" --> eval_mp\n    eval_mp -- \"No\" --> auth_fail\n    eval_mp -- \"Yes\" --> eval_sc\n    eval_sc -- \"No\" --> auth_fail\n    eval_sc -- \"Yes\" --> return_ok --> stop_term\n    auth_fail --> stop_pause\n\n    classDef actor fill:#e1d5e7,stroke:#9673a6,color:#000\n    classDef function fill:#dae8fc,stroke:#6c8ebf,color:#000\n    classDef gate fill:#d5e8d4,stroke:#82b366,color:#000\n    classDef fail fill:#f8cecc,stroke:#b85450,color:#000\n    classDef pause fill:#e3c800,stroke:#B09500,color:#000\n    classDef stop fill:#e51400,stroke:#B20000,color:#fff\n```\n","path":"product/use-cases/motion-authorization-framework/uc-safe-to-move-framework.md","refs_out":[],"refs_in":[{"field":"parent-use-cases","filename":"req-fr-01.md","title":"Accept Movement Request from Authorized C2","kind":"product-requirements"},{"field":"parent-use-cases","filename":"req-fr-02.md","title":"Evaluate Safe-to-Move Conditions","kind":"product-requirements"},{"field":"parent-use-cases","filename":"req-fr-03.md","title":"Confirm Motion-Permitted Conditions","kind":"product-requirements"},{"field":"parent-use-cases","filename":"req-fr-04.md","title":"Confirm Stop-Capable Conditions","kind":"product-requirements"},{"field":"parent-use-cases","filename":"req-fr-05.md","title":"Gate Motion on Continuous Authorization","kind":"product-requirements"},{"field":"parent-use-cases","filename":"req-fr-30.md","title":"Operating-Mode and Safe-State Visible Indications","kind":"product-requirements"},{"field":"parent-use-cases","filename":"req-fr-31.md","title":"Authorized Recovery from Safe State","kind":"product-requirements"},{"field":"parent-use-cases","filename":"req-fr-32.md","title":"Objectives Reception","kind":"product-requirements"},{"field":"parent-use-cases","filename":"req-fr-37.md","title":"Immediate Stop on Stop Command","kind":"product-requirements"},{"field":"parent-use-cases","filename":"req-fr-38.md","title":"Cancel Command Response","kind":"product-requirements"},{"field":"parent-use-cases","filename":"req-pr-01.md","title":"Supervisor-Commanded Movement and Navigation","kind":"product-requirements"},{"field":"parent-use-cases","filename":"req-pr-02.md","title":"Stable Runtime and Tele-op ICDs","kind":"product-requirements"},{"field":"parent-use-cases","filename":"req-pr-03.md","title":"Observable Runtime State","kind":"product-requirements"},{"field":"parent-use-cases","filename":"req-pr-05.md","title":"Operate Within Envelope; Transition to Safe State","kind":"product-requirements"},{"field":"parent-use-cases","filename":"req-pr-06.md","title":"Remote/All Stop Safety Capability","kind":"product-requirements"},{"field":"parent-use-cases","filename":"sysreq-accept-c2-movement-request.md","title":"Accept C2 Movement Request over Runtime ICD","kind":"system-requirements"},{"field":"parent-use-cases","filename":"sysreq-confirm-auto-manual-in-auto.md","title":"Confirm Auto/ d":"system-requirements"},{"field":"parent-use-cases","filename":"sysreq-active-stop-mode-query.md","title":"Active Stop Mode Query Interface","kind":"system-requirements"},{"field":"parent-use-cases","filename":"sysreq-all-stop-continuous-monitor.md","title":"All Stop Continuous Communication Monitor","kind":"system-requirements"},{"field":"parent-use-cases","filename":"sysreq-all-stop-failed-event-fault-log.md","title":"Fault Log on Failed All Stop Event Publish","kind":"system-requirements"},{"field":"parent-use-cases","filename":"sysreq-all-stop-in-every-build.md","title":"All Stop Included in Every Build","kind":"system-requirements"},{"field":"parent-use-cases","filename":"sysreq-all-stop-interface.md","title":"All Stop Initialization and Start Interface","kind":"system-requirements"},{"field":"parent-use-cases","filename":"sysreq-all-stop-readiness-on-comm.md","title":"All Stop Readiness Gated on External-Source Communication","kind":"system-requirements"},{"field":"parent-use-cases","filename":"sysreq-cat1-stop-when-no-remote-stop-source.md","title":"Cat1 Stop When No Remote Stop Source","kind":"system-requirements"},{"field":"parent-use-cases","filename":"sysreq-comm-loss-log.md","title":"Communication Loss Log","kind":"system-requirements"},{"field":"parent-use-cases","filename":"sysreq-no-comm-loss-during-startup.md","title":"No Communication-Loss Declaration During Startup","kind":"system-requirements"},{"field":"parent-use-cases","filename":"sysreq-one-active-stop-mode.md","title":"Single Active Stop Mode","kind":"system-requirements"},{"field":"parent-use-cases","filename":"sysreq-reject-all-stop-init-when-remote-stop.md","title":"Reject All Stop Initialization When Remote Stop Active","kind":"system-requirements"},{"field":"parent-use-cases","filename":"sysreq-reject-remote-stop-init-when-all-stop.md","title":"Reject Remote Stop Initialization When All Stop Active","kind":"system-requirements"},{"field":"parent-use-cases","filename":"sysreq-stop-command-on-all-stop-100ms.md","title":"Stop Command Within 100 ms on All Stop or Comm Loss","kind":"system-requirements"},{"field":"parent-use-cases","filename":"sysreq-stop-command-processing-100ms.md","title":"Stop Command Processing Within 100 ms","kind":"system-requirements"},{"field":"parent-use-cases","filename":"sysreq-stop-event-root-cause.md","title":"Stop Event Root-Cause Distinction","kind":"system-requirements"},{"field":"parent-use-cases","filename":"sysreq-subscribe-all-stop-broadcaster.md","title":"Subscribe to All Stop Broadcaster","kind":"system-requirements"}]},{"id":"uc-follow-path","filename":"uc-follow-path.md","title":"Follow a Structured Path from Command and Control","bucket":"path-following","kind":"use-cases","frontmatter":{"id":"uc-follow-path","title":"Follow a Structured Path from Command and Control","primary-actors":["command-and-control.md"],"parent-personas":["command-and-control.md"]},"body":"\n<table>\n  <thead>\n    <tr><th>Field</th><th>Description</th></tr>\n  </thead>\n  <tbody>\n    <tr><td>Primary Actor</td><td>Command and Control System</td></tr>\n    <tr><td>Supporting Actor(s)</td><td>EPT (owns the polymorphous software path-following behavior the robot consumes); MPT (owns the integrated HW+SW behavior, including enforcement of mechatronics constraints and the C2&#8596;robot ICD)</td></tr>\n    <tr><td>Need</td><td>C2 needs to direct a robot along a specific structured path so the robot traverses a planned route to a destination under operator authority while enforcing the navigation rules of the structured environment at runtime.</td></tr>\n    <tr><td>Preconditions</td><td>\n      <ol>\n        <li>Platform Robot Automation Kit (PRAK) is powered and in an operational mode that accepts C2 commands.</li>\n        <li>C2 has an established runtime messaging session with PRAK.</li>\n        <li>PRAK localization is initialized and reporting a valid pose.</li>\n        <li>The robot is inside the configured geofence / operating area.</li>\n        <li>Structured map / topology data describing the route is loaded and valid.</li>\n      </ol>\n    </td></tr>\n    <tr><td>Steps</td><td>\n      <ol>\n        <li>C2 sends structured path segments to PRAK over the runtime messaging API.</li>\n        <li>PRAK validates the path against geometric continuity, kinematic feasibility, geofence constraints, and conformance to the structured map (lane direction, required waypoints, prohibited transitions, control points).</li>\n        <li>PRAK acknowledges acceptance &mdash; or rejects with a diagnostic reason &mdash; to C2.</li>\n        <li>On acceptance, PRAK consumes the path segments and translates them to actuation commands.</li>\n        <li>PRAK localizes relative to structured map elements during execution and produces control values that conform to the structured-map rules (centerline tracking, environment-rule speed conformance, permitted turns, control-point stops).</li>\n        <li>PRAK publishes path execution telemetry (current pose, path progress, cross-track deviation) to C2 at the configured telemetry rate.</li>\n        <li>PRAK monitors structured-route progress and detects rule violations, lane deviation, and blocked routes; on violation, PRAK commands a transition to a safe or stopped state and reports the event to C2.</li>\n        <li>When the robot reaches the path endpoint within tolerance, PRAK publishes a path completion message to C2.</li>\n      </ol>\n    </td></tr>\n    <tr><td>Postconditions/Outcomes</td><td>The robot is at the path endpoint within the stated tolerance; C2 has received a completion message; PRAK is ready to accept the next command.</td></tr>\n    <tr><td>Exceptions/Alternate Flows</td><td>\n      <ol>\n        <li><strong>Validation failure</strong> &mdash; PRAK rejects the path with a diagnostic reason and does not issue movement commands.</li>\n        <li><strong>In-flight replacement</strong> &mdash; C2 sends a new path while one is already accepted; PRAK always rejects the new path.</li>\n        <li><strong>C2 cancellation</strong> &mdash; C2 issues a cancel; PRAK commands a halt within the defined response time and publishes a cancellation confirmation to C2.</li>\n        <li><strong>Execution failure</strong> &mdash; fault, obstacle, or tolerance breach causes PRAK to command a halt and publish a path execution failure with diagnostic information to C2.</li>\n        <li><strong>C2 link loss</strong> &mdash; when the C2 messaging link is lost, PRAK enters the C2 connection-loss safe behavior until the link is restored.</li>\n      </ol>\n    </td></tr>\n    <tr><td>Development Guide Reference</td><td>TBD &mdash; link to the polymorphous software path-following module docs once available.</td></tr>\n  </tbody>\n</table>\n\n## Use Case Flow Diagram\n\n```mermaid\n%%{init: {\"theme\":\"base\",\"themeVariables\":{\"background\":\"#ffffff\",\"primaryColor\":\"#dae8fc\",\"primaryTextColor\":\"#1f2937\",\"primaryBorderColor\":\"#6c8ebf\",\"lineColor\":\"#55606e\",\"secondaryColor\":\"#d5e8d4\",\"tertiaryColor\":\"#f3f4f6\",\"clusterBkg\":\"#f3f4f6\",\"clusterBorder\":\"#9aa5b1\",\"edgeLabelBackground\":\"#ffffff\",\"textColor\":\"#1f2937\",\"noteBkgColor\":\"#fff3c4\",\"noteTextColor\":\"#1f2937\",\"noteBorderColor\":\"#d6b656\",\"actorBkg\":\"#dae8fc\",\"actorBorder\":\"#6c8ebf\",\"actorTextColor\":\"#1f2937\",\"signalColor\":\"#55606e\",\"signalTextColor\":\"#1f2937\",\"labelBoxBkgColor\":\"#dae8fc\",\"labelBoxBorderColor\":\"#6c8ebf\",\"labelTextColor\":\"#1f2937\",\"loopTextColor\":\"#1f2937\",\"sequenceNumberColor\":\"#ffffff\"}}}%%\nflowchart TD\n    start([Start]):::actor\n    trigger[\"C2 issues mission /<br/>supplied path\"]:::actor\n\n    pre_mauth{\"Motion-authorization satisfied?<br/>(&laquo;include&raquo; UC-01)\"}:::gate\n    pre_fail[\"Refuse mission;<br/>report auth diagnostic\"]:::fail\n\n    validate{\"Path valid?<br/>(geometric, kinematic,<br/>geofence, structured-map)\"}:::gate\n    rej[\"Reject path;<br/>publish diagnostic to C2\"]:::fail\n\n    ack[\"Acknowledge acceptance to C2\"]:::function\n    consume[\"Consume path segments;<br/>translate to actuation\"]:::function\n    localize[\"Localize relative to<br/>structured-map elements\"]:::function\n    conform[\"Emit control values:<br/>centerline tracking, speed-conformant,<br/>permitted-turn, stop-conformant\"]:::function\n\n    telem[\"Publish path-execution<br/>telemetry to C2\"]:::function\n\n    monitor{Rule violation,<br/>lane deviation, or<br/>blocked route?}:::gate\n    safe_stop[\"Safe / stopped state;<br/>report event to C2\"]:::fail\n\n    cancel_or_loss{C2 cancellation or<br/>link loss?}:::gate\n    cancel_safe[\"Halt within response time;<br/>publish cancellation /<br/>enter link-loss safe behavior\"]:::fail\n\n    endpoint{Endpoint reached<br/>within tolerance?}:::gate\n    complete[\"Publish path completion<br/>to C2\"]:::function\n\n    stop_pause((\"Pause\")):::pause\n    stop_term((\"End\")):::stop\n\n    start --> trigger --> pre_mauth\n    pre_mauth -- \"No\" --> pre_fail --> stop_pause\n    pre_mauth -- \"Yes\" --> validate\n    validate -- \"No\" --> rej --> stop_pause\n    validate -- \"Yes\" --> ack --> consume --> localize --> conform --> telem --> monitor\n    monitor -- \"Yes\" --> safe_stop --> stop_pause\n    monitor -- \"No\" --> cancel_or_loss\n    cancel_or_loss -- \"Yes\" --> cancel_safe --> stop_pause\n    cancel_or_loss -- \"No\" --> endpoint\n    endpoint -- \"No\" --> conform\n    endpoint -- \"Yes\" --> complete --> stop_term\n\n    classDef actor fill:#e1d5e7,stroke:#9673a6,color:#000\n    classDef function fill:#dae8fc,stroke:#6c8ebf,color:#000\n    classDef gate fill:#d5e8d4,stroke:#82b366,color:#000\n    classDef fail fill:#f8cecc,stroke:#b85450,color:#000\n    classDef pause fill:#e3c800,stroke:#B09500,color:#000\n    classDef stop fill:#e51400,stroke:#B20000,color:#fff\n```\n","path":"product/use-cases/path-following/uc-follow-path.md","refs_out":[],"refs_ ilename":"sysreq-detect-obstacles.md","title":"Detect Obstacles Within Sensing Envelope","kind":"system-requirements"},{"field":"parent-use-cases","filename":"sysreq-detect-path-deviations-violations.md","title":"Detect Path Deviations and Rule Violations","kind":"system-requirements"},{"field":"parent-use-cases","filename":"sysreq-emit-obstacle-stop-avoidance.md","title":"Emit Obstacle Stop or Avoidance Actuation","kind":"system-requirements"},{"field":"parent-use-cases","filename":"sysreq-estimate-pose-sensor-fusion.md","title":"Estimate Pose from Sensor Fusion","kind":"system-requirements"},{"field":"parent-use-cases","filename":"sysreq-execute-path-with-motion-limits.md","title":"Execute Path Within Motion Limits","kind":"system-requirements"},{"field":"parent-use-cases","filename":"sysreq-prohibited-transition-guard.md","title":"Guard Against Prohibited Motion Transitions","kind":"system-requirements"},{"field":"parent-use-cases","filename":"sysreq-publish-localization-confidence.md","title":"Publish Localization Confidence","kind":"system-requirements"},{"field":"parent-use-cases","filename":"sysreq-publish-path-execution-telemetry.md","title":"Publish Path-Execution Telemetry and Completion","kind":"system-requirements"},{"field":"parent-use-cases","filename":"sysreq-report-execution-events-to-c2.md","title":"Report Path-Execution Events to C2","kind":"system-requirements"},{"field":"parent-use-cases","filename":"sysreq-stop-on-execution-fault.md","title":"Stop on Execution Fault or Obstacle","kind":"system-requirements"},{"field":"parent-use-cases","filename":"sysreq-stop-on-heading-overshoot.md","title":"Stop on Heading Overshoot During Turn-In-Place","kind":"system-requirements"},{"field":"parent-use-cases","filename":"sysreq-stop-on-path-deviation.md","title":"Stop on Path Deviation","kind":"system-requirements"},{"field":"parent-use-cases","filename":"sysreq-structured-map-conformance.md","title":"Conform to Structured-Map Rules During Execution","kind":"system-requirements"},{"field":"parent-use-cases","filename":"sysreq-turn-in-place-heading-accuracy.md","title":"Turn-In-Place Heading Accuracy","kind":"system-requirements"},{"field":"parent-use-cases","filename":"sysreq-validate-supplied-path.md","title":"Validate Supplied Path Before Execution","kind":"system-requirements"},{"field":"parent-use-cases","filename":"sysreq-support-steering-box-vehicles.md","title":"Support Steering-Box Vehicles","kind":"system-requirements"}]},{"id":"uc-teleoperation","filename":"uc-teleoperation.md","title":"Tele-operate Robot via Manual Control Inputs","bucket":"teleoperation","kind":"use-cases","frontmatter":{"id":"uc-teleoperation","title":"Tele-operate Robot via Manual Control Inputs","primary-actors":["teleop-controller.md"],"parent-personas":["teleop-controller.md"]},"body":"\n<table>\n  <thead>\n    <tr><th>Field</th><th>Description</th></tr>\n  </thead>\n  <tbody>\n    <tr><td>Primary Actor</td><td>Tele-op Controller</td></tr>\n    <tr><td>Supporting Actor(s)</td><td>EPT (owns the polymorphous software tele-op framework and the base tele-op ICD); Robot Mechatronics Dev Team (owns the robot-specific extensions to the tele-op ICD); MPT (owns the integrated HW+SW behavior at the mechatronics-layer actuation boundary)</td></tr>\n    <tr><td>Need</td><td>A tele-op operator needs to issue real-time manual control inputs to the robot through the tele-op ICD so the robot actuates immediately under operator authority, without the robot following a path.</td></tr>\n    <tr><td>Preconditions</td><td>\n      <ol>\n        <li>Platform Robot Automation Kit (PRAK) is powered and in an operational mode that accepts tele-op inputs.</li>\n        <li>The tele-op controller has an established runtime messaging session with PRAK over the tele-op ICD.</li>\n        <li>PRAK&apos;s motion-authorization preconditions are satisfied (per uc-safe-to-move-framework).</li>\n        <li>The tele-op ICD &mdash; including any robot-specific extensions &mdash; is negotiated and active.</li>\n        <li>The operator has unaided line of sight to the robot and has acknowledged the line-of-sight precondition through the tele-op controller (PRAK does not publish a video stream &mdash; tele-op is line-of-sight only).</li>\n      </ol>\n    </td></tr>\n    <tr><td>Steps</td><td>\n      <ol>\n        <li>The tele-op controller submits a session-initiation request that includes a line-of-sight acknowledgment from the operator.</li>\n        <li>PRAK validates the acknowledgment and the active tele-op ICD, then accepts the session and records the acknowledgment in the safety event log.</li>\n        <li>The tele-op controller streams manual control inputs (speed, direction, robot-specific commands) to PRAK.</li>\n        <li>PRAK validates each input against the active tele-op ICD and current motion-authorization state.</li>\n        <li>PRAK translates valid inputs directly to actuation commands without following a path.</li>\n        <li>PRAK publishes feedback for situational awareness (pose, velocity, implement status, and any robot-specific feedback channels) to the tele-op controller. PRAK does not publish a video stream.</li>\n        <li>PRAK produces actuation commands that conform to motion limits, safety constraints, and the optional geofence during tele-op actuation.</li>\n      </ol>\n    </td></tr>\n    <tr><td>Postconditions/Outcomes</td><td>PRAK has issued actuation commands in accordance with the most recent valid tele-op inputs and continues to publish situational-awareness feedback; the tele-op controller retains real-time authority until the session ends or transitions to another control mode.</td></tr>\n    <tr><td>Exceptions/Alternate Flows</td><td>\n      <ol>\n        <li><strong>Tele-op link loss</strong> &mdash; when the tele-op messaging link is lost, PRAK enters the polymorphous-defined connection-loss safe behavior until the link is restored.</li>\n        <li><strong>Input violates ICD</strong> &mdash; PRAK rejects the input with a diagnostic reason and continues with the last valid command set or transitions to a safe state per ICD policy.</li>\n        <li><strong>Safety constraint violated</strong> &mdash; when a tele-op input would violate an active motion limit, safety constraint, or the configured geofence (where geofence enforcement is enabled), PRAK emits a clamped actuation command that respects the constraint instead of the operator&apos;s requested value, and publishes an override-notification message to the tele-op controller identifying the violated constraint class (per req-teleop-motion-limit-conformance). The session continues under operator authority; subsequent inputs are validated and clamped on the same basis.</li>\n        <li><strong>Motion authorization lost mid-session</strong> &mdash; PRAK commands a transition to a safe or stopped state and reports loss of authorization to the tele-op controller.</li>\n        <li><strong>Line-of-sight acknowledgment absent or invalid</strong> &mdash; the session-initiation request is rejected with a defined diagnostic reason and no session-active state is entered (per req-teleop-line-of-sight-operation).</li>\n      </ol>\n    </td></tr>\n    <tr><td>Development Guide Reference</td><td>TBD &mdash; link to polymorphous software tele-op framework documentation and the PRAK tele-op ICD base specification once available.</td></tr>\n  </tbody>\n</table>\n\n## Use Case Flow Diagram\n\n```mermaid\n%%{init: {\"theme\":\"base\",\"themeVariables\":{\"background\":\"#ffffff\",\"primaryColor\":\"#dae8fc\",\"primaryTextColor\":\"#1f2937\",\"primaryBorderColor\":\"#6c8ebf\",\"lineColor\":\"#55606e\",\"secondaryColor\":\"#d5e8d4\",\"tertiaryColor\":\"#f3f4f6\",\"clusterBkg\":\"#f3f4f6\",\"clusterBorder\":\"#9aa5b1\",\"edgeLabelBackground\":\"#ffffff\",\"textColor\":\"#1f2937\",\"noteBkgColor\":\"#fff3c4\",\"noteTextColor\":\"#1f2937\",\"noteBorderColor\":\"#d6b656\",\"actorBkg\":\"#dae8fc\",\"actorBorder\":\"#6c8ebf\",\"actorTextColor\":\"#1f2937\",\"signalColor\":\"#55606e\",\"signalTextColor\":\"#1f2937\",\"labelBoxBkgColor\":\"#dae8fc\",\"labelBoxBorderColor\":\"#6c8ebf\",\"labelTextColor\":\"#1f2937\",\"loopTextColor\":\"#1f2937\",\"sequenceNumberColor\":\"#ffffff\"}}}%%\nflowchart TD\n    start([Start]):::actor\n    trigger[\"Tele-op Controller submits<br/>session-initiation request<br/>+ LOS acknowledgment\"]:::actor\n\n    pre_los{LOS acknowledgment<br/>present &amp; valid?}:::gate\n    pre_icd{\"Tele-op ICD valid?<br/>(base + extensions)\"}:::gate\n    pre_mauth{\"Motion-authorization satisfied?<br/>(&laquo;include&raquo; UC-01)\"}:::gate\n\n    reject[\"Reject session;<br/>publish diagnostic;<br/>no session-active state\"]:::fail\n\n    accept[\"Accept session;<br/>record LOS acknowledgment<br/>in safety event log\"]:::function\n\n    receive[\"Receive manual<br/>control input\"]:::actor\n    val_input{Input valid<br/>against active ICD?}:::gate\n    input_rej[\"Reject input;<br/>continue on last valid until<br/>staleness timeout\"]:::fail\n\n    conform_chk{\"Input within<br/>kinematic / velocity / safety /<br/>(optional) geofence?\"}:::gate\n    clamp[\"Emit clamped actuation;<br/>publish override-notification<br/>to tele-op controller\"]:::fail\n\n    actuate[\"Translate to actuation;<br/>publish situational-awareness<br/>feedback (no video)\"]:::function\n\n    revoke{Motion-authorization<br/>lost or link lost?}:::gate\n    safe[\"Safe / stopped state;<br/>report loss to tele-op controller\"]:::fail\n\n    stop_pause((\"Pause\")):::pause\n    stop_term((\"Session end\")):::stop\n\n    start --> trigger --> pre_los\n    pre_los -- \"No\" --> reject --> stop_pause\n    pre_los -- \"Yes\" --> pre_icd\n    pre_icd -- \"No\" --> reject\n    pre_icd -- \"Yes\" --> pre_mauth\n    pre_mauth -- \"No\" --> reject\n    pre_mauth -- \"Yes\" --> accept --> receive\n    receive --> val_input\n    val_input -- \"No\" --> input_rej --> receive\n    val_input -- \"Yes\" --> conform_chk\n    conform_chk -- \"No\" --> clamp --> actuate\n    conform_chk -- \"Yes\" --> actuate\n    actuate --> revoke\n    revoke -- \"No\" --> receive\n    revoke -- \"Yes\" --> safe --> stop_term\n\n    classDef actor fill:#e1d5e7,stroke:#9673a6,color:#000\n    classDef function fill:#dae8fc,stroke:#6c8ebf,color:#000\n    classDef gate fill:#d5e8d4,stroke:#82b366,color:#000\n    classDef fail fill:#f8cecc,stroke:#b85450,color:#000\n    classDef pause fill:#e3c800,stroke:#B09500,color:#000\n    classDef stop fill:#e51400,stroke:#B20000,color:#fff\n```\n","path":"product/use-cases/teleoperation/uc-teleoperation.md","refs_out":[],"refs_in":[{"field":"parent-use-cases","filename":"req-fr-05.md","title":"Gate Motion on Continuous Authorization","kind":"product-requirements"},{"field":"parent-use-cases","filename":"req-fr-11.md","title":"Prohibited Motion Transition Guard","kind":"product-requirements"},{"field":"parent-use-cases","filename":"req-fr-17.md","title":"Tele-op Session Initiation Validation","kind":"product-requirements"},{"field":"parent-use-cases","filename":"req-fr-18.md","title":"Tele-op Input Validation, Rejection, and Staleness Handling","kind":"product-requirements"},{"field":"parent-use-cases","filename":"req-fr-19.md","title":"Tele-op Direct Actuation Translation","kind":"product-requirements"},{"field":"parent-use-cases","filename":"req-fr-20.md","title":"Tele-op Motion-Limit Conformance","kind":"product-requirements"},{"field":"parent-use-cases","filename":"req-fr-21.md","title":"Tele-op Situational-Awareness Feedback","kind":"product-requirements"},{"field":"parent-use-cases","filename":"req-fr-22.md","title":"Tele-op Link Loss and Motion-Auth Loss","kind":"product-requirements"},{"field":"parent-use-cases","filename":"req-fr-28.md","title":"Tele-op Line-of-Sight Operation; No Video Stream","kind":"product-requirements"},{"field":"parent-use-cases","filename":"req-fr-29.md","title":"Obstacle Detection and Avoidance","kind":"product-requirements"},{"field":"parent-use-cases","filename":"req-fr-30.md","title":"Operating-Mode and Safe-State Visible Indications","kind":"product-requirements"},{"field":"parent-use-cases","filename":"req-fr-31.md","title":"Authorized Recovery from Safe State","kind":"product-requirements"},{"field":"parent-use-cases","filename":"req-fr-37.md","title":"Immediate Stop on Stop Command","kind":"product-requirements"},{"field":"parent-use-cases","filename":"req-fr-39.md","title":"Tele-op Command Authorization Within Limits","kind":"product-requirements"},{"field":"parent-use-cases","filename":"req-fr-40.md","title":"Tele-op Exclusive Control","kind":"product-requirements"},{"field":"parent-use-cases","filename":"req-fr-41.md","title":"Tele-op Control Command Latency","kind":"product-requirements"},{"field":"parent-use-cases","filename":"req-fr-42.md","title":"Tele-op Full Operator Control","kind":"product-requirements"},{"field":"parent-use-cases","filename":"req-pr-02.md","title":"Stable Runtime and Tele-op ICDs","kind":"product-requirements"},{"field":"parent-use-cases","filename":"req-pr-03.md","title":"Observable Runtime State","kind":"product-requirements"},{"field":"parent-use-cases","filename":"req-pr-05.md","title":"Operate Within Envelope; Transition to Safe State","kind":"product-requirements"},{"field":"parent-use-cases","filename":"req-pr-07.md","title":"Articulated Vehicle Support","kind":"product-requirements"},{"field":"parent-use-cases","filename":"sysreq-publish-visible-operating-indications.md","title":"Publish Visible Operating-Mode and Safe-State Indications","kind":"system-requirements"},{"field":"parent-use-cases","filename":"sysreq-record-recovery-acknowledgment.md","title":"Record Recovery Acknowledgment","kind":"system-requirements"},{"field":"parent-use-cases","filename":"sysreq-withhold-motion-until-recovery-authorized.md","title":"Withhold Motion Until Authorized Recovery","kind":"system-requirements"},{"field":"parent-use-cases","filename":"sysreq-detect-obstacles.md","title":"Detect Obstacles Within Sensing Envelope","kind":"system-requirements"},{"field":"parent-use-cases","filename":"sysreq-emit-obstacle-stop-avoidance.md","title":"Emit Obstacle Stop or Avoidance Actuation","kind":"system-requirements"},{"field":"parent-use-cases","filename":"sysreq-prohibited-transition-guard.md","title":"Guard Against Prohibited Motion Transitions","kind":"system-requirements"},{"field":"parent-use-cases","filename":"sysreq-detect-teleop-link-loss-and-report.md","title":"Detect and Report Tele-op Link / Motion-Auth Loss","kind":"system-requirements"},{"field":"parent-use-cases","filename":"sysreq-gate-teleop-session-on-motion-auth.md","title":"Gate Tele-op Session on Motion Authorization","kind":"system-requirements"},{"field":"parent-use-cases","filename":"sysreq-no-video-stream-on-teleop-icd.md","title":"No Video Stream on Tele-op ICD","kind":"system-requirements"},{"field":"parent-use-cases","filename":"sysreq-provide-teleop-pose-velocity-feedback.md","title":"Provide Tele-op Pose and Velocity Feedback","kind":"system-requirements"},{"field":"parent-use-cases","filename":"sysreq-publish-teleop-override-notification.md","title":"Publish Tele-op Override Notification","kind":"system-requirements"},{"field":"parent-use-cases","filename":"sysreq-publish-teleop-situational-feedback.md","title":"Publish Tele-op Situational-Awareness Feedback","kind":"system-requirements"},{"field":"parent-use-cases","filename":"sysreq-require-los-ack-at-session-init.md","title":"Require Line-of-Sight Acknowledgment at Session Init","kind":"system-requirements"},{"field":"parent-use-cases","filename":"sysreq-teleop-connection-loss-safe-behavior.md","title":"Tele-op Connection-Loss Safe Behavior","kind":"system-requirements"},{"field":"parent-use-cases","filename":"sysreq-teleop-input-staleness-timeout.md","title":"Tele-op Input Staleness Timeout","kind":"system-requirements"},{"field":"parent-use-cases","filename":"sysreq-teleop-motion-limit-conformance.md","title":"Tele-op Motion-Limit and Geofence Conformance","kind":"system-requirements"},{"field":"parent-use-cases","filename":"sysreq-teleop-network-timeout-estop.md","title":"Tele-op Network-Timeout Emergency Stop","kind":"system-requirements"},{"field":"parent-use-cases","filename":"sysreq-translate-teleop-input-to-actuation.md","title":"Translate Tele-op Input to Actuation","kind":"system-requirements"},{"field":"parent-use-cases","filename":"sysreq-validate-teleop-icd-at-session-init.md","title":"Validate Tele-op ICD at Session Initiation","kind":"system-requirements"},{"field":"parent-use-cases","filename":"sysreq-validate-teleop-input-against-icd.md","title":"Validate Tele-op Input Against Active ICD","kind":"system-requirements"},{"field":"parent-use-cases","filename":"sysreq-support-steering-box-vehicles.md","title":"Support Steering-Box Vehicles","kind":"system-requirements"}]}],"product-requirements":[{"id":"req-fr-01","filename":"req-fr-01.md","title":"Accept Movement Request from Authorized C2","bucket":"functional","kind":"product-requirements","frontmatter":{"id":"req-fr-01","prd-id":"FR-01","title":"Accept Movement Request from Authorized C2","parent-use-cases":["uc-safe-to-move-framework.md"],"priority":"High"},"body":"\n<table>\n  <thead>\n    <tr><th>Field</th><th>Description</th></tr>\n  </thead>\n  <tbody>\n    <tr><td>ID</td><td>req-fr-01</td></tr>\n    <tr><td>PRD ID</td><td>FR-01</td></tr>\n    <tr><td>Parent Use Cases</td><td>uc-safe-to-move-framework.md</td></tr>\n    <tr><td>Priority</td><td>High</td></tr>\n    <tr><td>Requirement Statement</td><td>PRAK shall accept a movement request from an authorized Command and Control (C2) system.</td></tr>\n    <tr><td>Rationale</td><td>Closes the request/response loop with C2. A bare authorized/denied result is insufficient &mdash; the operator needs the diagnostic detail to remediate (clear E-Stop, switch to auto, wait for localization, replace a sensor). Without explicit diagnostic content, C2 cannot distinguish a transient block from a configuration error.</td></tr>\n    <tr><td>Acceptance Criteria</td><td>For each evaluation outcome (authorized; denied with each failing condition class from req-safe-to-move-vehicle-state, req-safe-to-move-environment, req-motion-permitted, and req-stop-capable), the response delivered to C2 contains the correct result and, on denial, identifies every failing condition class.</td></tr>\n    <tr><td>PRD Coverage</td><td>UC: UC-01; Release: R1.0; Goal: VG-01</td></tr>\n  </tbody>\n</table>\n","path":"product/requirements/functional/req-fr-01.md","refs_out":[{"field":"parent-use-cases","filename":"uc-safe-to-move-framework.md","title":"Safe to Move Framework","kind":"use-cases"}],"refs_in":[{"field":"parent-product-requirement","filename":"sysreq-accept-c2-movement-request.md","title":"Accept C2 Movement Request over Runtime ICD","kind":"system-requirements"}]},{"id":"req-fr-02","filename":"req-fr-02.md","title":"Evaluate Safe-to-Move Conditions","bucket":"functional","kind":"product-requirements","frontmatter":{"id":"req-fr-02","prd-id":"FR-02","title":"Evaluate Safe-to-Move Conditions","parent-use-cases":["uc-safe-to-move-framework.md"],"priority":"Critical"},"body":"\n<table>\n  <thead>\n    <tr><th>Field</th><th>Description</th></tr>\n  </thead>\n  <tbody>\n    <tr><td>ID</td><td>req-fr-02</td></tr>\n    <tr><td>PRD ID</td><td>FR-02</td></tr>\n    <tr><td>Parent Use Cases</td><td>uc-safe-to-move-framework.md</td></tr>\n    <tr><td>Priority</td><td>Critical</td></tr>\n    <tr><td>Requirement Statement</td><td>On receipt of a movement request, PRAK shall evaluate Safe-to-Move conditions including transmission state, braking state, power state, fault state, network link status, software compatibility, sensor operational status, presence of obstacles, operating-zone status, and environmental envelope.</td></tr>\n    <tr><td>Rationale</td><td><strong>Safe-to-Move Vehicle-State Confirmation:</strong> Vehicle-state readiness is the internal, hardware-and-software side of Safe-to-Move. The robot must verify it is mechanically and computationally able to move before any actuation; without an explicit confirmation, latent faults (engaged parking brake, stale sensor data, software-version mismatch) can be masked at the gate and surface as in-motion failures.<br><strong>Safe-to-Move Environmental Confirmation:</strong> Environmental readiness is the external side of Safe-to-Move and is allocated primarily to Perception. Obstacles in the immediate motion zone, restricted or exclusionary operating zones, and out-of-envelope environmental conditions (e.g. weather that degrades perception) must each block the gate; otherwise motion can begin in conditions the perception system cannot reliably support.</td></tr>\n    <tr><td>Acceptance Criteria</td><td><ul><li><strong>Safe-to-Move Vehicle-State Confirmation:</strong> For each vehicle-state check class (transmission, braking, power, faults, network, software compatibility, sensor operational status), simulation of a failing condition causes the motion-authorization evaluation to return denied with the failing class identified.</li><li><strong>Safe-to-Move Environmental Confirmation:</strong> For each environmental check (obstacle present in immediate motion zone, operating zone non-permissive, environmental conditions out of limits), simulation causes the motion-authorization evaluation to return denied with the failing class identified.</li></ul></td></tr>\n    <tr><td>PRD Coverage</td><td>UC: UC-01; Release: R1.0; Goal: VG-01, VG-06</td></tr>\n  </tbody>\n</table>\n","path":"product/requirements/functional/req-fr-02.md","refs_out":[{"field":"parent-use-cases","filename":"uc-safe-to-move-framework.md","title":"Safe to Move Framework","kind":"use-cases"}],"refs_in":[{"field":"parent-product-requirement","filename":"sysreq-evaluate-vehicle-state-conditions.md","title":"Evaluate Vehicle-State Safe-to-Move Conditions","kind":"system-requirements"},{"field":"parent-product-requirement","filename":"sysreq-provide-operating-zone-status.md","title":"Provide Operating-Zone Status","kind":"system-requirements"}]},{"id":"req-fr-03","filename":"req-fr-03.md","title":"Confirm Motion-Permitted Conditions","bucket":"functional","kind":"product-requirements","frontmatter":{"id":"req-fr-03","prd-id":"FR-03","title":"Confirm Motion-Permitted Conditions","parent-use-cases":["uc-safe-to-move-framework.md"],"priority":"Critical"},"body":"\n<table>\n  <thead>\n    <tr><th>Field</th><th>Description</th></tr>\n  </thead>\n  <tbody>\n    <tr><td>ID</td><td>req-fr-03</td></tr>\n    <tr><td>PRD ID</td><td>FR-03</td></tr>\n    <tr><td>Parent Use Cases</td><td>uc-safe-to-move-framework.md</td></tr>\n    <tr><td>Priority</td><td>Critical</td></tr>\n    <tr><td>Requirement Statement</td><td>PRAK shall confirm Motion-Permitted conditions (valid path plan, auto/manual switch in auto, E-Stop clear, localization available) before initiating motion.</td></tr>\n    <tr><td>Rationale</td><td>Motion-Permitted is distinct from Safe-to-Move: Safe-to-Move asks whether the robot <em>can</em> move; Motion-Permitted asks whether the robot is <em>allowed</em> to move under operator authority and system policy. A robot in perfect mechanical health must still be denied motion if the operator has placed it in manual, E-Stop is latched, no path is planned, or localization has not yet converged.</td></tr>\n    <tr><td>Acceptance Criteria</td><td>For each motion-permitted check (valid path plan, auto/manual switch position, E-Stop state, localization availability), simulation of a failing condition causes the motion-authorization evaluation to return denied with the failing class identified.</td></tr>\n    <tr><td>PRD Coverage</td><td>UC: UC-01; Release: R1.0; Goal: VG-01</td></tr>\n  </tbody>\n</table>\n","path":"product/requirements/functional/req-fr-03.md","refs_out":[{"field":"parent-use-cases","filename":"uc-safe-to-move-framework.md","title":"Safe to Move Framework","kind":"use-cases"}],"refs_in":[{"field":"parent-product-requirement","filename":"sysreq-confirm-auto-manual-in-auto.md","title":"Confirm Auto/Manual Switch in Auto","kind":"system-requirements"},{"field":"parent-product-requirement","filename":"sysreq-confirm-estop-clear.md","title":"Confirm E-Stop State Clear","kind":"system-requirements"},{"field":"parent-product-requirement","filename":"sysreq-confirm-valid-path-plan-present.md","title":"Confirm Valid Path Plan Present","kind":"system-requirements"},{"field":"parent-product-requirement","filename":"sysreq-provide-localization-availability.md","title":"Provide Localization Availability and Confidence","kind":"system-requirements"}]},{"id":"req-fr-04","filename":"req-fr-04.md","title":"Confirm Stop-Capable Conditions","bucket":"functional","kind":"product-requirements","frontmatter":{"id":"req-fr-04","prd-id":"FR-04","title":"Confirm Stop-Capable Conditions","parent-use-cases":["uc-safe-to-move-framework.md"],"priority":"Critical"},"body":"\n<table>\n  <thead>\n    <tr><th>Field</th><th>Description</th></tr>\n  </thead>\n  <tbody>\n    <tr><td>ID</td><td>req-fr-04</td></tr>\n    <tr><td>PRD ID</td><td>FR-04</td></tr>\n    <tr><td>Parent Use Cases</td><td>uc-safe-to-move-framework.md</td></tr>\n    <tr><td>Priority</td><td>Critical</td></tr>\n    <tr><td>Requirement Statement</td><td>PRAK shall confirm Stop-Capable conditions (controlled-stop and emergency-stop capability defined and operational) before initiating motion.</td></tr>\n    <tr><td>Rationale</td><td>The ability to stop is the safety prerequisite for the ability to start. Motion-authorization that does not verify both controlled-stop and emergency-stop capability risks committing the robot to motion that cannot be safely terminated. This is the asymmetry between &ldquo;can start&rdquo; and &ldquo;should start&rdquo;: the latter requires the stopping authority to be live.</td></tr>\n    <tr><td>Acceptance Criteria</td><td>For each stop-capable check (controlled stop defined and operational, emergency stop defined and operational), simulation of a failing condition causes the motion-authorization evaluation to return denied with the failing class identified.</td></tr>\n    <tr><td>PRD Coverage</td><td>UC: UC-01; Release: R1.0; Goal: VG-01, VG-06</td></tr>\n  </tbody>\n</table>\n","path":"product/requirements/functional/req-fr-04.md","refs_out":[{"field":"parent-use-cases","filename":"uc-safe-to-move-framework.md","title":"Safe to Move Framework","kind":"use-cases"}],"refs_in":[{"field":"parent-product-requirement","filename":"sysreq-confirm-stop-capability.md","title":"Confirm Stop-Capability Operational","kind":"system-requirements"}]},{"id":"req-fr-05","filename":"req-fr-05.md","title":"Gate Motion on Continuous Authorization","bucket":"functional","kind":"product-requirements","frontmatter":{"id":"req-fr-05","prd-id":"FR-05","title":"Gate Motion on Continuous Authorization","parent-use-cases":["uc-safe-to-move-framework.md","uc-follow-path.md","uc-teleoperation.md"],"priority":"Critical"},"body":"\n<table>\n  <thead>\n    <tr><th>Field</th><th>Description</th></tr>\n  </thead>\n  <tbody>\n    <tr><td>ID</td><td>req-fr-05</td></tr>\n    <tr><td>PRD ID</td><td>FR-05</td></tr>\n    <tr><td>Parent Use Cases</td><td>uc-safe-to-move-framework.md, uc-follow-path.md, uc-teleoperation.md</td></tr>\n    <tr><td>Priority</td><td>Critical</td></tr>\n    <tr><td>Requirement Statement</td><td>PRAK shall not initiate or continue commanded motion if any Safe-to-Move, Motion-Permitted, or Stop-Capable condition is false; loss of any condition during motion shall trigger transition to a safe or stopped state with diagnostic notification to C2 (and the Tele-op Controller during a tele-op session).</td></tr>\n    <tr><td>Rationale</td><td><strong>No Actuation Before Motion Authorization:</strong> Closes the safety loop on the motion-authorization gate. Without this requirement, a fault in the response path (lost message, race condition, partial authorization) could allow actuation while authorization is still in evaluation or has resulted in denial. This requirement makes the gate a hard precondition for actuation, not just a recommended check.<br><strong>Motion-Authorization Loss During Path Execution:</strong> Motion-authorization is a continuous precondition for motion, not a one-shot gate. Sensors fault, geofence updates, E-Stop latches, stop capability degrades &mdash; any of these can invalidate the authorization mid-mission. The robot must not continue executing a C2-supplied path under conditions the gate would no longer accept. Reporting the loss to C2 gives the operator the diagnostic context needed to decide on recovery. Mirrors `req-teleop-motion-authorization-loss` for the navigation use cases. Distinct from `req-path-execution-failure` because the failing cause is a system-state authorization condition rather than a path-execution-specific runtime condition (fault, obstacle, deviation, blocked route).</td></tr>\n    <tr><td>Acceptance Criteria</td><td><ul><li><strong>No Actuation Before Motion Authorization:</strong> Simulation of motion commands issued before motion-authorization is granted, during evaluation, and after denial each produces zero actuation output; only an authorized result permits actuation.</li><li><strong>Motion-Authorization Loss During Path Execution:</strong> For each motion-authorization condition class (Safe-to-Move, Motion-Permitted, Stop-Capable), simulation of the condition becoming false during path execution produces (a) transition to a safe or stopped state within the configured detection latency and (b) a motion-authorization-loss notification consumable by C2 identifying the failing condition class.</li></ul></td></tr>\n    <tr><td>PRD Coverage</td><td>UC: UC-01, UC-02, UC-04; Release: R1.0; Goal: VG-01, VG-06</td></tr>\n  </tbody>\n</table>\n","path":"product/requirements/functional/req-fr-05.md","refs_out":[{"field":"parent-use-cases","filename":"uc-safe-to-move-framework.md","title":"Safe to Move Framework","kind":"use-cases"},{"field":"parent-use-cases","filename":"uc-follow-path.md","title":"Follow a Structured Path from Command and Control","kind":"use-cases"},{"field":"parent-use-cases","filename":"uc-teleoperation.md","title":"Tele-operate Robot via Manual Control Inputs","kind":"use-cases"}],"refs_in":[{"field":"parent-product-requirement","filename":"sysreq-gate-continuous-motion-authorization.md","title":"Continuously Gate Motion Authorization","kind":"system-requirements"},{"field":"parent-product-requirement","filename":"sysreq-publish-motion-authorization-state.md","title":"Publish Motion-Authorization State and Diagnostics","kind":"system-requirements"},{"field":"parent-product-requirement","filename":"sysreq-safe-state-transition-on-auth-loss.md","title":"Transition to Safe State on Authorization Loss","kind":"system-requirements"},{"field":"parent-product-requirement","filename":"arch-motion-authorization-state.md","title":"Motion-Authorization State Machine","kind":"architecture-diagrams"}]},{"id":"req-fr-06","filename":"req-fr-06.md","title":"Validate Supplied Path","bucket":"functional","kind":"product-requirements","frontmatter":{"id":"req-fr-06","prd-id":"FR-06","title":"Validate Supplied Path","parent-use-cases":["uc-follow-path.md"],"priority":"High"},"body":"\n<table>\n  <thead>\n    <tr><th>Field</th><th>Description</th></tr>\n  </thead>\n  <tbody>\n    <tr><td>ID</td><td>req-fr-06</td></tr>\n    <tr><td>PRD ID</td><td>FR-06</td></tr>\n    <tr><td>Parent Use Cases</td><td>uc-follow-path.md</td></tr>\n    <tr><td>Priority</td><td>High</td></tr>\n    <tr><td>Requirement Statement</td><td>PRAK shall accept a path from C2 and validate it against geometric, kinematic, geofence, and (where structured-map elements are present in the active route) structured-map conformance constraints before executing.</td></tr>\n    <tr><td>Rationale</td><td>Prevents the robot from executing paths that are infeasible, unsafe, out of bounds, or non-conformant with the structured environment. Validation gates execution so faults are detected before actuation begins. The structured-map conformance clause is conditional on the active route containing structured-map elements; pure free-space paths satisfy the clause vacuously, allowing the same validation requirement to cover free-space, structured, and partially structured routes under one C2-plans contract.</td></tr>\n    <tr><td>Acceptance Criteria</td><td>All path segments are within geometric, kinematic, and geofence constraints, and within structured-map conformance constraints where structured-map elements are present in the active route, before executing; otherwise the path is rejected with a diagnostic reason identifying the failed constraint class.</td></tr>\n    <tr><td>PRD Coverage</td><td>UC: UC-02; Release: R1.0; Goal: VG-02, VG-03</td></tr>\n  </tbody>\n</table>\n","path":"product/requirements/functional/req-fr-06.md","refs_out":[{"field":"parent-use-cases","filename":"uc-follow-path.md","title":"Follow a Structured Path from Command and Control","kind":"use-cases"}],"refs_in":[{"field":"parent-product-requirement","filename":"sysreq-validate-supplied-path.md","title":"Validate Supplied Path Before Execution","kind":"system-requirements"}]},{"id":"req-fr-07","filename":"req-fr-07.md","title":"Acknowledge Path Acceptance or Rejection","bucket":"functional","kind":"product-requirements","frontmatter":{"id":"req-fr-07","prd-id":"FR-07","title":"Acknowledge Path Acceptance or Rejection","parent-use-cases":["uc-follow-path.md"],"priority":"High"},"body":"\n<table>\n  <thead>\n    <tr><th>Field</th><th>Description</th></tr>\n  </thead>\n  <tbody>\n    <tr><td>ID</td><td>req-fr-07</td></tr>\n    <tr><td>PRD ID</td><td>FR-07</td></tr>\n    <tr><td>Parent Use Cases</td><td>uc-follow-path.md</td></tr>\n    <tr><td>Priority</td><td>High</td></tr>\n    <tr><td>Requirement Statement</td><td>PRAK shall acknowledge the supplied path to C2 with acceptance or rejection (with diagnostic reason) before any actuation occurs.</td></tr>\n    <tr><td>Rationale</td><td>Closes the command loop with C2 so the operator knows whether the commanded path was accepted; the diagnostic reason supports operator remediation. Complements req-path-validation (which gates execution) and Exception 1 (the robot does not move on rejection).</td></tr>\n    <tr><td>Acceptance Criteria</td><td>A valid path produces an acceptance acknowledgement consumable by C2, an invalid path produces a rejection acknowledgement with diagnostic reason.</td></tr>\n    <tr><td>PRD Coverage</td><td>UC: UC-02; Release: R1.0; Goal: VG-02, VG-07</td></tr>\n  </tbody>\n</table>\n","path":"product/requirements/functional/req-fr-07.md","refs_out":[{"field":"parent-use-cases","filename":"uc-follow-path.md","title":"Follow a Structured Path from Command and Control","kind":"use-cases"}],"refs_in":[{"field":"parent-product-requirement","filename":"sysreq-acknowledge-path-to-c2.md","title":"Acknowledge Path Acceptance or Rejection to C2","kind":"system-requirements"}]},{"id":"req-fr-08","filename":"req-fr-08.md","title":"Pose Estimation and Localization Confidence","bucket":"functional","kind":"product-requirements","frontmatter":{"id":"req-fr-08","prd-id":"FR-08","title":"Pose Estimation and Localization Confidence","parent-use-cases":["uc-follow-path.md"],"priority":"High"},"body":"\n<table>\n  <thead>\n    <tr><th>Field</th><th>Description</th></tr>\n  </thead>\n  <tbody>\n    <tr><td>ID</td><td>req-fr-08</td></tr>\n    <tr><td>PRD ID</td><td>FR-08</td></tr>\n    <tr><td>Parent Use Cases</td><td>uc-follow-path.md</td></tr>\n    <tr><td>Priority</td><td>High</td></tr>\n    <tr><td>Requirement Statement</td><td>PRAK shall acquire sensor data, fuse sensor inputs to determine pose, express pose in a defined real-world coordinate frame, and publish a localization-confidence value bounded to the active map structure where present.</td></tr>\n    <tr><td>Rationale</td><td>Pose relative to the structured environment &mdash; not just a world-frame pose &mdash; is what centerline tracking, control-point stops, and rule-violation detection consume. A confidence value bounded to the structure lets C2 and the safety layer reason about whether structured-rule enforcement can be trusted.</td></tr>\n    <tr><td>Acceptance Criteria</td><td>During execution of a representative planned path through structured-map elements, the robot publishes pose-relative-to-structure and localization-confidence at the configured cadence; confidence drops on simulated sensor degradation and recovers on restoration.</td></tr>\n    <tr><td>PRD Coverage</td><td>UC: UC-02; Release: R1.0; Goal: VG-05</td></tr>\n  </tbody>\n</table>\n","path":"product/requirements/functional/req-fr-08.md","refs_out":[{"field":"parent-use-cases","filename":"uc-follow-path.md","title":"Follow a Structured Path from Command and Control","kind":"use-cases"}],"refs_in":[{"field":"parent-product-requirement","filename":"sysreq-estimate-pose-sensor-fusion.md","title":"Estimate Pose from Sensor Fusion","kind":"system-requirements"},{"field":"parent-product-requirement","filename":"sysreq-publish-localization-confidence.md","title":"Publish Localization Confidence","kind":"system-requirements"}]},{"id":"req-fr-09","filename":"req-fr-09.md","title":"Execute Path with Motion-Limit Conformance","bucket":"functional","kind":"product-requirements","frontmatter":{"id":"req-fr-09","prd-id":"FR-09","title":"Execute Path with Motion-Limit Conformance","parent-use-cases":["uc-follow-path.md"],"priority":"High"},"body":"\n<table>\n  <thead>\n    <tr><th>Field</th><th>Description</th></tr>\n  </thead>\n  <tbody>\n    <tr><td>ID</td><td>req-fr-09</td></tr>\n    <tr><td>PRD ID</td><td>FR-09</td></tr>\n    <tr><td>Parent Use Cases</td><td>uc-follow-path.md</td></tr>\n    <tr><td>Priority</td><td>High</td></tr>\n    <tr><td>Requirement Statement</td><td>While executing a supplied path, PRAK shall execute path segments in order, convert them to actuation commands, track the path using sensor feedback, and produce actuation commands that conform to configured kinematic, velocity, and acceleration motion limits.</td></tr>\n    <tr><td>Rationale</td><td>Defines the core path-following capability &mdash; the robot's ability to consume a sequence of path segments and translate them into the actuation that moves the robot along the path.</td></tr>\n    <tr><td>Acceptance Criteria</td><td>Simulate path received and compare that simulated path traversal matches in the order segments were received.</td></tr>\n    <tr><td>PRD Coverage</td><td>UC: UC-02; Release: R1.0; Goal: VG-02</td></tr>\n  </tbody>\n</table>\n","path":"product/requirements/functional/req-fr-09.md","refs_out":[{"field":"parent-use-cases","filename":"uc-follow-path.md","title":"Follow a Structured Path from Command and Control","kind":"use-cases"}],"refs_in":[{"field":"parent-product-requirement","filename":"sysreq-execute-path-with-motion-limits.md","title":"Execute Path Within Motion Limits","kind":"system-requirements"},{"field":"parent-product-requirement","filename":"arch-c2-path-execution-sequence.md","title":"C2 Path Execution Sequence","kind":"architecture-diagrams"},{"field":"parent-product-requirement","filename":"arch-use-case-context.md","title":"Use Case Context Diagram","kind":"architecture-diagrams"}]},{"id":"req-fr-10","filename":"req-fr-10.md","title":"Structured-Map Rule Conformance","bucket":"functional","kind":"product-requirements","frontmatter":{"id":"req-fr-10","prd-id":"FR-10","title":"Structured-Map Rule Conformance","parent-use-cases":["uc-follow-path.md"],"priority":"High"},"body":"\n<table>\n  <thead>\n    <tr><th>Field</th><th>Description</th></tr>\n  </thead>\n  <tbody>\n    <tr><td>ID</td><td>req-fr-10</td></tr>\n    <tr><td>PRD ID</td><td>FR-10</td></tr>\n    <tr><td>Parent Use Cases</td><td>uc-follow-path.md</td></tr>\n    <tr><td>Priority</td><td>High</td></tr>\n    <tr><td>Requirement Statement</td><td>While executing a supplied path through structured map elements, PRAK shall produce control values that track the centerline of the active lane/corridor within the defined lateral tolerance, produce commanded speeds that do not exceed the maximum encoded for the active map element, and emit a controlled-stop actuation command sequence at control points flagged stop.</td></tr>\n    <tr><td>Rationale</td><td><strong>Lane / Corridor Centerline Tracking:</strong> Centerline tracking is the runtime behavior that keeps the robot inside its assigned lane or corridor as the C2-supplied path is executed. Without an explicit tolerance, path execution can drift to the edge of a corridor and create unsafe interactions with adjacent traffic or fixed structure.<br><strong>Environment-Rule Speed Conformance:</strong> Different map elements (intersections, station approaches, restricted zones) carry different speed limits. PRAK, as a framework, cannot itself regulate physical speed at the actuation boundary &mdash; that happens in the integrated robot &mdash; but it must ensure that the speed values it emits never exceed the limit encoded for the active map element, so a path commanded at a higher speed cannot cause the integrated robot to violate the local rule.<br><strong>Control-Point Stop:</strong> Control points (stop bars, yield points, station gates) encode environment rules that require the robot to halt regardless of what the C2-supplied path says. Enforcement at runtime is necessary because the structured map &mdash; not the path &mdash; is authoritative on these stops.</td></tr>\n    <tr><td>Acceptance Criteria</td><td><ul><li><strong>Lane / Corridor Centerline Tracking:</strong> During execution of a representative planned path through a lane or corridor, measured lateral offset from the active centerline stays within the configured tolerance; excursions trigger lane-deviation reporting (per req-lane-deviation-detection).</li><li><strong>Environment-Rule Speed Conformance:</strong> For a representative planned path crossing map elements with differing speed limits, the commanded-speed value emitted by PRAK never exceeds the active element&apos;s encoded maximum, and PRAK publishes a speed-envelope-change notification at each map-element boundary within the configured response time.</li><li><strong>Control-Point Stop:</strong> For each control-point type flagged &ldquo;stop&rdquo;, simulation verifies that the robot decelerates and stops with the configured stop tolerance before the point, and proceeds only when the stop is released.</li></ul></td></tr>\n    <tr><td>PRD Coverage</td><td>UC: UC-02; Release: R1.1; Goal: VG-03</td></tr>\n  </tbody>\n</table>\n","path":"product/requirements/functional/req-fr-10.md","refs_out":[{"field":"parent-use-cases","filename":"uc-follow-path.md","title":"Follow a Structured Path from Command and Control","kind":"use-cases"}],"refs_in":[{"field":"parent-product-requirement","filename":"sysreq-structured-map-conformance.md","title":"Conform to Structured-Map Rules During Execution","kind":"system-requirements"}]},{"id":"req-fr-11","filename":"req-fr-11.md","title":"Prohibited Motion Transition Guard","bucket":"functional","kind":"product-requirements","frontmatter":{"id":"req-fr-11","prd-id":"FR-11","title":"Prohibited Motion Transition Guard","parent-use-cases":["uc-follow-path.md","uc-teleoperation.md"],"priority":"Critical"},"body":"\n<table>\n  <thead>\n    <tr><th>Field</th><th>Description</th></tr>\n  </thead>\n  <tbody>\n    <tr><td>ID</td><td>req-fr-11</td></tr>\n    <tr><td>PRD ID</td><td>FR-11</td></tr>\n    <tr><td>Parent Use Cases</td><td>uc-follow-path.md, uc-teleoperation.md</td></tr>\n    <tr><td>Priority</td><td>Critical</td></tr>\n    <tr><td>Requirement Statement</td><td>While performing motion, PRAK shall prevent prohibited motion transitions (for example, reversing without first coming to a controlled (Cat2) stop) regardless of command source.</td></tr>\n    <tr><td>Rationale</td><td>Path validation rejects paths containing prohibited transitions, but execution-time guarding is still required: framework dynamics, recovery behaviors, operator overrides, and tele-op inputs can all otherwise cause PRAK to emit a command sequence that would result in a prohibited transition. PRAK cannot itself enforce physical motion &mdash; that happens in the integrated robot &mdash; but it can guarantee that the commands it emits to the actuation boundary never request a prohibited transition. This guard applies uniformly across command sources.</td></tr>\n    <tr><td>Acceptance Criteria</td><td>For each prohibited transition class (initially: reversing without prior controlled-stop emission), simulation verifies that PRAK does not emit the prohibited actuation command and publishes a refusal-notification message identifying the transition class.</td></tr>\n    <tr><td>PRD Coverage</td><td>UC: UC-02, UC-04; Release: R1.0; Goal: VG-06</td></tr>\n  </tbody>\n</table>\n","path":"product/requirements/functional/req-fr-11.md","refs_out":[{"field":"parent-use-cases","filename":"uc-follow-path.md","title":"Follow a Structured Path from Command and Control","kind":"use-cases"},{"field":"parent-use-cases","filename":"uc-teleoperation.md","title":"Tele-operate Robot via Manual Control Inputs","kind":"use-cases"}],"refs_in":[{"field":"parent-product-requirement","filename":"sysreq-prohibited-transition-guard.md","title":"Guard Against Prohibited Motion Transitions","kind":"system-requirements"}]},{"id":"req-fr-12","filename":"req-fr-12.md","title":"Detect and Report Deviations, Violations, and Motion-Auth Loss","bucket":"functional","kind":"product-requirements","frontmatter":{"id":"req-fr-12","prd-id":"FR-12","title":"Detect and Report Deviations, Violations, and Motion-Auth Loss","parent-use-cases":["uc-follow-path.md"],"priority":"Critical"},"body":"\n<table>\n  <thead>\n    <tr><th>Field</th><th>Description</th></tr>\n  </thead>\n  <tbody>\n    <tr><td>ID</td><td>req-fr-12</td></tr>\n    <tr><td>PRD ID</td><td>FR-12</td></tr>\n    <tr><td>Parent Use Cases</td><td>uc-follow-path.md</td></tr>\n    <tr><td>Priority</td><td>Critical</td></tr>\n    <tr><td>Requirement Statement</td><td>While executing a supplied path, PRAK shall detect lateral deviation from the lane centerline, rule violations (lane direction, speed limit, prohibited transition, control point), blocked or invalid routes, and motion-authorization condition loss, and shall report each event to C2.</td></tr>\n    <tr><td>Rationale</td><td><strong>Lane Deviation Detection:</strong> Centerline tracking sets the control objective; deviation detection is the monitoring counterpart that surfaces when tracking has failed. Reporting the event &mdash; separately from triggering execution-failure handling &mdash; gives C2 the signal needed to assess controller health and trend lateral performance over a mission.<br><strong>Rule Violation Detection:</strong> Validation gates rule-compliant paths at acceptance; runtime detection covers the cases where execution dynamics, overrides, or environmental change produce a violation against an otherwise validated path. Reporting the violation gives C2 the trigger for supervisory intervention and supports post-mission compliance audit.<br><strong>Motion-Authorization Loss During Path Execution:</strong> Motion-authorization is a continuous precondition for motion, not a one-shot gate. Sensors fault, geofence updates, E-Stop latches, stop capability degrades &mdash; any of these can invalidate the authorization mid-mission. The robot must not continue executing a C2-supplied path under conditions the gate would no longer accept. Reporting the loss to C2 gives the operator the diagnostic context needed to decide on recovery. Mirrors `req-teleop-motion-authorization-loss` for the navigation use cases. Distinct from `req-path-execution-failure` because the failing cause is a system-state authorization condition rather than a path-execution-specific runtime condition (fault, obstacle, deviation, blocked route).</td></tr>\n    <tr><td>Acceptance Criteria</td><td><ul><li><strong>Lane Deviation Detection:</strong> Simulated lateral excursions beyond the configured threshold produce a deviation event consumable by C2; the event includes the magnitude, the active map element, and the timestamp.</li><li><strong>Rule Violation Detection:</strong> For each rule class (lane direction, speed limit, prohibited transition, control point), a simulated violation produces a violation event consumable by C2; the event identifies the rule class, the active map element, and the timestamp.</li><li><strong>Motion-Authorization Loss During Path Execution:</strong> For each motion-authorization condition class (Safe-to-Move, Motion-Permitted, Stop-Capable), simulation of the condition becoming false during path execution produces (a) transition to a safe or stopped state within the configured detection latency and (b) a motion-authorization-loss notification consumable by C2 identifying the failing condition class.</li></ul></td></tr>\n    <tr><td>PRD Coverage</td><td>UC: UC-02; Release: R1.0 -> R1.1; Goal: VG-03, VG-06</td></tr>\n  </tbody>\n</table>\n","path":"product/requirements/functional/req-fr-12.md","refs_out":[{"field":"parent-use-cases","filename":"uc-follow-path.md","title":"Follow a Structured Path from Command and Control","kind":"use-cases"}],"refs_in":[{"field":"parent-product-requirement","filename":"sysreq-detect-path-deviations-violations.md","title":"Detect Path Deviations and Rule Violations","kind":"system-requirements"},{"field":"parent-product-requirement","filename":"sysreq-report-execution-events-to-c2.md","title":"Report Path-Execution Events to C2","kind":"system-requirements"}]},{"id":"req-fr-13","filename":"req-fr-13.md","title":"Publish Path-Execution Telemetry and Completion","bucket":"functional","kind":"prod

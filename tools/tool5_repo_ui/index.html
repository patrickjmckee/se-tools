uct-requirements","frontmatter":{"id":"req-fr-13","prd-id":"FR-13","title":"Publish Path-Execution Telemetry and Completion","parent-use-cases":["uc-follow-path.md"],"priority":"High"},"body":"\n<table>\n  <thead>\n    <tr><th>Field</th><th>Description</th></tr>\n  </thead>\n  <tbody>\n    <tr><td>ID</td><td>req-fr-13</td></tr>\n    <tr><td>PRD ID</td><td>FR-13</td></tr>\n    <tr><td>Parent Use Cases</td><td>uc-follow-path.md</td></tr>\n    <tr><td>Priority</td><td>High</td></tr>\n    <tr><td>Requirement Statement</td><td>While executing a supplied path, PRAK shall publish path-execution telemetry (current pose, path progress, cross-track deviation) to C2 at the configured cadence and shall publish a path-completion notification when the endpoint is reached within tolerance.</td></tr>\n    <tr><td>Rationale</td><td><strong>Path Execution Telemetry:</strong> Provides continuous insight into the robot's path execution state. Without telemetry during traversal, external systems cannot monitor progress, detect stalls, or correlate the robot's state with operator awareness.<br><strong>Path Completion Notification:</strong> Signals the end of the path-following task to external systems. Without an explicit completion notification, an external system cannot know when the robot has finished traversing the path and is ready for the next command.</td></tr>\n    <tr><td>Acceptance Criteria</td><td><ul><li><strong>Path Execution Telemetry:</strong> Path telemetry is available and consumable</li><li><strong>Path Completion Notification:</strong> Completion message is published and consumable</li></ul></td></tr>\n    <tr><td>PRD Coverage</td><td>UC: UC-02; Release: R1.0; Goal: VG-02, VG-05</td></tr>\n  </tbody>\n</table>\n","path":"product/requirements/functional/req-fr-13.md","refs_out":[{"field":"parent-use-cases","filename":"uc-follow-path.md","title":"Follow a Structured Path from Command and Control","kind":"use-cases"}],"refs_in":[{"field":"parent-product-requirement","filename":"sysreq-publish-path-execution-telemetry.md","title":"Publish Path-Execution Telemetry and Completion","kind":"system-requirements"}]},{"id":"req-fr-14","filename":"req-fr-14.md","title":"Stop and Diagnose on Execution Failure","bucket":"functional","kind":"product-requirements","frontmatter":{"id":"req-fr-14","prd-id":"FR-14","title":"Stop and Diagnose on Execution Failure","parent-use-cases":["uc-follow-path.md"],"priority":"Critical"},"body":"\n<table>\n  <thead>\n    <tr><th>Field</th><th>Description</th></tr>\n  </thead>\n  <tbody>\n    <tr><td>ID</td><td>req-fr-14</td></tr>\n    <tr><td>PRD ID</td><td>FR-14</td></tr>\n    <tr><td>Parent Use Cases</td><td>uc-follow-path.md</td></tr>\n    <tr><td>Priority</td><td>Critical</td></tr>\n    <tr><td>Requirement Statement</td><td>If a fault, obstacle, excessive path deviation, blocked-or-invalid-route condition, or motion-authorization condition loss occurs during path execution, PRAK shall issue a Cat2 stop command (escalating to a Cat0 stop per the stop-category escalation rule) and send diagnostic information to C2.</td></tr>\n    <tr><td>Rationale</td><td>See parent use case for behavioral context.</td></tr>\n    <tr><td>Acceptance Criteria</td><td>TBD &mdash; acceptance criteria to be authored against parent use case.</td></tr>\n    <tr><td>PRD Coverage</td><td>UC: UC-02; Release: R1.0; Goal: VG-02, VG-06</td></tr>\n  </tbody>\n</table>\n","path":"product/requirements/functional/req-fr-14.md","refs_out":[{"field":"parent-use-cases","filename":"uc-follow-path.md","title":"Follow a Structured Path from Command and Control","kind":"use-cases"}],"refs_in":[{"field":"parent-product-requirement","filename":"sysreq-stop-on-execution-fault.md","title":"Stop on Execution Fault or Obstacle","kind":"system-requirements"}]},{"id":"req-fr-17","filename":"req-fr-17.md","title":"Tele-op Session Initiation Validation","bucket":"functional","kind":"product-requirements","frontmatter":{"id":"req-fr-17","prd-id":"FR-17","title":"Tele-op Session Initiation Validation","parent-use-cases":["uc-teleoperation.md"],"priority":"High"},"body":"\n<table>\n  <thead>\n    <tr><th>Field</th><th>Description</th></tr>\n  </thead>\n  <tbody>\n    <tr><td>ID</td><td>req-fr-17</td></tr>\n    <tr><td>PRD ID</td><td>FR-17</td></tr>\n    <tr><td>Parent Use Cases</td><td>uc-teleoperation.md</td></tr>\n    <tr><td>Priority</td><td>High</td></tr>\n    <tr><td>Requirement Statement</td><td>On tele-op session initiation, PRAK shall validate the negotiated tele-op ICD (base inputs and robot-specific extensions) and accept the session only when the ICD is valid and motion-authorization preconditions are satisfied.</td></tr>\n    <tr><td>Rationale</td><td>The tele-op ICD is composed of a base set defined by PRAK and robot-specific extensions defined by the Robot Mechatronics Dev Team. Accepting a session with an invalid or inconsistent ICD risks runtime ambiguity over what each input means, including safety-critical inputs. Gate the session at negotiation time rather than discovering the inconsistency mid-session.</td></tr>\n    <tr><td>Acceptance Criteria</td><td>For each ICD-validity case (valid base + valid extensions; valid base + missing/conflicting extensions; invalid base), session initiation produces accept-or-reject consistent with the validity outcome and an informative diagnostic when rejected.</td></tr>\n    <tr><td>PRD Coverage</td><td>UC: UC-04; Release: R2.0; Goal: VG-01, VG-07</td></tr>\n  </tbody>\n</table>\n","path":"product/requirements/functional/req-fr-17.md","refs_out":[{"field":"parent-use-cases","filename":"uc-teleoperation.md","title":"Tele-operate Robot via Manual Control Inputs","kind":"use-cases"}],"refs_in":[{"field":"parent-product-requirement","filename":"sysreq-gate-teleop-session-on-motion-auth.md","title":"Gate Tele-op Session on Motion Authorization","kind":"system-requirements"},{"field":"parent-product-requirement","filename":"sysreq-validate-teleop-icd-at-session-init.md","title":"Validate Tele-op ICD at Session Initiation","kind":"system-requirements"}]},{"id":"req-fr-18","filename":"req-fr-18.md","title":"Tele-op Input Validation, Rejection, and Staleness Handling","bucket":"functional","kind":"product-requirements","frontmatter":{"id":"req-fr-18","prd-id":"FR-18","title":"Tele-op Input Validation, Rejection, and Staleness Handling","parent-use-cases":["uc-teleoperation.md"],"priority":"High"},"body":"\n<table>\n  <thead>\n    <tr><th>Field</th><th>Description</th></tr>\n  </thead>\n  <tbody>\n    <tr><td>ID</td><td>req-fr-18</td></tr>\n    <tr><td>PRD ID</td><td>FR-18</td></tr>\n    <tr><td>Parent Use Cases</td><td>uc-teleoperation.md</td></tr>\n    <tr><td>Priority</td><td>High</td></tr>\n    <tr><td>Requirement Statement</td><td>When a tele-op input is received, PRAK shall validate it against the active ICD before any actuation; inputs that violate the ICD shall be rejected with diagnostic reason, and PRAK shall continue on the last valid command set until the configured input-staleness timeout before transitioning to safe state.</td></tr>\n    <tr><td>Rationale</td><td><strong>Tele-op Input Validation:</strong> Per-input validation is the runtime counterpart of `req-teleop-icd-validation`. An input that does not conform to the active ICD must not be translated to actuation, even if the session was validly initiated &mdash; transient corruption, version drift, or out-of-band inputs can all produce non-conformant frames within an otherwise-valid session.<br><strong>Tele-op Input Rejection and Staleness:</strong> Continuing on the last valid input briefly is preferable to an abrupt safety transition for transient corruption (single dropped frame, intermittent jitter). But unbounded continuation on stale inputs creates a runaway risk if the tele-op stream genuinely stops. The staleness timeout bounds the &ldquo;last valid&rdquo; window so the robot fails safe when inputs are no longer trustworthy.</td></tr>\n    <tr><td>Acceptance Criteria</td><td><ul><li><strong>Tele-op Input Validation:</strong> For each input class defined in the ICD, valid inputs are accepted for actuation; inputs that violate the ICD trigger `req-teleop-input-rejection` handling.</li><li><strong>Tele-op Input Rejection and Staleness:</strong> A single rejected input does not interrupt motion if a valid input follows within the staleness timeout; sustained rejection beyond the timeout transitions the robot to a safe state and reports the transition to the tele-op controller.</li></ul></td></tr>\n    <tr><td>PRD Coverage</td><td>UC: UC-04; Release: R2.0; Goal: VG-06</td></tr>\n  </tbody>\n</table>\n","path":"product/requirements/functional/req-fr-18.md","refs_out":[{"field":"parent-use-cases","filename":"uc-teleoperation.md","title":"Tele-operate Robot via Manual Control Inputs","kind":"use-cases"}],"refs_in":[{"field":"parent-product-requirement","filename":"sysreq-teleop-input-staleness-timeout.md","title":"Tele-op Input Staleness Timeout","kind":"system-requirements"},{"field":"parent-product-requirement","filename":"sysreq-validate-teleop-input-against-icd.md","title":"Validate Tele-op Input Against Active ICD","kind":"system-requirements"}]},{"id":"req-fr-19","filename":"req-fr-19.md","title":"Tele-op Direct Actuation Translation","bucket":"functional","kind":"product-requirements","frontmatter":{"id":"req-fr-19","prd-id":"FR-19","title":"Tele-op Direct Actuation Translation","parent-use-cases":["uc-teleoperation.md"],"priority":"High"},"body":"\n<table>\n  <thead>\n    <tr><th>Field</th><th>Description</th></tr>\n  </thead>\n  <tbody>\n    <tr><td>ID</td><td>req-fr-19</td></tr>\n    <tr><td>PRD ID</td><td>FR-19</td></tr>\n    <tr><td>Parent Use Cases</td><td>uc-teleoperation.md</td></tr>\n    <tr><td>Priority</td><td>High</td></tr>\n    <tr><td>Requirement Statement</td><td>When a tele-op input passes validation, PRAK shall translate it directly to actuation without following a path and apply translation within the configured tele-op control-loop latency.</td></tr>\n    <tr><td>Rationale</td><td>The defining architectural property of tele-op is that the operator is the planner: inputs are real-time motion commands, not goals or paths. Translating them via the planner would add latency and introduce ambiguity over whose plan governs the next motion segment. Direct translation preserves the operator's authority and the real-time control loop the ICD assumes.</td></tr>\n    <tr><td>Acceptance Criteria</td><td>For each valid tele-op input class (speed, direction, robot-specific commands), the corresponding actuation command is produced within the configured tele-op control-loop latency, with no intermediate path-planning step in the data flow.</td></tr>\n    <tr><td>PRD Coverage</td><td>UC: UC-04; Release: R2.0; Goal: VG-02</td></tr>\n  </tbody>\n</table>\n","path":"product/requirements/functional/req-fr-19.md","refs_out":[{"field":"parent-use-cases","filename":"uc-teleoperation.md","title":"Tele-operate Robot via Manual Control Inputs","kind":"use-cases"}],"refs_in":[{"field":"parent-product-requirement","filename":"sysreq-translate-teleop-input-to-actuation.md","title":"Translate Tele-op Input to Actuation","kind":"system-requirements"}]},{"id":"req-fr-20","filename":"req-fr-20.md","title":"Tele-op Motion-Limit Conformance","bucket":"functional","kind":"product-requirements","frontmatter":{"id":"req-fr-20","prd-id":"FR-20","title":"Tele-op Motion-Limit Conformance","parent-use-cases":["uc-teleoperation.md"],"priority":"Critical"},"body":"\n<table>\n  <thead>\n    <tr><th>Field</th><th>Description</th></tr>\n  </thead>\n  <tbody>\n    <tr><td>ID</td><td>req-fr-20</td></tr>\n    <tr><td>PRD ID</td><td>FR-20</td></tr>\n    <tr><td>Parent Use Cases</td><td>uc-teleoperation.md</td></tr>\n    <tr><td>Priority</td><td>Critical</td></tr>\n    <tr><td>Requirement Statement</td><td>While executing tele-op inputs, PRAK shall produce actuation commands that conform to configured kinematic, velocity, and safety constraints, and shall constrain framework-emitted actuation to the configured geofence when geofence enforcement is enabled for the active tele-op session; if a tele-op input would violate any active constraint, PRAK shall emit a clamped actuation command that respects the constraint and publish an override-notification message to the Tele-op Controller identifying the violated constraint class.</td></tr>\n    <tr><td>Rationale</td><td>The tele-op operator may issue commands that exceed safe operating bounds either by accident or because the operator does not have full situational awareness. PRAK, as a framework, cannot itself enforce physical motion at the actuation boundary &mdash; that enforcement happens in the integrated robot &mdash; but it must ensure that the actuation commands it emits and the override notifications it publishes are correct, so the integrated robot is given the right information to act on and the operator can adjust their mental model and inputs accordingly. Geofence enforcement is opt-in for tele-op sessions because some operational scenarios (recovery, maintenance moves, off-geofence positioning) require operating outside the configured geofence under operator authority.</td></tr>\n    <tr><td>Acceptance Criteria</td><td>For each always-active constraint class (kinematic, velocity, safety), simulation of a tele-op input that would violate the constraint shows that PRAK emits a clamped actuation command respecting the constraint and publishes an override-notification message identifying the violated constraint class. For geofence: when geofence enforcement is enabled, the same emit-and-notify behavior applies; when disabled, no geofence override is emitted.</td></tr>\n    <tr><td>PRD Coverage</td><td>UC: UC-04; Release: R2.0; Goal: VG-06</td></tr>\n  </tbody>\n</table>\n","path":"product/requirements/functional/req-fr-20.md","refs_out":[{"field":"parent-use-cases","filename":"uc-teleoperation.md","title":"Tele-operate Robot via Manual Control Inputs","kind":"use-cases"}],"refs_in":[{"field":"parent-product-requirement","filename":"sysreq-publish-teleop-override-notification.md","title":"Publish Tele-op Override Notification","kind":"system-requirements"},{"field":"parent-product-requirement","filename":"sysreq-teleop-motion-limit-conformance.md","title":"Tele-op Motion-Limit and Geofence Conformance","kind":"system-requirements"}]},{"id":"req-fr-21","filename":"req-fr-21.md","title":"Tele-op Situational-Awareness Feedback","bucket":"functional","kind":"product-requirements","frontmatter":{"id":"req-fr-21","prd-id":"FR-21","title":"Tele-op Situational-Awareness Feedback","parent-use-cases":["uc-teleoperation.md"],"priority":"High"},"body":"\n<table>\n  <thead>\n    <tr><th>Field</th><th>Description</th></tr>\n  </thead>\n  <tbody>\n    <tr><td>ID</td><td>req-fr-21</td></tr>\n    <tr><td>PRD ID</td><td>FR-21</td></tr>\n    <tr><td>Parent Use Cases</td><td>uc-teleoperation.md</td></tr>\n    <tr><td>Priority</td><td>High</td></tr>\n    <tr><td>Requirement Statement</td><td>While in a tele-op session, PRAK shall publish situational-awareness feedback (pose, velocity, implement status, and any robot-specific feedback channels defined in the ICD extension) to the Tele-op Controller at the configured cadence.</td></tr>\n    <tr><td>Rationale</td><td>Tele-op requires the operator to close the control loop in real time. Without continuous feedback the operator is flying blind &mdash; particularly in scenarios where the robot has overridden an input (per `req-teleop-motion-limit-conformance`) and the operator's mental model of robot state has drifted from reality. The robot-specific feedback channels are owned by the Robot Mechatronics Dev Team via the ICD extension; PRAK requires that the publishing channel exists and meets the cadence.</td></tr>\n    <tr><td>Acceptance Criteria</td><td>For each feedback channel defined in the active ICD (base + extension), feedback frames are published to the tele-op controller at or above the configured cadence; missed frames trigger ICD-defined staleness handling at the consumer.</td></tr>\n    <tr><td>PRD Coverage</td><td>UC: UC-04; Release: R2.0; Goal: VG-05</td></tr>\n  </tbody>\n</table>\n","path":"product/requirements/functional/req-fr-21.md","refs_out":[{"field":"parent-use-cases","filename":"uc-teleoperation.md","title":"Tele-operate Robot via Manual Control Inputs","kind":"use-cases"}],"refs_in":[{"field":"parent-product-requirement","filename":"sysreq-provide-teleop-pose-velocity-feedback.md","title":"Provide Tele-op Pose and Velocity Feedback","kind":"system-requirements"},{"field":"parent-product-requirement","filename":"sysreq-publish-teleop-situational-feedback.md","title":"Publish Tele-op Situational-Awareness Feedback","kind":"system-requirements"}]},{"id":"req-fr-22","filename":"req-fr-22.md","title":"Tele-op Link Loss and Motion-Auth Loss","bucket":"functional","kind":"product-requirements","frontmatter":{"id":"req-fr-22","prd-id":"FR-22","title":"Tele-op Link Loss and Motion-Auth Loss","parent-use-cases":["uc-teleoperation.md"],"priority":"Critical"},"body":"\n<table>\n  <thead>\n    <tr><th>Field</th><th>Description</th></tr>\n  </thead>\n  <tbody>\n    <tr><td>ID</td><td>req-fr-22</td></tr>\n    <tr><td>PRD ID</td><td>FR-22</td></tr>\n    <tr><td>Parent Use Cases</td><td>uc-teleoperation.md</td></tr>\n    <tr><td>Priority</td><td>Critical</td></tr>\n    <tr><td>Requirement Statement</td><td>When the tele-op messaging link is lost, PRAK shall transition to the polymorphous-defined connection-loss safe behavior until the link is restored. If motion-authorization conditions are lost during a tele-op session, PRAK shall transition to a safe or stopped state and report the loss to the Tele-op Controller.</td></tr>\n    <tr><td>Rationale</td><td><strong>Tele-op Link-Loss Safe Behavior:</strong> The tele-op link is the only channel for operator command in this use case. Loss of that link means no commands can arrive &mdash; the robot must fail safe rather than continue on stale or absent inputs. The safe-behavior definition lives in polymorphous; PRAK requires entry into that behavior on link loss. Distinct from `req-c2-link-loss` because the tele-op link is a separate channel with its own ICD.<br><strong>Tele-op Motion-Authorization Loss Handling:</strong> Motion-authorization is a continuous precondition for motion, not a one-shot gate. Sensors fault, geofence updates, E-Stop latches, stop capability degrades &mdash; any of these can invalidate the authorization mid-session. The tele-op operator must not be able to continue commanding motion under conditions the gate would no longer accept. Reporting the loss to the tele-op controller gives the operator the diagnostic context to know why the robot stopped responding to inputs. Establishes the in-motion-revalidation pattern that the navigation UCs will mirror once that gap is addressed.</td></tr>\n    <tr><td>Acceptance Criteria</td><td><ul><li><strong>Tele-op Link-Loss Safe Behavior:</strong> Simulated tele-op link loss mid-session causes the robot to enter the polymorphous-defined connection-loss safe state within the configured detection latency; reconnection restores command acceptance.</li><li><strong>Tele-op Motion-Authorization Loss Handling:</strong> For each motion-authorization condition class, simulation of the condition becoming false during a tele-op session produces (a) transition to a safe or stopped state within the configured detection latency and (b) a motion-authorization-loss notification consumable by the tele-op controller identifying the failing condition.</li></ul></td></tr>\n    <tr><td>PRD Coverage</td><td>UC: UC-04; Release: R2.0; Goal: VG-06</td></tr>\n  </tbody>\n</table>\n","path":"product/requirements/functional/req-fr-22.md","refs_out":[{"field":"parent-use-cases","filename":"uc-teleoperation.md","title":"Tele-operate Robot via Manual Control Inputs","kind":"use-cases"}],"refs_in":[{"field":"parent-product-requirement","filename":"sysreq-detect-teleop-link-loss-and-report.md","title":"Detect and Report Tele-op Link / Motion-Auth Loss","kind":"system-requirements"},{"field":"parent-product-requirement","filename":"sysreq-teleop-connection-loss-safe-behavior.md","title":"Tele-op Connection-Loss Safe Behavior","kind":"system-requirements"},{"field":"parent-product-requirement","filename":"sysreq-teleop-network-timeout-estop.md","title":"Tele-op Network-Timeout Emergency Stop","kind":"system-requirements"}]},{"id":"req-fr-23","filename":"req-fr-23.md","title":"Path-to-Actuation Framework Distribution Forms","bucket":"functional","kind":"product-requirements","frontmatter":{"id":"req-fr-23","prd-id":"FR-23","title":"Path-to-Actuation Framework Distribution Forms","parent-use-cases":["uc-path-to-actuation-framework.md"],"priority":"High"},"body":"\n<table>\n  <thead>\n    <tr><th>Field</th><th>Description</th></tr>\n  </thead>\n  <tbody>\n    <tr><td>ID</td><td>req-fr-23</td></tr>\n    <tr><td>PRD ID</td><td>FR-23</td></tr>\n    <tr><td>Parent Use Cases</td><td>uc-path-to-actuation-framework.md</td></tr>\n    <tr><td>Priority</td><td>High</td></tr>\n    <tr><td>Requirement Statement</td><td>PRAK shall publish the path-to-actuation framework in source, library, and buildable-application forms, with stable versioned HW interface contracts (BSP, wiring harnesses, mechanical mounting, sensor/actuator interfaces) and SW build dependencies (including the polymorphous software path-following module).</td></tr>\n    <tr><td>Rationale</td><td><strong>Framework Distribution Forms:</strong> Dev teams differ in their build environments and the depth of integration they need. Source enables deep customization, libraries support clean linking against existing build systems, and buildable applications provide a reference integration point. Forcing a single form would block adoption for teams whose tooling doesn't match.<br><strong>HW Interface Contract Publication:</strong> Without a stable HW interface contract, dev teams cannot reliably integrate the framework &mdash; every PRAK release would force re-integration. Versioning the contract gives the dev team a predictable upgrade surface and a basis for the HW-reference-deviation conversation called out in the use case alt flows.</td></tr>\n    <tr><td>Acceptance Criteria</td><td><ul><li><strong>Framework Distribution Forms:</strong> The framework is available from the PRAK distribution in all three forms; each form is independently buildable and consumable in a reference dev-environment that matches the documented configuration.</li><li><strong>HW Interface Contract Publication:</strong> Each HW interface contract artifact (BSP, wiring, mounting, sensor/actuator) is present in the PRAK distribution, carries a version identifier, and matches the version the bundled framework integrates against.</li></ul></td></tr>\n    <tr><td>PRD Coverage</td><td>UC: UC-05; Release: R1.0; Goal: PG-02</td></tr>\n  </tbody>\n</table>\n","path":"product/requirements/functional/req-fr-23.md","refs_out":[{"field":"parent-use-cases","filename":"uc-path-to-actuation-framework.md","title":"Path-to-Actuation Framework","kind":"use-cases"}],"refs_in":[{"field":"parent-product-requirement","filename":"sysreq-publish-framework-distribution-forms.md","title":"Publish Framework Distribution Forms and Interface Contracts","kind":"system-requirements"},{"field":"parent-product-requirement","filename":"arch-subsystem-component.md","title":"PRAK Subsystem Component Architecture","kind":"architecture-diagrams"}]},{"id":"req-fr-24","filename":"req-fr-24.md","title":"Configurable Kinematic Model and Actuator / Sensor Interfaces","bucket":"functional","kind":"product-requirements","frontmatter":{"id":"req-fr-24","prd-id":"FR-24","title":"Configurable Kinematic Model and Actuator / Sensor Interfaces","parent-use-cases":["uc-path-to-actuation-framework.md"],"priority":"High"},"body":"\n<table>\n  <thead>\n    <tr><th>Field</th><th>Description</th></tr>\n  </thead>\n  <tbody>\n    <tr><td>ID</td><td>req-fr-24</td></tr>\n    <tr><td>PRD ID</td><td>FR-24</td></tr>\n    <tr><td>Parent Use Cases</td><td>uc-path-to-actuation-framework.md</td></tr>\n    <tr><td>Priority</td><td>High</td></tr>\n    <tr><td>Requirement Statement</td><td>The path-to-actuation framework shall expose a configurable kinematic model and configurable actuator/sensor interfaces (conformant to the PRAK-published HW interface contracts) that accept robot-specific parameters without requiring modification to framework source code.</td></tr>\n    <tr><td>Rationale</td><td><strong>Kinematic Model Configuration:</strong> The dev team integrates PRAK with diverse robot configurations &mdash; differential, Ackermann, articulated, tracked, and beyond. If kinematic parameters live inside framework source, every dev team becomes a PRAK forker; configuration-driven kinematics keeps the dev team on the PRAK update path while still letting them ship robot-specific motion behavior.<br><strong>Actuator and Sensor Interface Configuration:</strong> The framework cannot know in advance which actuators (drive motor, steering motor, implement controllers) or sensors (GNSS, IMU, perception sensors) a given robot uses. By exposing configuration points that bind to the PRAK-published HW interface contracts, the framework lets the dev team wire their specific hardware in without re-implementing the conversion pipeline.</td></tr>\n    <tr><td>Acceptance Criteria</td><td><ul><li><strong>Kinematic Model Configuration:</strong> For each representative kinematic class (differential, Ackermann), a configuration set is loaded without modifying framework source and the resulting actuation matches the configured kinematic model under representative path commands.</li><li><strong>Actuator and Sensor Interface Configuration:</strong> For each actuator class and sensor class defined in the HW interface contract, the framework loads a configuration that binds to that class and produces actuation outputs and consumes sensor inputs through the configured binding under a representative path command.</li></ul></td></tr>\n    <tr><td>PRD Coverage</td><td>UC: UC-05; Release: R1.0; Goal: PG-02</td></tr>\n  </tbody>\n</table>\n","path":"product/requirements/functional/req-fr-24.md","refs_out":[{"field":"parent-use-cases","filename":"uc-path-to-actuation-framework.md","title":"Path-to-Actuation Framework","kind":"use-cases"}],"refs_in":[{"field":"parent-product-requirement","filename":"sysreq-configurable-kinematic-and-io-interfaces.md","title":"Configurable Kinematic Model and Actuator/Sensor Interfaces","kind":"system-requirements"}]},{"id":"req-fr-25","filename":"req-fr-25.md","title":"Documented Extension Points","bucket":"functional","kind":"product-requirements","frontmatter":{"id":"req-fr-25","prd-id":"FR-25","title":"Documented Extension Points","parent-use-cases":["uc-path-to-actuation-framework.md"],"priority":"High"},"body":"\n<table>\n  <thead>\n    <tr><th>Field</th><th>Description</th></tr>\n  </thead>\n  <tbody>\n    <tr><td>ID</td><td>req-fr-25</td></tr>\n    <tr><td>PRD ID</td><td>FR-25</td></tr>\n    <tr><td>Parent Use Cases</td><td>uc-path-to-actuation-framework.md</td></tr>\n    <tr><td>Priority</td><td>High</td></tr>\n    <tr><td>Requirement Statement</td><td>The path-to-actuation framework shall define stable, documented extension points where robot-specific actuation logic can be added without modifying framework source code.</td></tr>\n    <tr><td>Rationale</td><td>Robots that need behavior beyond configuration (unusual implements, custom drive modes, robot-specific safety interlocks) must have a sanctioned place to put that code. Extension points keep the dev team's customizations isolated from PRAK source, so PRAK updates don't force the dev team to re-merge their robot-specific code.</td></tr>\n    <tr><td>Acceptance Criteria</td><td>The framework documents each extension point with its contract (inputs, outputs, lifecycle); a reference robot-specific extension is added at each extension point in a dev-team-owned repository and integrates without modification to framework source.</td></tr>\n    <tr><td>PRD Coverage</td><td>UC: UC-05; Release: R1.0; Goal: PG-02</td></tr>\n  </tbody>\n</table>\n","path":"product/requirements/functional/req-fr-25.md","refs_out":[{"field":"parent-use-cases","filename":"uc-path-to-actuation-framework.md","title":"Path-to-Actuation Framework","kind":"use-cases"}],"refs_in":[{"field":"parent-product-requirement","filename":"sysreq-documented-extension-points.md","title":"Documented Framework Extension Points","kind":"system-requirements"}]},{"id":"req-fr-26","filename":"req-fr-26.md","title":"Framework Verification Support","bucket":"functional","kind":"product-requirements","frontmatter":{"id":"req-fr-26","prd-id":"FR-26","title":"Framework Verification Support","parent-use-cases":["uc-path-to-actuation-framework.md"],"priority":"High"},"body":"\n<table>\n  <thead>\n    <tr><th>Field</th><th>Description</th></tr>\n  </thead>\n  <tbody>\n    <tr><td>ID</td><td>req-fr-26</td></tr>\n    <tr><td>PRD ID</td><td>FR-26</td></tr>\n    <tr><td>Parent Use Cases</td><td>uc-path-to-actuation-framework.md</td></tr>\n    <tr><td>Priority</td><td>High</td></tr>\n    <tr><td>Requirement Statement</td><td>PRAK shall provide representative path commands and an actuation-observation interface sufficient to verify the configured conversion pipeline end-to-end against the configured kinematic and actuator behavior.</td></tr>\n    <tr><td>Rationale</td><td>The dev team needs a way to confirm that their kinematic and actuator configuration produces the actuation they expect &mdash; before deploying to physical hardware where errors are expensive. PRAK supplying both the test stimulus (representative path commands) and the observation point (actuation outputs) makes the verification step in the use case actually executable.</td></tr>\n    <tr><td>Acceptance Criteria</td><td>Representative path commands covering structured and free-space segments are available from the PRAK distribution; the actuation-observation interface produces a time-aligned trace of commanded actuation values that the dev team can compare against expected configured behavior.</td></tr>\n    <tr><td>PRD Coverage</td><td>UC: UC-05; Release: R1.0; Goal: PG-02</td></tr>\n  </tbody>\n</table>\n","path":"product/requirements/functional/req-fr-26.md","refs_out":[{"field":"parent-use-cases","filename":"uc-path-to-actuation-framework.md","title":"Path-to-Actuation Framework","kind":"use-cases"}],"refs_in":[{"field":"parent-product-requirement","filename":"sysreq-framework-verification-support.md","title":"Framework Verification Support","kind":"system-requirements"}]},{"id":"req-fr-27","filename":"req-fr-27.md","title":"API Versioning, Migration Guidance, and Integration Training","bucket":"functional","kind":"product-requirements","frontmatter":{"id":"req-fr-27","prd-id":"FR-27","title":"API Versioning, Migration Guidance, and Integration Training","parent-use-cases":["uc-path-to-actuation-framework.md"],"priority":"High"},"body":"\n<table>\n  <thead>\n    <tr><th>Field</th><th>Description</th></tr>\n  </thead>\n  <tbody>\n    <tr><td>ID</td><td>req-fr-27</td></tr>\n    <tr><td>PRD ID</td><td>FR-27</td></tr>\n    <tr><td>Parent Use Cases</td><td>uc-path-to-actuation-framework.md</td></tr>\n    <tr><td>Priority</td><td>High</td></tr>\n    <tr><td>Requirement Statement</td><td>When the framework's API or ICD changes incompatibly, PRAK shall publish a new version, document the breaking changes, and publish migration guidance. PRAK shall also provide integration documentation and training covering framework configuration, extension, build integration, and verification.</td></tr>\n    <tr><td>Rationale</td><td><strong>Framework API and ICD Versioning:</strong> Dev teams ship robots on PRAK and must upgrade across PRAK versions over time. Without versioned APIs and documented breaking changes, every upgrade becomes a forensic exercise where the dev team rediscovers what changed. Explicit versioning plus migration guidance turns upgrades into bounded engineering work.<br><strong>Integration Documentation and Training:</strong> The framework is consumed by dev teams who do not have PRAK insiders on hand. Documentation and training are the substitute for that insider context. Splitting the ownership (MPT for integrated HW+SW, EPT for polymorphous-specific) keeps each team responsible for documenting the layer they own, instead of one team becoming the bottleneck for all documentation.</td></tr>\n    <tr><td>Acceptance Criteria</td><td><ul><li><strong>Framework API and ICD Versioning:</strong> Each PRAK release that introduces an incompatible API or ICD change carries a new framework version identifier, a documented changelog of breaking changes, and migration guidance covering each documented break; the prior version's API surface is preserved within the prior release.</li><li><strong>Integration Documentation and Training:</strong> Documentation exists and is published for each of: framework configuration (kinematics, actuators, sensors), extension points, build integration, and verification; training material exists and is delivered for the same topics; documentation identifies the owning team (MPT or EPT) for each section.</li></ul></td></tr>\n    <tr><td>PRD Coverage</td><td>UC: UC-05; Release: R1.0; Goal: PG-02</td></tr>\n  </tbody>\n</table>\n","path":"product/requirements/functional/req-fr-27.md","refs_out":[{"field":"parent-use-cases","filename":"uc-path-to-actuation-framework.md","title":"Path-to-Actuation Framework","kind":"use-cases"}],"refs_in":[{"field":"parent-product-requirement","filename":"sysreq-api-versioning-and-training.md","title":"API Versioning, Migration Guidance, and Integration Training","kind":"system-requirements"}]},{"id":"req-fr-28","filename":"req-fr-28.md","title":"Tele-op Line-of-Sight Operation; No Video Stream","bucket":"functional","kind":"product-requirements","frontmatter":{"id":"req-fr-28","prd-id":"FR-28","title":"Tele-op Line-of-Sight Operation; No Video Stream","parent-use-cases":["uc-teleoperation.md"],"priority":"Critical"},"body":"\n<table>\n  <thead>\n    <tr><th>Field</th><th>Description</th></tr>\n  </thead>\n  <tbody>\n    <tr><td>ID</td><td>req-fr-28</td></tr>\n    <tr><td>PRD ID</td><td>FR-28</td></tr>\n    <tr><td>Parent Use Cases</td><td>uc-teleoperation.md</td></tr>\n    <tr><td>Priority</td><td>Critical</td></tr>\n    <tr><td>Requirement Statement</td><td>PRAK shall not publish a video stream on the tele-op ICD. Tele-op is line-of-sight only. PRAK shall reject tele-op session initiation that does not include a line-of-sight acknowledgment from the operator, and shall record the acknowledgment in the safety event log for each accepted session.</td></tr>\n    <tr><td>Rationale</td><td>Line-of-sight tele-op deliberately bounds the operator&apos;s situational awareness to direct visual confirmation, avoiding the latency, framing, occlusion, and trust issues that come with video-based tele-op at the current generation&apos;s maturity. By not publishing a video channel on the tele-op ICD, PRAK forecloses the option to operate beyond line of sight via the framework itself &mdash; this is a deliberate safety scoping decision, not an oversight. The acknowledgment gate gives the framework a verifiable record that the operator was aware of and accepted the line-of-sight obligation for each session.</td></tr>\n    <tr><td>Acceptance Criteria</td><td>(a) Inspection of the tele-op ICD specification shows no video-stream channel is defined or published. (b) A tele-op session initiation request without a line-of-sight acknowledgment is rejected with a defined diagnostic reason and no session-active state is entered. (c) For each accepted session, the safety event log contains a line-of-sight acknowledgment entry with operator identity, timestamp, and session identifier, retrievable through the audit log interface.</td></tr>\n    <tr><td>PRD Coverage</td><td>UC: UC-04; Release: R2.0; Goal: PG-01, PG-05</td></tr>\n  </tbody>\n</table>\n","path":"product/requirements/functional/req-fr-28.md","refs_out":[{"field":"parent-use-cases","filename":"uc-teleoperation.md","title":"Tele-operate Robot via Manual Control Inputs","kind":"use-cases"}],"refs_in":[{"field":"parent-product-requirement","filename":"sysreq-no-video-stream-on-teleop-icd.md","title":"No Video Stream on Tele-op ICD","kind":"system-requirements"},{"field":"parent-product-requirement","filename":"sysreq-require-los-ack-at-session-init.md","title":"Require Line-of-Sight Acknowledgment at Session Init","kind":"system-requirements"}]},{"id":"req-fr-29","filename":"req-fr-29.md","title":"Obstacle Detection and Avoidance","bucket":"functional","kind":"product-requirements","frontmatter":{"id":"req-fr-29","prd-id":"FR-29","title":"Obstacle Detection and Avoidance","parent-use-cases":["uc-follow-path.md","uc-teleoperation.md"],"priority":"Critical"},"body":"\n<table>\n  <thead>\n    <tr><th>Field</th><th>Description</th></tr>\n  </thead>\n  <tbody>\n    <tr><td>ID</td><td>req-fr-29</td></tr>\n    <tr><td>PRD ID</td><td>FR-29</td></tr>\n    <tr><td>Parent Use Cases</td><td>uc-follow-path.md, uc-teleoperation.md</td></tr>\n    <tr><td>Priority</td><td>Critical</td></tr>\n    <tr><td>Requirement Statement</td><td>PRAK shall detect humans, other robots, and equipment within its sensing envelope and shall emit a stop or avoidance actuation command sequence prior to contact, regardless of whether the active control mode is C2-supplied path execution or tele-op direct actuation.</td></tr>\n    <tr><td>Rationale</td><td>Obstacles within the sensing envelope are a runtime safety condition that applies regardless of command source. PRAK, as a framework, cannot itself physically avoid contact &mdash; that happens in the integrated robot &mdash; but it must ensure that detected obstacles cause it to emit either a stop command or an avoidance command sequence before the robot would otherwise collide.</td></tr>\n    <tr><td>Acceptance Criteria</td><td>For each obstacle class (human, other robot, equipment), simulation places a representative obstacle inside the sensing envelope along the active command path; PRAK emits a stop or avoidance command before the projected contact time, and publishes an obstacle-detected event identifying the class and pose.</td></tr>\n    <tr><td>PRD Coverage</td><td>UC: ; Release: R2.0; Goal: </td></tr>\n  </tbody>\n</table>\n","path":"product/requirements/functional/req-fr-29.md","refs_out":[{"field":"parent-use-cases","filename":"uc-follow-path.md","title":"Follow a Structured Path from Command and Control","kind":"use-cases"},{"field":"parent-use-cases","filename":"uc-teleoperation.md","title":"Tele-operate Robot via Manual Control Inputs","kind":"use-cases"}],"refs_in":[{"field":"parent-product-requirement","filename":"sysreq-detect-obstacles.md","title":"Detect Obstacles Within Sensing Envelope","kind":"system-requirements"},{"field":"parent-product-requirement","filename":"sysreq-emit-obstacle-stop-avoidance.md","title":"Emit Obstacle Stop or Avoidance Actuation","kind":"system-requirements"}]},{"id":"req-fr-30","filename":"req-fr-30.md","title":"Operating-Mode and Safe-State Visible Indications","bucket":"functional","kind":"product-requirements","frontmatter":{"id":"req-fr-30","prd-id":"FR-30","title":"Operating-Mode and Safe-State Visible Indications","parent-use-cases":["uc-safe-to-move-framework.md","uc-follow-path.md","uc-teleoperation.md"],"priority":"Critical"},"body":"\n<table>\n  <thead>\n    <tr><th>Field</th><th>Description</th></tr>\n  </thead>\n  <tbody>\n    <tr><td>ID</td><td>req-fr-30</td></tr>\n    <tr><td>PRD ID</td><td>FR-30</td></tr>\n    <tr><td>Parent Use Cases</td><td>uc-safe-to-move-framework.md, uc-follow-path.md, uc-teleoperation.md</td></tr>\n    <tr><td>Priority</td><td>Critical</td></tr>\n    <tr><td>Requirement Statement</td><td>PRAK shall publish the current operating mode (auto / manual), motion state, and safe-state status on a defined indicator interface that the integrated robot exposes to nearby personnel as required by the deployment.</td></tr>\n    <tr><td>Rationale</td><td>People around the robot must be able to tell what it is doing at a glance. PRAK cannot itself drive physical indicators &mdash; that happens in the integrated robot via the indicator interface &mdash; but it must publish accurate state on the interface so the integrated robot can render it.</td></tr>\n    <tr><td>Acceptance Criteria</td><td>For each indicator state (operating mode, motion state, safe-state status), simulation verifies that PRAK publishes the correct state on the indicator interface within the configured update latency whenever the underlying state changes.</td></tr>\n    <tr><td>PRD Coverage</td><td>UC: ; Release: R2.0; Goal: </td></tr>\n  </tbody>\n</table>\n","path":"product/requirements/functional/req-fr-30.md","refs_out":[{"field":"parent-use-cases","filename":"uc-safe-to-move-framework.md","title":"Safe to Move Framework","kind":"use-cases"},{"field":"parent-use-cases","filename":"uc-follow-path.md","title":"Follow a Structured Path from Command and Control","kind":"use-cases"},{"field":"parent-use-cases","filename":"uc-teleoperation.md","title":"Tele-operate Robot via Manual Control Inputs","kind":"use-cases"}],"refs_in":[{"field":"parent-product-requirement","filename":"sysreq-publish-visible-operating-indications.md","title":"Publish Visible Operating-Mode and Safe-State Indications","kind":"system-requirements"}]},{"id":"req-fr-31","filename":"req-fr-31.md","title":"Authorized Recovery from Safe State","bucket":"functional","kind":"product-requirements","frontmatter":{"id":"req-fr-31","prd-id":"FR-31","title":"Authorized Recovery from Safe State","parent-use-cases":["uc-safe-to-move-framework.md","uc-follow-path.md","uc-teleoperation.md"],"priority":"Critical"},"body":"\n<table>\n  <thead>\n    <tr><th>Field</th><th>Description</th></tr>\n  </thead>\n  <tbody>\n    <tr><td>ID</td><td>req-fr-31</td></tr>\n    <tr><td>PRD ID</td><td>FR-31</td></tr>\n    <tr><td>Parent Use Cases</td><td>uc-safe-to-move-framework.md, uc-follow-path.md, uc-teleoperation.md</td></tr>\n    <tr><td>Priority</td><td>Critical</td></tr>\n    <tr><td>Requirement Statement</td><td>After entering a safe state, PRAK shall withhold motion commands until an authorized manual handover or operator confirmation is received from C2 or the tele-op controller; PRAK shall record the recovery acknowledgment in the safety event log.</td></tr>\n    <tr><td>Rationale</td><td>Recovery from safe state is a deliberate, audited action &mdash; never automatic. PRAK can withhold motion-command emission until the recovery acknowledgment arrives and can log the event, even though physical recovery is performed by the integrated robot.</td></tr>\n    <tr><td>Acceptance Criteria</td><td>After a safe-state transition, simulation verifies that PRAK does not emit motion commands until a recovery acknowledgment is received from an authorized actor, and the safety event log contains the recovery event with actor identity, timestamp, and prior safe-state reason.</td></tr>\n    <tr><td>PRD Coverage</td><td>UC: ; Release: R2.0; Goal: </td></tr>\n  </tbody>\n</table>\n","path":"product/requirements/functional/req-fr-31.md","refs_out":[{"field":"parent-use-cases","filename":"uc-safe-to-move-framework.md","title":"Safe to Move Framework","kind":"use-cases"},{"field":"parent-use-cases","filename":"uc-follow-path.md","title":"Follow a Structured Path from Command and Control","kind":"use-cases"},{"field":"parent-use-cases","filename":"uc-teleoperation.md","title":"Tele-operate Robot via Manual Control Inputs","kind":"use-cases"}],"refs_in":[{"field":"parent-product-requirement","filename":"sysreq-record-recovery-acknowledgment.md","title":"Record Recovery Acknowledgment","kind":"system-requirements"},{"field":"parent-product-requirement","filename":"sysreq-withhold-motion-until-recovery-authorized.md","title":"Withhold Motion Until Authorized Recovery","kind":"system-requirements"}]},{"id":"req-fr-32","filename":"req-fr-32.md","title":"Objectives Reception","bucket":"functional","kind":"product-requirements","frontmatter":{"id":"req-fr-32","prd-id":"FR-32","title":"Objectives Reception","parent-use-cases":["uc-safe-to-move-framework.md","uc-follow-path.md"],"priority":"High"},"body":"\n<table>\n  <thead>\n    <tr><th>Field</th><th>Description</th></tr>\n  </thead>\n  <tbody>\n    <tr><td>ID</td><td>req-fr-32</td></tr>\n    <tr><td>PRD ID</td><td>FR-32</td></tr>\n    <tr><td>Parent Use Cases</td><td>uc-safe-to-move-framework.md, uc-follow-path.md</td></tr>\n    <tr><td>Priority</td><td>High</td></tr>\n    <tr><td>Requirement Statement</td><td>PRAK shall be capable of receiving Objectives transmitted by a Command and Control (C2) system.</td></tr>\n    <tr><td>Rationale</td><td>Objectives are a command class that co-exists with movement and path requests &mdash; the vehicle may receive movement, path, or Objective commands (an Objective may itself include path and movement).</td></tr>\n    <tr><td>Acceptance Criteria</td><td>PRAK accepts a well-formed Objective from an authorized C2 system over the runtime ICD and makes it available for translation and execution.</td></tr>\n    <tr><td>PRD Coverage</td><td>UC: UC-01, UC-02; Release: R1.0; Goal: PG-01, PG-03</td></tr>\n  </tbody>\n</table>\n","path":"product/requirements/functional/req-fr-32.md","refs_out":[{"field":"parent-use-cases","filename":"uc-safe-to-move-framework.md","title":"Safe to Move Framework","kind":"use-cases"},{"field":"parent-use-cases","filename":"uc-follow-path.md","title":"Follow a Structured Path from Command and Control","kind":"use-cases"}],"refs_in":[]},{"id":"req-fr-33","filename":"req-fr-33.md","title":"Objective Progress Updates","bucket":"functional","kind":"product-requirements","frontmatter":{"id":"req-fr-33","prd-id":"FR-33","title":"Objective Progress Updates","parent-use-cases":["uc-follow-path.md"],"priority":"High"},"body":"\n<table>\n  <thead>\n    <tr><th>Field</th><th>Description</th></tr>\n  </thead>\n  <tbody>\n    <tr><td>ID</td><td>req-fr-33</td></tr>\n    <tr><td>PRD ID</td><td>FR-33</td></tr>\n    <tr><td>Parent Use Cases</td><td>uc-follow-path.md</td></tr>\n    <tr><td>Priority</td><td>High</td></tr>\n    <tr><td>Requirement Statement</td><td>When PRAK receives a service connection request from a Command and Control (C2) system, PRAK shall transmit Objective progress updates, including the current Objective status (Running, Paused, Completed) and the percentage of current Objective completion.</td></tr>\n    <tr><td>Rationale</td><td>Gives C2 observable Objective-level progress, complementing path-execution telemetry (FR-13).</td></tr>\n    <tr><td>Acceptance Criteria</td><td>On a C2 service connection, PRAK transmits the current Objective status (Running / Paused / Completed) and percent-complete.</td></tr>\n    <tr><td>PRD Coverage</td><td>UC: UC-02; Release: R1.0; Goal: PG-04</td></tr>\n  </tbody>\n</table>\n","path":"product/requirements/functional/req-fr-33.md","refs_out":[{"field":"parent-use-cases","filename":"uc-follow-path.md","title":"Follow a Structured Path from Command and Control","kind":"use-cases"}],"refs_in":[]},{"id":"req-fr-34","filename":"req-fr-34.md","title":"Objectives Translation into Vehicle Commands","bucket":"functional","kind":"product-requirements","frontmatter":{"id":"req-fr-34","prd-id":"FR-34","title":"Objectives Translation into Vehicle Commands","parent-use-cases":["uc-follow-path.md"],"priority":"High"},"body":"\n<table>\n  <thead>\n    <tr><th>Field</th><th>Description</th></tr>\n  </thead>\n  <tbody>\n    <tr><td>ID</td><td>req-fr-34</td></tr>\n    <tr><td>PRD ID</td><td>FR-34</td></tr>\n    <tr><td>Parent Use Cases</td><td>uc-follow-path.md</td></tr>\n    <tr><td>Priority</td><td>High</td></tr>\n    <tr><td>Requirement Statement</td><td>PRAK shall translate received Objectives into executable vehicle commands.</td></tr>\n    <tr><td>Rationale</td><td>The execution function for Objectives.</td></tr>\n    <tr><td>Acceptance Criteria</td><td>A received Objective is translated into executable vehicle commands consistent with the configured kinematics and motion limits.</td></tr>\n    <tr><td>PRD Coverage</td><td>UC: UC-02; Release: R1.0; Goal: PG-01, PG-03</td></tr>\n  </tbody>\n</table>\n","path":"product/requirements/functional/req-fr-34.md","refs_out":[{"field":"parent-use-cases","filename":"uc-follow-path.md","title":"Follow a Structured Path from Command and Control","kind":"use-cases"}],"refs_in":[{"field":"parent-product-requirement","filename":"sysreq-stop-on-heading-overshoot.md","title":"Stop on Heading Overshoot During Turn-In-Place","kind":"system-requirements"},{"field":"parent-product-requirement","filename":"sysreq-stop-on-path-deviation.md","title":"Stop on Path Deviation","kind":"system-requirements"},{"field":"parent-product-requirement","filename":"sysreq-turn-in-place-heading-accuracy.md","title":"Turn-In-Place Heading Accuracy","kind":"system-requirements"}]},{"id":"req-fr-35","filename":"req-fr-35.md","title":"Sequential Objective Execution","bucket":"functional","kind":"product-requirements","frontmatter":{"id":"req-fr-35","prd-id":"FR-35","title":"Sequential Objective Execution","parent-use-cases":["uc-follow-path.md"],"priority":"High"},"body":"\n<table>\n  <thead>\n    <tr><th>Field</th><th>Description</th></tr>\n  </thead>\n  <tbody>\n    <tr><td>ID</td><td>req-fr-35</td></tr>\n    <tr><td>PRD ID</td><td>FR-35</td></tr>\n    <tr><td>Parent Use Cases</td><td>uc-follow-path.md</td></tr>\n    <tr><td>Priority</td><td>High</td></tr>\n    <tr><td>Requirement Statement</td><td>PRAK shall execute the assigned Objectives in a predefined sequential order.</td></tr>\n    <tr><td>Rationale</td><td>The Objective-level analogue of executing path segments in the order received.</td></tr>\n    <tr><td>Acceptance Criteria</td><td>Multiple assigned Objectives are executed in the predefined order; out-of-order execution does not occur.</td></tr>\n    <tr><td>PRD Coverage</td><td>UC: UC-02; Release: R1.0; Goal: PG-03</td></tr>\n  </tbody>\n</table>\n","path":"product/requirements/functional/req-fr-35.md","refs_out":[{"field":"parent-use-cases","filename":"uc-follow-path.md","title":"Follow a Structured Path from Command and Control","kind":"use-cases"}],"refs_in":[]},{"id":"req-fr-36","filename":"req-fr-36.md","title":"Report Supported Objectives","bucket":"functional","kind":"product-requirements","frontmatter":{"id":"req-fr-36","prd-id":"FR-36","title":"Report Supported Objectives","parent-use-cases":["uc-follow-path.md"],"priority":"High"},"body":"\n<table>\n  <thead>\n    <tr><th>Field</th><th>Description</th></tr>\n  </thead>\n  <tbody>\n    <tr><td>ID</td><td>req-fr-36</td></tr>\n    <tr><td>PRD ID</td><td>FR-36</td></tr>\n    <tr><td>Parent Use Cases</td><td>uc-follow-path.md</td></tr>\n    <tr><td>Priority</td><td>High</td></tr>\n    <tr><td>Requirement Statement</td><td>PRAK shall report its supported Objectives to the Command and Control (C2) system.</td></tr>\n    <tr><td>Rationale</td><td>Capability advertisement over the runtime ICD so C2 knows which Objective types the vehicle supports.</td></tr>\n    <tr><td>Acceptance Criteria</td><td>PRAK reports the set of supported Objective types to C2 over the runtime ICD.</td></tr>\n    <tr><td>PRD Coverage</td><td>UC: UC-02; Release: R1.0; Goal: PG-04</td></tr>\n  </tbody>\n</table>\n","path":"product/requirements/functional/req-fr-36.md","refs_out":[{"field":"parent-use-cases","filename":"uc-follow-path.md","title":"Follow a Structured Path from Command and Control","kind":"use-cases"}],"refs_in":[]},{"id":"req-fr-37","filename":"req-fr-37.md","title":"Immediate Stop on Stop Command","bucket":"functional","kind":"product-requirements","frontmatter":{"id":"req-fr-37","prd-id":"FR-37","title":"Immediate Stop on Stop Command","parent-use-cases":["uc-safe-to-move-framework.md","uc-follow-path.md","uc-teleoperation.md"],"priority":"Critical"},"body":"\n<table>\n  <thead>\n    <tr><th>Field</th><th>Description</th></tr>\n  </thead>\n  <tbody>\n    <tr><td>ID</td><td>req-fr-37</td></tr>\n    <tr><td>PRD ID</td><td>FR-37</td></tr>\n    <tr><td>Parent Use Cases</td><td>uc-safe-to-move-framework.md, uc-follow-path.md, uc-teleoperation.md</td></tr>\n    <tr><td>Priority</td><td>Critical</td></tr>\n    <tr><td>Requirement Statement</td><td>When PRAK receives a stop motion command, PRAK shall immediately initiate a stop motion command to bring the vehicle to a complete stop.</td></tr>\n    <tr><td>Rationale</td><td>An explicit commanded stop (from C2 or an All-Stop system), distinct from the condition-loss / fault stops PRAK already models.</td></tr>\n    <tr><td>Acceptance Criteria</td><td>On receipt of a stop motion command, PRAK immediately initiates a stop motion command bringing the vehicle to a complete stop within the configured time budget.</td></tr>\n    <tr><td>PRD Coverage</td><td>UC: UC-01, UC-02, UC-04; Release: R1.0; Goal: PG-01, PG-05</td></tr>\n  </tbody>\n</table>\n","path":"product/requirements/functional/req-fr-37.md","refs_out":[{"field":"parent-use-cases","filename":"uc-safe-to-move-framework.md","title":"Safe to Move Framework","kind":"use-cases"},{"field":"parent-use-cases","filename":"uc-follow-path.md","title":"Follow a Structured Path from Command and Control","kind":"use-cases"},{"field":"parent-use-cases","filename":"uc-teleoperation.md","title":"Tele-operate Robot via Manual Control Inputs","kind":"use-cases"}],"refs_in":[]},{"id":"req-fr-38","filename":"req-fr-38.md","title":"Cancel Command Response","bucket":"functional","kind":"product-requirements","frontmatter":{"id":"req-fr-38","prd-id":"FR-38","title":"Cancel Command Response","parent-use-cases":["uc-safe-to-move-framework.md","uc-follow-path.md"],"priority":"Critical"},"body":"\n<table>\n  <thead>\n    <tr><th>Field</th><th>Description</th></tr>\n  </thead>\n  <tbody>\n    <tr><td>ID</td><td>req-fr-38</td></tr>\n    <tr><td>PRD ID</td><td>FR-38</td></tr>\n    <tr><td>Parent Use Cases</td><td>uc-safe-to-move-framework.md, uc-follow-path.md</td></tr>\n    <tr><td>Priority</td><td>Critical</td></tr>\n    <tr><td>Requirement Statement</td><td>When PRAK receives a Cancel command, PRAK shall terminate execution of the current Objective, initiate a stop motion command to bring the vehicle to a complete stop, and cancel the pending Objectives.</td></tr>\n    <tr><td>Rationale</td><td>Mission-lifecycle cancel semantics; pairs with sequential Objective execution (FR-35).</td></tr>\n    <tr><td>Acceptance Criteria</td><td>On a Cancel command, PRAK terminates the current Objective, initiates a stop motion command, and clears the pending Objective queue.</td></tr>\n    <tr><td>PRD Coverage</td><td>UC: UC-01, UC-02; Release: R1.0; Goal: PG-01, PG-05</td></tr>\n  </tbody>\n</table>\n","path":"product/requirements/functional/req-fr-38.md","refs_out":[{"field":"parent-use-cases","filename":"uc-safe-to-move-framework.md","title":"Safe to Move Framework","kind":"use-cases"},{"field":"parent-use-cases","filename":"uc-follow-path.md","title":"Follow a Structured Path from Command and Control","kind":"use-cases"}],"refs_in":[]},{"id":"req-fr-39","filename":"req-fr-39.md","title":"Tele-op Command Authorization Within Limits","bucket":"functional","kind":"product-requirements","frontmatter":{"id":"req-fr-39","prd-id":"FR-39","title":"Tele-op Command Authorization Within Limits","parent-use-cases":["uc-teleoperation.md"],"priority":"Critical"},"body":"\n<table>\n  <thead>\n    <tr><th>Field</th><th>Description</th></tr>\n  </thead>\n  <tbody>\n    <tr><td>ID</td><td>req-fr-39</td></tr>\n    <tr><td>PRD ID</td><td>FR-39</td></tr>\n    <tr><td>Parent Use Cases</td><td>uc-teleoperation.md</td></tr>\n    <tr><td>Priority</td><td>Critical</td></tr>\n    <tr><td>Requirement Statement</td><td>While the vehicle is operating in tele-operation mode, PRAK shall authorize operator commands only if the commands are within predefined operational limits.</td></tr>\n    <tr><td>Rationale</td><td>Bounds tele-op operator authority to predefined operational limits.</td></tr>\n    <tr><td>Acceptance Criteria</td><td>A tele-op operator command outside the predefined operational limits is not authorized; commands within limits are authorized.</td></tr>\n    <tr><td>PRD Coverage</td><td>UC: UC-04; Release: R1.0; Goal: PG-01, PG-05</td></tr>\n  </tbody>\n</table>\n","path":"product/requirements/functional/req-fr-39.md","refs_out":[{"field":"parent-use-cases","filename":"uc-teleoperation.md","title":"Tele-operate Robot via Manual Control Inputs","kind":"use-cases"}],"refs_in":[]},{"id":"req-fr-40","filename":"req-fr-40.md","title":"Tele-op Exclusive Control","bucket":"functional","kind":"product-requirements","frontmatter":{"id":"req-fr-40","prd-id":"FR-40","title":"Tele-op Exclusive Control","parent-use-cases":["uc-teleoperation.md"],"priority":"Critical"},"body":"\n<table>\n  <thead>\n    <tr><th>Field</th><th>Description</th></tr>\n  </thead>\n  <tbody>\n    <tr><td>ID</td><td>req-fr-40</td></tr>\n    <tr><td>PRD ID</td><td>FR-40</td></tr>\n    <tr><td>Parent Use Cases</td><td>uc-teleoperation.md</td></tr>\n    <tr><td>Priority</td><td>Critical</td></tr>\n    <tr><td>Requirement Statement</td><td>While the vehicle is operating in tele-operation mode, PRAK shall implement an exclusive control mechanism to prevent interference from other control sources.</td></tr>\n    <tr><td>Rationale</td><td>Single-authority / control-source arbitration during a tele-op session.</td></tr>\n    <tr><td>Acceptance Criteria</td><td>While a tele-op session is active, commands from other control sources are prevented from interfering with the operator's control.</td></tr>\n    <tr><td>PRD Coverage</td><td>UC: UC-04; Release: R1.0; Goal: PG-05</td></tr>\n  </tbody>\n</table>\n","path":"product/requirements/functional/req-fr-40.md","refs_out":[{"field":"parent-use-cases","filename":"uc-teleoperation.md","title":"Tele-operate Robot via Manual Control Inputs","kind":"use-cases"}],"refs_in":[]},{"id":"req-fr-41","filename":"req-fr-41.md","title":"Tele-op Control Command Latency","bucket":"functional","kind":"product-requirements","frontmatter":{"id":"req-fr-41","prd-id":"FR-41","title":"Tele-op Control Command Latency","parent-use-cases":["uc-teleoperation.md"],"priority":"High"},"body":"\n<table>\n  <thead>\n    <tr><th>Field</th><th>Description</th></tr>\n  </thead>\n  <tbody>\n    <tr><td>ID</td><td>req-fr-41</td></tr>\n    <tr><td>PRD ID</td><td>FR-41</td></tr>\n    <tr><td>Parent Use Cases</td><td>uc-teleoperation.md</td></tr>\n    <tr><td>Priority</td><td>High</td></tr>\n    <tr><td>Requirement Statement</td><td>While the vehicle is operating in tele-operation mode under normal network conditions, PRAK shall respond to remote operator control commands within a maximum latency of 500 milliseconds.</td></tr>\n    <tr><td>Rationale</td><td>Bounds tele-op control-loop responsiveness under normal network conditions.</td></tr>\n    <tr><td>Acceptance Criteria</td><td>Under normal network conditions, the response to a remote operator control command occurs within 500 milliseconds.</td></tr>\n    <tr><td>PRD Coverage</td><td>UC: UC-04; Release: R1.0; Goal: PG-04</td></tr>\n  </tbody>\n</table>\n","path":"product/requirements/functional/req-fr-41.md","refs_out":[{"field":"parent-use-cases","filename":"uc-teleoperation.md","title":"Tele-operate Robot via Manual Control Inputs","kind":"use-cases"}],"refs_in":[]},{"id":"req-fr-42","filename":"req-fr-42.md","title":"Tele-op Full Operator Control","bucket":"functional","kind":"product-requirements","frontmatter":{"id":"req-fr-42","prd-id":"FR-42","title":"Tele-op Full Operator Control","parent-use-cases":["uc-teleoperation.md"],"priority":"High"},"body":"\n<table>\n  <thead>\n    <tr><th>Field</th><th>Description</th></tr>\n  </thead>\n  <tbody>\n    <tr><td>ID</td><td>req-fr-42</td></tr>\n    <tr><td>PRD ID</td><td>FR-42</td></tr>\n    <tr><td>Parent Use Cases</td><td>uc-teleoperation.md</td></tr>\n    <tr><td>Priority</td><td>High</td></tr>\n    <tr><td>Requirement Statement</td><td>While the vehicle is operating in tele-operation mode, PRAK shall provide the remote operator with full control over vehicle speed and vehicle steering.</td></tr>\n    <tr><td>Rationale</td><td>Defines the tele-op operator's direct-control authority over speed and steering.</td></tr>\n    <tr><td>Acceptance Criteria</td><td>While in a tele-op session, the operator can directly control vehicle speed and steering within authorized limits.</td></tr>\n    <tr><td>PRD Coverage</td><td>UC: UC-04; Release: R1.0; Goal: PG-01</td></tr>\n  </tbody>\n</table>\n","path":"product/requirements/functional/req-fr-42.md","refs_out":[{"field":"parent-use-cases","filename":"uc-teleoperation.md","title":"Tele-operate Robot via Manual Control Inputs","kind":"use-cases"}],"refs_in":[]},{"id":"req-pr-01","filename":"req-pr-01.md","title":"Supervisor-Commanded Movement and Navigation","bucket":"product","kind":"product-requirements","frontmatter":{"id":"req-pr-01","prd-id":"PR-01","title":"Supervisor-Commanded Movement and Navigation","parent-use-cases":["uc-safe-to-move-framework.md","uc-follow-path.md"],"priority":"High"},"body":"\n<table>\n  <thead>\n    <tr><th>Field</th><th>Description</th></tr>\n  </thead>\n  <tbody>\n    <tr><td>ID</td><td>req-pr-01</td></tr>\n    <tr><td>PRD ID</td><td>PR-01</td></tr>\n    <tr><td>Parent Use Cases</td><td>uc-safe-to-move-framework.md, uc-follow-path.md</td></tr>\n    <tr><td>Priority</td><td>High</td></tr>\n    <tr><td>Requirement Statement</td><td>PRAK shall enable execution of supervisor-commanded movement and navigation missions issued by a Command and Control (C2) system across all supported foundational use cases.</td></tr>\n    <tr><td>Rationale</td><td><strong>Path Execution:</strong> Defines the core path-following capability &mdash; the robot's ability to consume a sequence of path segments and translate them into the actuation that moves the robot along the path.<br><strong>Tele-op Direct Actuation:</strong> The defining architectural property of tele-op is that the operator is the planner: inputs are real-time motion commands, not goals or paths. Translating them via the planner would add latency and introduce ambiguity over whose plan governs the next motion segment. Direct translation preserves the operator's authority and the real-time control loop the ICD assumes.<br><strong>Motion-Authorization Response:</strong> Closes the request/response loop with C2. A bare authorized/denied result is insufficient &mdash; the operator needs the diagnostic detail to remediate (clear E-Stop, switch to auto, wait for localization, replace a sensor). Without explicit diagnostic content, C2 cannot distinguish a transient block from a configuration error.</td></tr>\n    <tr><td>Acceptance Criteria</td><td><ul><li><strong>Path Execution:</strong> Simulate path received and compare that simulated path traversal matches in the order segments were received.</li><li><strong>Tele-op Direct Actuation:</strong> For each valid tele-op input class (speed, direction, robot-specific commands), the corresponding actuation command is produced within the configured tele-op control-loop latency, with no intermediate path-planning step in the data flow.</li><li><strong>Motion-Authorization Response:</strong> For each evaluation outcome (authorized; denied with each failing condition class from req-safe-to-move-vehicle-state, req-safe-to-move-environment, req-motion-permitted, and req-stop-capable), the response delivered to C2 contains the correct result and, on denial, identifies every failing condition class.</li></ul></td></tr>\n    <tr><td>PRD Coverage</td><td>UC: UC-01, UC-02; Release: R1.0 - R2.0; Goal: PG-01, PG-03</td></tr>\n  </tbody>\n</table>\n","path":"product/requirements/product/req-pr-01.md","refs_out":[{"field":"parent-use-cases","filename":"uc-safe-to-move-framework.md","title":"Safe to Move Framework","kind":"use-cases"},{"field":"parent-use-cases","filename":"uc-follow-path.md","title":"Follow a Structured Path from Command and Control","kind":"use-cases"}],"refs_in":[]},{"id":"req-pr-02","filename":"req-pr-02.md","title":"Stable Runtime and Tele-op ICDs","bucket":"product","kind":"product-requirements","frontmatter":{"id":"req-pr-02","prd-id":"PR-02","title":"Stable Runtime and Tele-op ICDs","parent-use-cases":["uc-safe-to-move-framework.md","uc-follow-path.md","uc-teleoperation.md"],"priority":"High"},"body":"\n<table>\n  <thead>\n    <tr><th>Field</th><th>Description</th></tr>\n  </thead>\n  <tbody>\n    <tr><td>ID</td><td>req-pr-02</td></tr>\n    <tr><td>PRD ID</td><td>PR-02</td></tr>\n    <tr><td>Parent Use Cases</td><td>uc-safe-to-move-framework.md, uc-follow-path.md, uc-teleoperation.md</td></tr>\n    <tr><td>Priority</td><td>High</td></tr>\n    <tr><td>Requirement Statement</td><td>PRAK shall present a single, consistent runtime ICD to Command and Control (C2) and a separate tele-op ICD to Tele-op Controllers, independent of the underlying OEM vehicle platform.</td></tr>\n    <tr><td>Rationale</td><td>The tele-op ICD is composed of a base set defined by PRAK and robot-specific extensions defined by the Robot Mechatronics Dev Team. Accepting a session with an invalid or inconsistent ICD risks runtime ambiguity over what each input means, including safety-critical inputs. Gate the session at negotiation time rather than discovering the inconsistency mid-session.</td></tr>\n    <tr><td>Acceptance Criteria</td><td>For each ICD-validity case (valid base + valid extensions; valid base + missing/conflicting extensions; invalid base), session initiation produces accept-or-reject consistent with the validity outcome and an informative diagnostic when rejected.</td></tr>\n    <tr><td>PRD Coverage</td><td>UC: UC-01, UC-02, UC-04; Release: R1.0; Goal: PG-02, PG-04</td></tr>\n  </tbody>\n</table>\n","path":"product/requirements/product/req-pr-02.md","refs_out":[{"field":"parent-use-cases","filename":"uc-safe-to-move-framework.md","title":"Safe to Move Framework","kind":"use-cases"},{"field":"parent-use-cases","filename":"uc-follow-path.md","title":"Follow a Structured Path from Command and Control","kind":"use-cases"},{"field":"parent-use-cases","filename":"uc-teleoperation.md","title":"Tele-operate Robot via Manual Control Inputs","kind":"use-cases"}],"refs_in":[]},{"id":"req-pr-03","filename":"req-pr-03.md","title":"Observable Runtime State","bucket":"product","kind":"product-requirements","frontmatter":{"id":"req-pr-03","prd-id":"PR-03","title":"Observable Runtime State","parent-use-cases":["uc-safe-to-move-framework.md","uc-follow-path.md","uc-teleoperation.md"],"priority":"High"},"body":"\n<table>\n  <thead>\n    <tr><th>Field</th><th>Description</th></tr>\n  </thead>\n  <tbody>\n    <tr><td>ID</td><td>req-pr-03</td></tr>\n    <tr><td>PRD ID</td><td>PR-03</td></tr>\n    <tr><td>Parent Use Cases</td><td>uc-safe-to-move-framework.md, uc-follow-path.md, uc-teleoperation.md</td></tr>\n    <tr><td>Priority</td><td>High</td></tr>\n    <tr><td>Requirement Statement</td><td>PRAK shall provide observable state to C2 and the Tele-op Controller, including operating mode, mission progress, localization confidence, fault state, and motion-authorization state.</td></tr>\n    <tr><td>Rationale</td><td><strong>Path Execution Telemetry:</strong> Provides continuous insight into the robot's path execution state. Without telemetry during traversal, external systems cannot monitor progress, detect stalls, or correlate the robot's state with operator awareness.<br><strong>Tele-op Situational-Awareness Feedback:</strong> Tele-op requires the operator to close the control loop in real time. Without continuous feedback the operator is flying blind &mdash; particularly in scenarios where the robot has overridden an input (per `req-teleop-motion-limit-conformance`) and the operator's mental model of robot state has drifted from reality. The robot-specific feedback channels are owned by the Robot Mechatronics Dev Team via the ICD extension; PRAK requires that the publishing channel exists and meets the cadence.<br><strong>Motion-Authorization Response:</strong> Closes the request/response loop with C2. A bare authorized/denied result is insufficient &mdash; the operator needs the diagnostic detail to remediate (clear E-Stop, switch to auto, wait for localization, replace a sensor). Without explicit diagnostic content, C2 cannot distinguish a transient block from a configuration error.</td></tr>\n    <tr><td>Acceptance Criteria</td><td><ul><li><strong>Path Execution Telemetry:</strong> Path telemetry is available and consumable</li><li><strong>Tele-op Situational-Awareness Feedback:</strong> For each feedback channel defined in the active ICD (base + extension), feedback frames are published to the tele-op controller at or above the configured cadence; missed frames trigger ICD-defined staleness handling at the consumer.</li><li><strong>Motion-Authorization Response:</strong> For each evaluation outcome (authorized; denied with each failing condition class from req-safe-to-move-vehicle-state, req-safe-to-move-environment, req-motion-permitted, and req-stop-capable), the response delivered to C2 contains the correct result and, on denial, identifies every failing condition class.</li></ul></td></tr>\n    <tr><td>PRD Coverage</td><td>UC: UC-01, UC-02, UC-04; Release: R1.0; Goal: PG-04</td></tr>\n  </tbody>\n</table>\n","path":"product/requirements/product/req-pr-03.md","refs_out":[{"field":"parent-use-cases","filename":"uc-safe-to-move-framework.md","title":"Safe to Move Framework","kind":"use-cases"},{"field":"parent-use-cases","filename":"uc-follow-path.md","title":"Follow a Structured Path from Command and Control","kind":"use-cases"},{"field":"parent-use-cases","filename":"uc-teleoperation.md","title":"Tele-operate Robot via Manual Control Inputs","kind":"use-cases"}],"refs_in":[]},{"id":"req-pr-04","filename":"req-pr-04.md","title":"Integrable Framework for OEM Vehicle Platforms","bucket":"product","kind":"product-requirements","frontmatter":{"id":"req-pr-04","prd-id":"PR-04","title":"Integrable Framework for OEM Vehicle Platforms","parent-use-cases":["uc-path-to-actuation-framework.md"],"priority":"High"},"body":"\n<table>\n  <thead>\n    <tr><th>Field</th><th>Description</th></tr>\n  </thead>\n  <tbody>\n    <tr><td>ID</td><td>req-pr-04</td></tr>\n    <tr><td>PRD ID</td><td>PR-04</td></tr>\n    <tr><td>Parent Use Cases</td><td>uc-path-to-actuation-framework.md</td></tr>\n    <tr><td>Priority</td><td>High</td></tr>\n    <tr><td>Requirement Statement</td><td>PRAK shall be integrable into supported OEM vehicle platforms by Robot Mechatronics Dev Teams through documented, versioned HW and SW integration boundaries (UC-05).</td></tr>\n    <tr><td>Rationale</td><td><strong>HW Interface Contract Publication:</strong> Without a stable HW interface contract, dev teams cannot reliably integrate the framework &mdash; every PRAK release would force re-integration. Versioning the contract gives the dev team a predictable upgrade surface and a basis for the HW-reference-deviation conversation called out in the use case alt flows.<br><strong>Framework Distribution Forms:</strong> Dev teams differ in their build environments and the depth of integration they need. Source enables deep customization, libraries support clean linking against existing build systems, and buildable applications provide a reference integration point. Forcing a single form would block adoption for teams whose tooling doesn't match.<br><strong>Framework Build Integration Dependencies:</strong> The framework is not self-contained &mdash; it depends on the polymorphous software path-following module that EPT owns and on PRAK-supplied glue code. The dev team needs a versioned dependency set so their build is reproducible and so PRAK / polymorphous version drift can be detected at build time rather than at integration test time.</td></tr>\n    <tr><td>Acceptance Criteria</td><td><ul><li><strong>HW Interface Contract Publication:</strong> Each HW interface contract artifact (BSP, wiring, mounting, sensor/actuator) is present in the PRAK distribution, carries a version identifier, and matches the version the bundled framework integrates against.</li><li><strong>Framework Distribution Forms:</strong> The framework is available from the PRAK distribution in all three forms; each form is independently buildable and consumable in a reference dev-environment that matches the documented configuration.</li><li><strong>Framework Build Integration Dependencies:</strong> The PRAK distribution lists every SW build dependency of the framework, each pinned to a specific version; building the framework from a clean dev environment using only the listed dependencies produces an integratable artifact.</li></ul></td></tr>\n    <tr><td>PRD Coverage</td><td>UC: UC-05; Release: R1.0; Goal: PG-02</td></tr>\n  </tbody>\n</table>\n","path":"product/requirements/product/req-pr-04.md","refs_out":[{"field":"parent-use-cases","filename":"uc-path-to-actuation-framework.md","title":"Path-to-Actuation Framework","kind":"use-cases"}],"refs_in":[]},{"id":"req-pr-05","filename":"req-pr-05.md","title":"Operate Within Envelope; Transition to Safe State","bucket":"product","kind":"product-requirements","frontmatter":{"id":"req-pr-05","prd-id":"PR-05","title":"Operate Within Envelope; Transition to Safe State","parent-use-cases":["uc-safe-to-move-framework.md","uc-follow-path.md","uc-teleoperation.md"],"priority":"Critical"},"body":"\n<table>\n  <thead>\n    <tr><th>Field</th><th>Description</th></tr>\n  </thead>\n  <tbody>\n    <tr><td>ID</td><td>req-pr-05</td></tr>\n    <tr><td>PRD ID</td><td>PR-05</td></tr>\n    <tr><td>Parent Use Cases</td><td>uc-safe-to-move-framework.md, uc-follow-path.md, uc-teleoperation.md</td></tr>\n    <tr><td>Priority</td><td>Critical</td></tr>\n    <tr><td>Requirement Statement</td><td>PRAK shall remain within a defined operating envelope and transition to a defined safe state when operation outside the envelope is detected.</td></tr>\n    <tr><td>Rationale</td><td><strong>Motion-Authorization Loss During Path Execution:</strong> Motion-authorization is a continuous precondition for motion, not a one-shot gate. Sensors fault, geofence updates, E-Stop latches, stop capability degrades &mdash; any of these can invalidate the authorization mid-mission. The robot must not continue executing a C2-supplied path under conditions the gate would no longer accept. Reporting the loss to C2 gives the operator the diagnostic context needed to decide on recovery. Mirrors `req-teleop-motion-authorization-loss` for the navigation use cases. Distinct from `req-path-execution-failure` because the failing cause is a system-state authorization condition rather than a path-execution-specific runtime condition (fault, obstacle, deviation, blocked route).<br><strong>Tele-op Motion-Authorization Loss Handling:</strong> Motion-authorization is a continuous precondition for motion, not a one-shot gate. Sensors fault, geofence updates, E-Stop latches, stop capability degrades &mdash; any of these can invalidate the authorization mid-session. The tele-op operator must not be able to continue commanding motion under conditions the gate would no longer accept. Reporting the loss to the tele-op controller gives the operator the diagnostic context to know why the robot stopped responding to inputs. Establishes the in-motion-revalidation pattern that the navigation UCs will mirror once that gap is addressed.</td></tr>\n    <tr><td>Acceptance Criteria</td><td><ul><li><strong>Motion-Authorization Loss During Path Execution:</strong> For each motion-authorization condition class (Safe-to-Move, Motion-Permitted, Stop-Capable), simulation of the condition becoming false during path execution produces (a) transition to a safe or stopped state within the configured detection latency and (b) a motion-authorization-loss notification consumable by C2 identifying the failing condition class.</li><li><strong>Tele-op Motion-Authorization Loss Handling:</strong> For each motion-authorization condition class, simulation of the condition becoming false during a tele-op session produces (a) transition to a safe or stopped state within the configured detection latency and (b) a motion-authorization-loss notification consumable by the tele-op controller identifying the failing condition.</li></ul></td></tr>\n    <tr><td>PRD Coverage</td><td>UC: UC-01, UC-02, UC-04; Release: R1.0; Goal: PG-01, PG-05</td></tr>\n  </tbody>\n</table>\n","path":"product/requirements/product/req-pr-05.md","refs_out":[{"field":"parent-use-cases","filename":"uc-safe-to-move-framework.md","title":"Safe to Move Framework","kind":"use-cases"},{"field":"parent-use-cases","filename":"uc-follow-path.md","title":"Follow a Structured Path from Command and Control","kind":"use-cases"},{"field":"parent-use-cases","filename":"uc-teleoperation.md","title":"Tele-operate Robot via Manual Control Inputs","kind":"use-cases"}],"refs_in":[]},{"id":"req-pr-06","filename":"req-pr-06.md","title":"Remote/All Stop Safety Capability","bucket":"product","kind":"product-requirements","frontmatter":{"id":"req-pr-06","prd-id":"PR-06","title":"Remote/All Stop Safety Capability","parent-use-cases":["uc-safe-to-move-framework.md"],"priority":"Critical"},"body":"\n<table>\n  <thead>\n    <tr><th>Field</th><th>Description</th></tr>\n  </thead>\n  <tbody>\n    <tr><td>ID</td><td>req-pr-06</td></tr>\n    <tr><td>PRD ID</td><td>PR-06</td></tr>\n    <tr><td>Parent Use Cases</td><td>uc-safe-to-move-framework.md</td></tr>\n    <tr><td>Priority</td><td>Critical</td></tr>\n    <tr><td>Requirement Statement</td><td>PRAK shall provide a remote-stop safety capability whereby, on receipt of a stop command from an authorized external stop source or on loss of communication with that source, the system initiates a stop command to bring the vehicle to a controlled stop.</td></tr>\n    <tr><td>Rationale</td><td>The capability is realized through framework-emitted stop commands (the framework issues stop commands; the integrated robot performs the physical stop), consistent with the motion-authorization safe-state model.</td></tr>\n    <tr><td>Acceptance Criteria</td><td>On a stop command from an authorized external stop source, and on loss of communication with that source, PRAK issues a stop command that brings the vehicle to a controlled stop within the configured time budget; the child system requirements (system/requirements/remote-stop/) are each satisfied.</td></tr>\n    <tr><td>PRD Coverage</td><td>UC: UC-01; Release: R1.0; Goal: PG-01, PG-05</td></tr>\n  </tbody>\n</table>\n","path":"product/requirements/product/req-pr-06.md","refs_out":[{"field":"parent-use-cases","filename":"uc-safe-to-move-framework.md","title":"Safe to Move Framework","kind":"use-cases"}],"refs_in":[{"field":"parent-product-requirement","filename":"sysreq-active-stop-mode-query.md","title":"Active Stop Mode Query Interface","kind":"system-requirements"},{"field":"parent-product-requirement","filename":"sysreq-all-stop-continuous-monitor.md","title":"All Stop Continuous Communication Monitor","kind":"system-requirements"},{"field":"parent-product-requirement","filename":"sysreq-all-stop-failed-event-fault-log.md","title":"Fault Log on Failed All Stop Event Publish","kind":"system-requirements"},{"field":"parent-product-requirement","filename":"sysreq-all-stop-in-every-build.md","title":"All Stop Included in Every Build","kind":"system-requirements"},{"field":"parent-product-requirement","filename":"sysreq-all-stop-interface
